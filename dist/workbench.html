/* ===== records.js ===== */
/* ============================================
 * records.js - 日常记录模块（重构）
 * 板块目录 → 按日期列表 → 富文本编辑页（contenteditable + 工具栏 + 涂鸦）
 * ============================================ */

const Records = (function () {

  const MOOD_OPTIONS = ['开心', '平淡', '疲惫', '焦虑', '兴奋', '低落', '感恩', '愤怒'];
  let savedRange = null; // 富文本选区保存

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>✏️ 日常记录</h2>
        <div class="module-subtitle">随笔 · 心情 · 图片 · 习惯 · ${App.formatDate(date)}</div>
      </div>

      <div class="flex-between mb-16">
        <div class="text-muted text-sm">选择一个板块查看记录</div>
        <button class="btn" id="addRecordBoardBtn">+ 新增板块</button>
      </div>

      <div id="recordsBoardsContainer" class="dir-list"></div>
    `;
    renderBoards();
    bindEvents();
  }

  function renderBoards() {
    const container = document.getElementById('recordsBoardsContainer');
    const boards = Store.getRecordBoards();
    if (boards.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✏️</div>暂无板块，点击右上角创建</div>';
      return;
    }
    container.innerHTML = boards.map(b => {
      const count = Store.getRecordEntries(b.id).length;
      return `
        <div class="dir-item board-dir-item" data-id="${b.id}">
          <span class="dir-item-icon">${getBoardIcon(b.type)}</span>
          <span class="dir-item-main">
            <span class="dir-item-title">${App.escapeHtml(b.name)}</span>
            <span class="dir-item-sub">${getBoardTypeLabel(b.type)} · ${count} 条记录</span>
          </span>
          <span class="dir-item-actions">
            <button class="btn-text edit-board-btn" data-id="${b.id}" style="font-size:12px;">重命名</button>
            <button class="btn-text danger delete-board-btn" data-id="${b.id}" style="font-size:12px;">删除</button>
          </span>
          <span class="dir-item-arrow">›</span>
        </div>`;
    }).join('');

    container.querySelectorAll('.board-dir-item').forEach(el => {
      el.addEventListener('click', function (e) {
        if (e.target.closest('.edit-board-btn') || e.target.closest('.delete-board-btn')) return;
        renderBoardPage(this.dataset.id);
      });
    });
    container.querySelectorAll('.edit-board-btn').forEach(btn => btn.addEventListener('click', function () { showEditBoardModal(this.dataset.id); }));
    container.querySelectorAll('.delete-board-btn').forEach(btn => btn.addEventListener('click', function () {
      if (confirm('删除板块将同时删除该板块下所有记录，确定？')) { Store.deleteRecordBoard(this.dataset.id); renderBoards(); App.toast('已删除板块', 'success'); }
    }));
  }

  // 板块下一页：按日期排列的记录列表
  function renderBoardPage(boardId) {
    const board = Store.getRecordBoards().find(b => b.id === boardId);
    if (!board) return;
    const entries = Store.getRecordEntries(boardId).slice().sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

    // 按日期分组
    const groups = {};
    entries.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });

    const container = document.getElementById('contentArea');
    container.innerHTML = `
      <div class="module-header">
        <button class="btn-text" id="boardBackBtn">← 返回</button>
        <span style="margin-left:8px;">${getBoardIcon(board.type)} ${App.escapeHtml(board.name)}</span>
      </div>
      <div class="flex-between mb-16">
        <div class="text-muted text-sm">共 ${entries.length} 条记录</div>
        <button class="btn btn-primary btn-sm" id="newEntryBtn">+ 新建记录</button>
      </div>
      <div id="boardEntriesList"></div>
    `;

    const listEl = container.querySelector('#boardEntriesList');
    if (entries.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + getBoardIcon(board.type) + '</div>暂无记录，点击「新建记录」</div>';
    } else {
      listEl.innerHTML = Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
        const items = groups[date].slice().sort((a, b) => b.createdAt - a.createdAt);
        return `
          <div class="record-date-group">
            <div class="record-date-label">${App.formatDate(date)} <span class="text-xs text-muted">(${items.length})</span></div>
            ${items.map(e => renderEntryRow(board, e)).join('')}
          </div>`;
      }).join('');
    }

    container.querySelector('#boardBackBtn').addEventListener('click', function () { render(container); });
    container.querySelector('#newEntryBtn').addEventListener('click', function () { renderEditor(null, boardId); });
    listEl.querySelectorAll('.entry-row').forEach(row => {
      row.addEventListener('click', function () { renderEditor(this.dataset.id, boardId); });
    });
    listEl.querySelectorAll('.entry-del-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('确定删除该记录？')) { Store.deleteRecordEntry(this.dataset.id); App.toast('已删除', 'success'); renderBoardPage(boardId); }
      });
    });
  }

  function renderEntryRow(board, e) {
    let preview = '';
    if (board.type === 'mood') {
      preview = `<span class="mood-tag-display">${getMoodIcon(e.mood)} ${App.escapeHtml(e.mood || '')}</span>`;
    } else if (board.type === 'habit') {
      preview = `<span class="fw-600">${App.escapeHtml(e.content)}</span> <span class="tag" style="cursor:default;">🔥 ${e.habitStreak || 0} 天</span>`;
    } else if (board.type === 'image') {
      const firstImg = (e.images && e.images[0]) ? `<img src="${e.images[0]}" class="entry-thumb">` : '';
      preview = firstImg + `<span class="text-sm text-muted">${App.escapeHtml(e.content || '').slice(0, 30) || '图片记录'}</span>`;
    } else {
      const text = e.content ? e.content.replace(/<[^>]+>/g, '').slice(0, 40) : '';
      preview = `<span class="text-sm">${App.escapeHtml(text) || '<span class="text-muted">空</span>'}</span>`;
    }
    return `
      <div class="list-item entry-row" data-id="${e.id}" style="cursor:pointer;">
        <div class="flex-1">${preview}</div>
        <span class="text-xs text-muted">${e.date}</span>
        <button class="btn-text danger entry-del-btn" data-id="${e.id}" style="margin-left:6px;">删除</button>
      </div>`;
  }

  // 富文本编辑页
  function renderEditor(id, boardId) {
    const board = Store.getRecordBoards().find(b => b.id === boardId);
    const entry = id ? Store.getRecordEntries(boardId).find(e => e.id === id) : null;
    const container = document.getElementById('contentArea');

    container.innerHTML = `
      <div class="module-header">
        <button class="btn-text" id="editorBackBtn">← 返回</button>
        <span style="margin-left:8px;">${entry ? '编辑记录' : '新建记录'}</span>
      </div>

      ${board.type === 'mood' ? `
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">心情</label>
          <div class="flex-row flex-wrap mood-picker" id="moodPicker">
            ${MOOD_OPTIONS.map(m => `<span class="tag mood-tag ${entry && entry.mood === m ? 'selected' : ''}" data-mood="${m}">${getMoodIcon(m)} ${m}</span>`).join('')}
          </div>
        </div>` : ''}

      ${board.type === 'habit' ? `
        <div class="grid-2 mb-12">
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">习惯名称</label>
            <input type="text" class="input" id="habitName" value="${entry ? App.escapeHtml(entry.content) : ''}" placeholder="如：早起喝水">
          </div>
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">重复周期</label>
            <select class="select" id="habitPeriod">
              <option value="daily" ${(entry && entry.habitPeriod === 'daily') || !entry ? 'selected' : ''}>每日</option>
              <option value="weekly" ${entry && entry.habitPeriod === 'weekly' ? 'selected' : ''}>每周</option>
            </select>
          </div>
        </div>` : ''}

      <div class="rich-editor-toolbar">
        <button class="re-tool" data-cmd="fontSmall" title="减小字号">A-</button>
        <button class="re-tool" data-cmd="fontLarge" title="增大字号">A+</button>
        <span class="re-divider"></span>
        <input type="color" class="re-color" id="reColor" value="#2C3E3A" title="文字颜色">
        <button class="re-tool" data-cmd="bold" title="加粗"><b>B</b></button>
        <button class="re-tool" data-cmd="italic" title="斜体"><i>I</i></button>
        <button class="re-tool" data-cmd="underline" title="下划线"><u>U</u></button>
        <button class="re-tool" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
        <span class="re-divider"></span>
        <button class="re-tool" data-cmd="justifyLeft" title="左对齐">⬅</button>
        <button class="re-tool" data-cmd="justifyCenter" title="居中">⬌</button>
        <button class="re-tool" data-cmd="justifyRight" title="右对齐">➡</button>
        <span class="re-divider"></span>
        <button class="re-tool" data-cmd="insertUnorderedList" title="无序列表">•≡</button>
        <button class="re-tool" data-cmd="insertOrderedList" title="有序列表">1≡</button>
        <span class="re-divider"></span>
        <button class="re-tool" data-cmd="insertImage" title="插入图片">🖼</button>
        <button class="re-tool" data-cmd="doodle" title="涂鸦">✎</button>
      </div>

      <div class="rich-editor" id="richEditor" contenteditable="true" style="${entry && entry.color ? 'color:' + App.escapeHtml(entry.color) + ';' : ''}${entry && entry.fontSize ? 'font-size:' + App.escapeHtml(entry.fontSize) + ';' : ''}${entry && entry.fontFamily ? 'font-family:' + App.escapeHtml(entry.fontFamily) + ';' : ''}">${entry ? entry.content : ''}</div>

      <div class="doodle-area" id="doodleArea" style="display:none;">
        <canvas id="doodleCanvas" width="320" height="180" class="doodle-canvas"></canvas>
        <div class="flex-row mt-8" style="gap:8px;">
          <button class="btn btn-sm" id="doodleClear">清除</button>
          <button class="btn btn-sm btn-primary" id="doodleInsert">插入到正文</button>
        </div>
      </div>

      <input type="file" id="imageFileInput" accept="image/*" style="display:none;">

      <div class="flex-row mt-16" style="gap:8px;justify-content:flex-end;">
        <button class="btn" id="editorCancelBtn">取消</button>
        <button class="btn btn-primary" id="editorSaveBtn">保存</button>
      </div>
    `;

    bindEditor(container, board, entry);
  }

  function bindEditor(container, board, entry) {
    const editor = container.querySelector('#richEditor');
    const colorInput = container.querySelector('#reColor');

    function saveSel() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
    }
    function restoreSel() {
      editor.focus();
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }
    editor.addEventListener('keyup', saveSel);
    editor.addEventListener('mouseup', saveSel);

    // 工具栏命令
    container.querySelectorAll('.re-tool').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        const cmd = this.dataset.cmd;
        restoreSel();
        if (cmd === 'fontSmall' || cmd === 'fontLarge') {
          // 调整整段或选区字号
          const cur = parseInt(getComputedStyle(editor).fontSize) || 14;
          const next = cmd === 'fontLarge' ? cur + 2 : Math.max(10, cur - 2);
          document.execCommand('fontSize', false, '7');
          // fontSize 7 是最大，需替换字体大小为具体 px
          const fonts = editor.querySelectorAll('font[size]');
          fonts.forEach(f => {
            f.removeAttribute('size');
            f.style.fontSize = next + 'px';
          });
        } else if (cmd === 'insertImage') {
          container.querySelector('#imageFileInput').click();
        } else if (cmd === 'doodle') {
          const da = container.querySelector('#doodleArea');
          da.style.display = da.style.display === 'none' ? 'block' : 'none';
          if (da.style.display === 'block') initDoodle(container);
        } else {
          document.execCommand(cmd, false, null);
        }
        saveSel();
      });
    });

    // 颜色
    colorInput.addEventListener('input', function () {
      restoreSel();
      document.execCommand('foreColor', false, this.value);
      saveSel();
    });

    // 插入图片
    container.querySelector('#imageFileInput').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        restoreSel();
        document.execCommand('insertImage', false, ev.target.result);
        saveSel();
      };
      reader.readAsDataURL(file);
      this.value = '';
    });

    // 涂鸦
    function initDoodle(c) {
      const canvas = c.querySelector('#doodleCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#2C3E3A';
      ctx.lineWidth = 2;
      let drawing = false;
      const pos = e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return { x: x * scaleX, y: y * scaleY };
      };
      const start = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const end = () => { drawing = false; };
      canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
      canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
      c.querySelector('#doodleClear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
      c.querySelector('#doodleInsert').onclick = () => {
        const dataUrl = canvas.toDataURL('image/png');
        restoreSel();
        document.execCommand('insertImage', false, dataUrl);
        c.querySelector('#doodleArea').style.display = 'none';
        saveSel();
      };
    }

    // 心情选择
    const moodPicker = container.querySelector('#moodPicker');
    if (moodPicker) {
      moodPicker.querySelectorAll('.mood-tag').forEach(tag => {
        tag.addEventListener('click', function () {
          moodPicker.querySelectorAll('.mood-tag').forEach(t => t.classList.remove('selected'));
          this.classList.add('selected');
        });
      });
    }

    // 保存
    container.querySelector('#editorSaveBtn').addEventListener('click', function () {
      const content = editor.innerHTML.trim();
      if (!content && board.type !== 'habit' && board.type !== 'mood') {
        App.toast('请输入内容', 'warning'); return;
      }
      // 提取图片
      const imgs = [];
      editor.querySelectorAll('img').forEach(img => { if (img.src) imgs.push(img.src); });
      const fontSize = editor.style.fontSize || '';
      const fontFamily = editor.style.fontFamily || '';
      const color = editor.style.color || '';

      const data = { boardId: board.id, content, images: imgs, fontSize, fontFamily, color };

      if (board.type === 'mood') {
        const sel = moodPicker ? moodPicker.querySelector('.mood-tag.selected') : null;
        if (!sel) { App.toast('请选择心情', 'warning'); return; }
        data.mood = sel.dataset.mood;
      } else if (board.type === 'habit') {
        const name = container.querySelector('#habitName').value.trim();
        if (!name) { App.toast('请输入习惯名称', 'warning'); return; }
        data.content = name;
        data.habitPeriod = container.querySelector('#habitPeriod').value;
        const streak = computeHabitStreak(board.id, name, entry ? entry.id : null);
        data.habitStreak = streak;
      }

      if (entry) Store.updateRecordEntry(entry.id, data);
      else Store.addRecordEntry(data);
      App.toast('已保存', 'success');
      renderBoardPage(board.id);
    });

    container.querySelector('#editorCancelBtn').addEventListener('click', function () { renderBoardPage(board.id); });
    container.querySelector('#editorBackBtn').addEventListener('click', function () { renderBoardPage(board.id); });
  }

  function computeHabitStreak(boardId, name, excludeId) {
    const today = Store.getCurrentDate();
    const others = Store.getRecordEntries(boardId).filter(e => e.id !== excludeId && e.content === name);
    if (others.length === 0) return 1;
    const latest = others.sort((a, b) => b.date.localeCompare(a.date))[0];
    if (latest.lastCheckDate === today) return latest.habitStreak || 1;
    const lastDate = new Date(latest.lastCheckDate);
    const todayDate = new Date(today);
    const diffDays = Math.round((todayDate - lastDate) / 86400000);
    if ((latest.habitPeriod || 'daily') === 'daily' && diffDays === 1) return (latest.habitStreak || 0) + 1;
    if ((latest.habitPeriod || 'daily') === 'weekly' && diffDays <= 7) return (latest.habitStreak || 0) + 1;
    return 1;
  }

  // ============ 弹窗 ============
  function showEditBoardModal(id) {
    const board = Store.getRecordBoards().find(b => b.id === id);
    if (!board) return;
    App.modal('重命名板块', `
      <div class="mb-12"><input type="text" class="input" id="boardName" value="${App.escapeHtml(board.name)}"></div>
    `, [
      { label: '取消' },
      { label: '保存', primary: true, onClick: function (body) {
          const name = body.querySelector('#boardName').value.trim();
          if (!name) { App.toast('请输入名称', 'warning'); return false; }
          Store.updateRecordBoard(id, { name });
          renderBoards(); App.toast('已更新', 'success');
        } }
    ]);
  }

  function showAddBoardModal() {
    App.modal('新增板块', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">板块名称</label>
        <input type="text" class="input" id="newBoardName" placeholder="如：读书笔记">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">板块类型</label>
        <select class="select" id="newBoardType">
          <option value="note">📝 随笔（纯文字）</option>
          <option value="mood">😊 心情记录（带心情标签）</option>
          <option value="image">📷 图片记录（多图+文字）</option>
          <option value="habit">🔁 习惯打卡（周期+连续天数）</option>
        </select>
      </div>
    `, [
      { label: '取消' },
      { label: '创建', primary: true, onClick: function (body) {
          const name = body.querySelector('#newBoardName').value.trim();
          if (!name) { App.toast('请输入板块名称', 'warning'); return false; }
          Store.addRecordBoard(name, body.querySelector('#newBoardType').value);
          renderBoards(); App.toast('板块已创建', 'success');
        } }
    ]);
  }

  function bindEvents() {
    document.getElementById('addRecordBoardBtn').addEventListener('click', showAddBoardModal);
  }

  function getBoardIcon(type) {
    const icons = { note: '📝', mood: '😊', image: '📷', habit: '🔁' };
    return icons[type] || '📝';
  }
  function getBoardTypeLabel(type) {
    const labels = { note: '随笔', mood: '心情', image: '图片', habit: '习惯' };
    return labels[type] || '随笔';
  }
  function getMoodIcon(mood) {
    const icons = { '开心': '😄', '平淡': '😐', '疲惫': '😵', '焦虑': '😰', '兴奋': '🤩', '低落': '😢', '感恩': '🙏', '愤怒': '😡' };
    return icons[mood] || '😐';
  }

  return { render };
})();


/* ===== countdown.js ===== */
/* ============================================
 * countdown.js - 倒数日模块（Days Matter 风格）
 * 卡片网格 · 天数计算 · 详情页 · 背景色/图 · 布局切换
 * ============================================ */

const Countdown = (function () {

  // 纯色背景选项（至少 6 色）
  const BG_COLORS = [
    '#6B9B95', '#C9786E', '#C9A24E', '#7BA0B8',
    '#9DBF9E', '#B07CC9', '#D4855E', '#5A8079'
  ];

  // 当前布局：'two' | 'one'
  let layout = 'two';

  function diffDays(dateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((target - today) / 86400000);
    return diff; // >=0 表示未来（倒数），<0 表示已过去
  }

  function render(container) {
    const list = Store.getCountdowns().slice().sort((a, b) => a.date.localeCompare(b.date));
    if (list.length > 0) layout = list[0].layout || 'two';

    container.innerHTML = `
      <div class="module-header flex-between" style="display:flex;align-items:center;">
        <div>
          <h2>⏳ 倒数日</h2>
          <div class="module-subtitle">重要日子的倒数与累计</div>
        </div>
        <div class="flex-row" style="gap:8px;">
          <button class="btn btn-sm" id="layoutToggleBtn" title="切换布局">${layout === 'two' ? '▦' : '▤'}</button>
          <button class="btn btn-primary btn-sm" id="addCountdownBtn">+ 添加</button>
        </div>
      </div>

      <div id="countdownListArea" class="${layout === 'two' ? 'countdown-grid grid-2' : 'countdown-grid countdown-grid-one'}">
        ${list.length === 0 ? '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">⏳</div>还没有倒数日，点击右上角添加</div>' : list.map(c => renderCard(c)).join('')}
      </div>
    `;

    bindEvents();
  }

  function renderCard(c) {
    const diff = diffDays(c.date);
    const isFuture = diff >= 0;
    const bg = c.bg || BG_COLORS[0];
    const isImage = bg && (bg.startsWith('data:') || bg.startsWith('http'));
    const style = isImage
      ? `background-image:url('${bg}');background-size:cover;background-position:center;`
      : `background:${bg};`;

    return `
      <div class="countdown-card" data-id="${c.id}" style="${style}">
        <div class="countdown-card-overlay">
          <div class="countdown-bar">${App.escapeHtml(c.title)}</div>
          <div class="countdown-body">
            <div class="countdown-days">${Math.abs(diff)}</div>
            <div class="countdown-label">${isFuture ? '距离 ' + App.escapeHtml(c.title) + ' 还有' : App.escapeHtml(c.title) + ' 已经'}</div>
            <div class="countdown-date">${c.date}</div>
          </div>
        </div>
      </div>
    `;
  }

  function bindEvents() {
    document.getElementById('addCountdownBtn').addEventListener('click', function () {
      showEditModal(null);
    });
    document.getElementById('layoutToggleBtn').addEventListener('click', function () {
      layout = layout === 'two' ? 'one' : 'two';
      // 同步到第一条记录（用于持久化布局偏好）
      const list = Store.getCountdowns();
      if (list.length > 0) Store.updateCountdown(list[0].id, { layout: layout });
      render(document.getElementById('contentArea'));
    });
    document.querySelectorAll('.countdown-card').forEach(card => {
      card.addEventListener('click', function () {
        openDetail(this.dataset.id);
      });
    });
  }

  // 详情页
  function openDetail(id) {
    const c = Store.getCountdown(id);
    if (!c) return;
    const diff = diffDays(c.date);
    const isFuture = diff >= 0;
    const bg = c.bg || BG_COLORS[0];
    const isImage = bg && (bg.startsWith('data:') || bg.startsWith('http'));
    const style = isImage
      ? `background-image:url('${bg}');background-size:cover;background-position:center;`
      : `background:${bg};`;

    const container = document.getElementById('contentArea');
    container.innerHTML = `
      <div class="module-header">
        <button class="btn-text" id="backBtn">← 返回</button>
      </div>
      <div class="countdown-detail" style="${style}">
        <div class="countdown-detail-overlay">
          <div class="countdown-detail-days">${Math.abs(diff)}</div>
          <div class="countdown-detail-title">${App.escapeHtml(c.title)}</div>
          <div class="countdown-detail-sub">${isFuture ? '距离今天还有' : '已经过去'} · ${c.date}</div>
          ${c.detail ? `<div class="countdown-detail-desc">${App.escapeHtml(c.detail)}</div>` : ''}
          <div class="countdown-detail-actions">
            <button class="btn countdown-act-btn" id="shareBtn">📤 分享</button>
            <button class="btn countdown-act-btn" id="saveImgBtn">🖼 存为图片</button>
            <button class="btn countdown-act-btn" id="bgBtn">🎨 背景</button>
            <button class="btn countdown-act-btn" id="editBtn">✏️ 编辑</button>
          </div>
        </div>
      </div>
    `;

    container.querySelector('#backBtn').addEventListener('click', function () {
      render(container);
    });
    container.querySelector('#editBtn').addEventListener('click', function () {
      showEditModal(id, function () { render(container); });
    });
    container.querySelector('#bgBtn').addEventListener('click', function () {
      showBgModal(id, function () { openDetail(id); });
    });
    container.querySelector('#shareBtn').addEventListener('click', function () {
      App.toast('分享功能：可长按上方卡片截图分享', 'info');
    });
    container.querySelector('#saveImgBtn').addEventListener('click', function () {
      App.toast('存为图片：可长按或截图保存卡片', 'info');
    });
  }

  // 新增/编辑弹窗
  function showEditModal(id, onSaved) {
    const c = id ? Store.getCountdown(id) : null;
    App.modal(id ? '编辑倒数日' : '新增倒数日', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">事件标题</label>
        <input type="text" class="input" id="cdTitle" value="${c ? App.escapeHtml(c.title) : ''}" placeholder="如：考研倒计时">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">目标日期</label>
        <input type="date" class="input" id="cdDate" value="${c ? c.date : Store.getCurrentDate()}">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">详情描述（可选）</label>
        <textarea class="textarea" id="cdDetail" rows="3" placeholder="备注说明…">${c ? App.escapeHtml(c.detail || '') : ''}</textarea>
      </div>
      ${c ? `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">背景</label>
        <div class="flex-row flex-wrap" style="gap:6px;">
          ${BG_COLORS.map(col => `<span class="cd-color-swatch" data-color="${col}" style="background:${col};${c.bg === col ? 'outline:2px solid var(--celadon-dark);outline-offset:2px;' : ''}"></span>`).join('')}
          ${c.bg && c.bg.startsWith('data:') ? '<span class="text-sm text-muted">已设置图片背景</span>' : ''}
        </div>
      </div>` : ''}
    `, [
      { label: '取消' },
      {
        label: id ? '保存' : '添加',
        primary: true,
        onClick: function (body) {
          const title = body.querySelector('#cdTitle').value.trim();
          if (!title) { App.toast('请输入标题', 'warning'); return false; }
          const date = body.querySelector('#cdDate').value;
          if (!date) { App.toast('请选择日期', 'warning'); return false; }
          const detail = body.querySelector('#cdDetail').value;
          const swatch = body.querySelector('.cd-color-swatch.selected');
          let bg = c ? c.bg : BG_COLORS[0];
          if (id && swatch) bg = swatch.dataset.color;

          if (id) {
            Store.updateCountdown(id, { title, date, detail, bg, layout });
          } else {
            Store.addCountdown({ title, date, detail, bg, layout });
          }
          App.toast(id ? '已更新' : '已添加', 'success');
          if (onSaved) onSaved(); else render(document.getElementById('contentArea'));
        }
      },
      ...(id ? [{ label: '删除', onClick: function () {
          if (confirm('确定删除这个倒数日？')) {
            Store.deleteCountdown(id);
            App.toast('已删除', 'success');
            render(document.getElementById('contentArea'));
          }
        } }] : [])
    ]);

    const modalBody = document.getElementById('dynamicModalBody');
    if (modalBody && id) {
      modalBody.querySelectorAll('.cd-color-swatch').forEach(sw => {
        sw.addEventListener('click', function () {
          modalBody.querySelectorAll('.cd-color-swatch').forEach(s => s.classList.remove('selected'));
          this.classList.add('selected');
        });
      });
    }
  }

  // 背景设置弹窗（纯色 + 图片）
  function showBgModal(id, onSaved) {
    const c = Store.getCountdown(id);
    App.modal('设置背景', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">纯色背景</label>
        <div class="flex-row flex-wrap" style="gap:6px;" id="bgColorRow">
          ${BG_COLORS.map(col => `<span class="cd-color-swatch" data-color="${col}" style="background:${col};${c.bg === col ? 'outline:2px solid var(--celadon-dark);outline-offset:2px;' : ''}"></span>`).join('')}
        </div>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">自定义图片背景</label>
        <input type="file" class="input" id="bgImageInput" accept="image/*">
        <div class="text-xs text-muted mt-8">选择图片后会转为 base64 存储（建议尺寸适中）。</div>
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const swatch = body.querySelector('.cd-color-swatch.selected');
          const fileInput = body.querySelector('#bgImageInput');
          if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
              Store.updateCountdown(id, { bg: e.target.result });
              App.toast('背景已更新', 'success');
              if (onSaved) onSaved();
            };
            reader.readAsDataURL(file);
            return false; // 等待异步
          } else if (swatch) {
            Store.updateCountdown(id, { bg: swatch.dataset.color });
            App.toast('背景已更新', 'success');
            if (onSaved) onSaved();
          } else {
            App.toast('请选择颜色或图片', 'warning');
            return false;
          }
        }
      }
    ]);

    const modalBody = document.getElementById('dynamicModalBody');
    modalBody.querySelectorAll('.cd-color-swatch').forEach(sw => {
      sw.addEventListener('click', function () {
        modalBody.querySelectorAll('.cd-color-swatch').forEach(s => s.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
  }

  return { render };
})();


/* ===== app.js ===== */
/* ============================================
 * app.js - 核心应用框架
 * 导航路由 · 日期切换 · 全局搜索 · 导出 · 初始化
 * ============================================ */

const App = (function () {

  let currentModule = 'dashboard';

  // 获取可见导航项
  function getNavItems() {
    return Store.getModules().filter(m => m.visible !== false);
  }

  // 初始化
  function init() {
    Store.init();

    // 应用主题
    applyTheme(Store.getTheme());

    // 设置日期
    document.getElementById('currentDate').value = Store.getCurrentDate();

    // 渲染导航
    renderNav();

    // 绑定事件
    bindEvents();

    // 更新计时仓库计数
    updateTimerRepoCount();

    // 加载默认模块（取第一个可见模块）
    const items = getNavItems();
    currentModule = items.length > 0 ? items[0].id : 'dashboard';
    loadModule(currentModule);
  }

  // 渲染导航
  function renderNav() {
    const navList = document.getElementById('navList');
    const items = getNavItems();
    navList.innerHTML = items.map(item => `
      <div class="nav-item ${item.id === currentModule ? 'active' : ''}" data-module="${item.id}">
        <span class="nav-item-icon">${item.icon}</span>
        <span class="nav-item-label">${item.name}</span>
      </div>
    `).join('');

    navList.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', function () {
        loadModule(this.dataset.module);
      });
    });

    // 侧边栏底部计时仓库点击
    const miniTimer = document.getElementById('globalTimerMini');
    miniTimer.addEventListener('click', function () {
      showTimerRepoModal();
    });
  }

  // 加载模块
  function loadModule(moduleId) {
    currentModule = moduleId;
    // 更新导航高亮
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.module === moduleId);
    });

    // 移动端选择后自动收起抽屉
    closeSidebar();

    const contentArea = document.getElementById('contentArea');
    contentArea.innerHTML = '';
    contentArea.scrollTop = 0;

    switch (moduleId) {
      case 'dashboard':
        Dashboard.render(contentArea);
        break;
      case 'exercise':
        Exercise.render(contentArea);
        break;
      case 'study':
        Study.render(contentArea);
        break;
      case 'checklist':
        Checklist.render(contentArea);
        break;
      case 'accounting':
        Accounting.render(contentArea);
        break;
      case 'records':
        Records.render(contentArea);
        break;
      case 'timer':
        Timer.render(contentArea);
        break;
      case 'countdown':
        Countdown.render(contentArea);
        break;
      default:
        // 自定义模块
        if (moduleId.indexOf('custom_') === 0) {
          renderCustomPage(contentArea, moduleId);
        }
    }
  }

  // 自定义页面小板块选中状态
  var customSectionState = {};

  // 渲染自定义页面（按日期的笔记/记录，支持小板块）
  function renderCustomPage(container, pageId) {
    var mod = Store.getModules().find(m => m.id === pageId);
    var pageName = mod ? mod.name : '自定义页面';
    var pageIcon = mod ? mod.icon : '📝';
    var date = Store.getCurrentDate();
    var sections = Store.getCustomSections(pageId);
    var activeSection = customSectionState[pageId] || 'all';
    var allEntries = Store.getCustomPageEntriesByDate(pageId, date);
    var entries = activeSection === 'all'
      ? allEntries
      : allEntries.filter(e => e.sectionId === activeSection);

    // 小板块标签栏
    var tabsHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">';
    tabsHtml += '<button class="btn btn-sm ' + (activeSection === 'all' ? 'btn-primary' : '') + '" data-section="all">全部</button>';
    sections.forEach(function (s) {
      tabsHtml += '<button class="btn btn-sm ' + (activeSection === s.id ? 'btn-primary' : '') + '" data-section="' + s.id + '">' + escapeHtml(s.name) + '</button>';
    });
    tabsHtml += '<button class="btn btn-sm" id="addSectionBtn" style="border-style:dashed;">+ 小板块</button>';
    if (activeSection !== 'all') {
      tabsHtml += '<button class="btn-text danger" id="deleteSectionBtn" data-id="' + activeSection + '" style="font-size:12px;padding:2px 8px;">删除该板块</button>';
    }
    tabsHtml += '</div>';

    // 记录列表
    var listHtml = '';
    if (entries.length === 0) {
      listHtml = '<div class="card text-muted text-center" style="padding:30px;">今天还没有记录，写点什么吧</div>';
    } else {
      listHtml = entries.map(function (e) {
        var sec = e.sectionId ? sections.find(s => s.id === e.sectionId) : null;
        return '<div class="card custom-entry" data-id="' + e.id + '">' +
          '<div class="flex-row" style="justify-content:space-between;align-items:flex-start;">' +
            '<div class="flex-1" style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:var(--ink);">' + escapeHtml(e.content) + '</div>' +
            '<button class="custom-entry-del" data-id="' + e.id + '" style="border:none;background:transparent;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 8px;">✕</button>' +
          '</div>' +
          '<div class="text-sm text-muted" style="margin-top:8px;">' +
            (sec ? '<span class="tag" style="font-size:11px;">' + escapeHtml(sec.name) + '</span> · ' : '') +
            new Date(e.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) +
          '</div>' +
        '</div>';
      }).join('');
    }

    container.innerHTML =
      '<div class="module-header">' +
        '<h2>' + pageIcon + ' ' + pageName + '</h2>' +
        '<p class="module-subtitle">' + date + ' 的记录</p>' +
      '</div>' +
      tabsHtml +
      '<div class="card">' +
        '<textarea class="custom-page-input" id="customPageInput" placeholder="在这里写下内容，点击添加保存到 ' + date + '…" rows="4" style="width:100%;border:1px solid var(--divider);border-radius:var(--radius-md);padding:12px;font-size:14px;font-family:inherit;background:var(--celadon-paler);color:var(--ink);resize:vertical;"></textarea>' +
        '<div style="margin-top:10px;text-align:right;">' +
          '<button class="btn-primary" id="customPageAdd" style="padding:8px 20px;border:none;border-radius:var(--radius-md);background:var(--celadon);color:#fff;font-size:14px;cursor:pointer;">添加记录</button>' +
        '</div>' +
      '</div>' +
      '<div id="customPageList">' + listHtml + '</div>';

    // 小板块切换
    container.querySelectorAll('[data-section]').forEach(function (btn) {
      if (btn.id === 'addSectionBtn' || btn.id === 'deleteSectionBtn') return;
      btn.addEventListener('click', function () {
        customSectionState[pageId] = this.dataset.section;
        renderCustomPage(container, pageId);
      });
    });

    // 添加小板块
    var addSecBtn = container.querySelector('#addSectionBtn');
    if (addSecBtn) {
      addSecBtn.addEventListener('click', function () {
        modal('添加小板块',
          '<div class="mb-12">' +
            '<label class="text-sm text-muted mb-8" style="display:block;">小板块名称</label>' +
            '<input type="text" class="input" id="newSectionName" placeholder="如：工作记录">' +
          '</div>',
          [
            { label: '取消' },
            {
              label: '添加',
              primary: true,
              onClick: function (body) {
                var name = body.querySelector('#newSectionName').value.trim();
                if (!name) { toast('请输入小板块名称', 'warning'); return false; }
                Store.addCustomSection(pageId, name);
                toast('小板块已添加', 'success');
                renderCustomPage(container, pageId);
              }
            }
          ]
        );
      });
    }

    // 删除小板块
    var delSecBtn = container.querySelector('#deleteSectionBtn');
    if (delSecBtn) {
      delSecBtn.addEventListener('click', function () {
        if (confirm('删除小板块将同时删除该板块下所有记录，确定？')) {
          Store.deleteCustomSection(pageId, this.dataset.id);
          customSectionState[pageId] = 'all';
          toast('已删除', 'success');
          renderCustomPage(container, pageId);
        }
      });
    }

    // 添加记录
    var input = container.querySelector('#customPageInput');
    container.querySelector('#customPageAdd').addEventListener('click', function () {
      var val = input.value.trim();
      if (!val) { toast('请输入内容', 'error'); return; }
      var secId = activeSection === 'all' ? null : activeSection;
      Store.addCustomPageEntry(pageId, val, secId);
      toast('记录已添加', 'success');
      renderCustomPage(container, pageId);
    });

    // 删除记录
    container.querySelectorAll('.custom-entry-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        Store.deleteCustomPageEntry(pageId, this.dataset.id);
        renderCustomPage(container, pageId);
      });
    });
  }

  // 移动端侧边栏抽屉控制
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('open')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  }

  // 绑定全局事件
  function bindEvents() {
    // 移动端目录抽屉
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    // 日期切换
    const dateInput = document.getElementById('currentDate');
    dateInput.addEventListener('change', function () {
      Store.setCurrentDate(this.value);
      loadModule(currentModule);
    });

    document.getElementById('prevDate').addEventListener('click', function () {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() - 1);
      dateInput.value = d.toISOString().slice(0, 10);
      Store.setCurrentDate(dateInput.value);
      loadModule(currentModule);
    });

    document.getElementById('nextDate').addEventListener('click', function () {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() + 1);
      dateInput.value = d.toISOString().slice(0, 10);
      Store.setCurrentDate(dateInput.value);
      loadModule(currentModule);
    });

    document.getElementById('todayBtn').addEventListener('click', function () {
      const today = new Date().toISOString().slice(0, 10);
      dateInput.value = today;
      Store.setCurrentDate(today);
      loadModule(currentModule);
    });

    // 全局搜索
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    const searchToggle = document.getElementById('searchToggle');
    let searchTimer = null;

    // 移动端搜索展开/收起
    if (searchToggle) {
      searchToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        const box = document.querySelector('.search-box');
        box.classList.toggle('expanded');
        if (box.classList.contains('expanded')) {
          searchInput.focus();
        } else {
          searchInput.value = '';
          searchResults.classList.remove('active');
        }
      });
    }

    searchInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      const kw = this.value.trim();
      if (!kw) {
        searchResults.classList.remove('active');
        return;
      }
      searchTimer = setTimeout(function () {
        const results = Store.search(kw);
        renderSearchResults(results);
      }, 200);
    });

    searchInput.addEventListener('focus', function () {
      if (this.value.trim()) {
        searchResults.classList.add('active');
      }
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search-box')) {
        searchResults.classList.remove('active');
        const box = document.querySelector('.search-box');
        if (box) box.classList.remove('expanded');
      }
    });

    // 导出
    document.getElementById('exportBtn').addEventListener('click', function () {
      showExportModal();
    });

    // 主题切换
    document.getElementById('themeToggle').addEventListener('click', function () {
      const current = Store.getTheme();
      const next = current === 'light' ? 'dark' : 'light';
      Store.setTheme(next);
      applyTheme(next);
      toast(next === 'dark' ? '已切换至暗色护眼模式' : '已切换至亮色模式', 'success');
    });

    // 管理目录
    const manageBtn = document.getElementById('manageModulesBtn');
    if (manageBtn) {
      manageBtn.addEventListener('click', showManageModulesModal);
    }

    // 导入数据（从数据管理弹窗触发）
    const importFileInput = document.getElementById('importFileInput');
    if (importFileInput) {
      importFileInput.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const fileContent = ev.target.result;
          showImportConfirmModal(fileContent, file.name);
        };
        reader.readAsText(file);
        // 重置 input，允许重复选同一文件
        importFileInput.value = '';
      });
    }
  }

  // 导入数据确认弹窗
  function showImportConfirmModal(fileContent, fileName) {
    modal('📥 确认导入数据', `
      <p style="font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:8px;">

      { label: '取消', onClick: closeModal },

          <div class="modal-title">⚙ 管理目录</div>
          <p class="text-muted text-sm mb-16">勾选显示/隐藏，点击名称可重命名，自定义模块可删除</p>

          <div style="border-top:1px solid var(--divider);padding-top:16px;margin-bottom:16px;">
            <div class="fw-600 mb-8" style="margin-bottom:10px;">➕ 添加自定义模块</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <input type="text" id="newModuleName" placeholder="模块名称" style="flex:1;border:1px solid var(--divider);border-radius:var(--radius-md);padding:8px 12px;font-size:14px;background:var(--celadon-paler);color:var(--ink);font-family:inherit;min-width:120px;">
              <select id="newModuleIcon" style="border:1px solid var(--divider);border-radius:var(--radius-md);padding:8px;font-size:18px;background:var(--celadon-paler);color:var(--ink);">

              <button id="addModuleBtn" style="padding:8px 16px;border:none;border-radius:var(--radius-md);background:var(--celadon);color:#fff;font-size:14px;cursor:pointer;white-space:nowrap;">添加</button>

          </div>

            <button class="icon-btn" id="closeManageModal">完成</button>
          </div>

      overlay.remove();

      if (e.target === overlay) overlay.remove();
    });

    // 显示/隐藏切换
    overlay.querySelectorAll('.module-visible-cb').forEach(cb => {
      cb.addEventListener('change', function () {
        Store.updateModule(this.dataset.id, { visible: this.checked });
      });
    });

    // 重命名
    overlay.querySelectorAll('.module-name-input').forEach(inp => {
      inp.addEventListener('change', function () {
        const newName = this.value.trim();
        if (newName) {
          Store.updateModule(this.dataset.id, { name: newName });
        }
      });
    });

    // 换图标
    overlay.querySelectorAll('.module-icon-display').forEach(span => {
      span.addEventListener('click', function () {
        const id = this.dataset.id;
        const current = this.textContent;
        const idx = iconOptions.indexOf(current);
        const next = iconOptions[(idx + 1) % iconOptions.length];
        this.textContent = next;
        Store.updateModule(id, { icon: next });
      });
    });

    // 删除自定义模块
    overlay.querySelectorAll('.module-del-btn').forEach(btn => {
      btn.addEventListener('click', function () {

      if (!name) { toast('请输入模块名称', 'error'); return; }

      toast('模块已添加', 'success');
      // 刷新弹窗
      overlay.remove();
      showManageModulesModal();

      container.innerHTML = '<div class="search-result-item"><div class="search-result-content text-muted">未找到相关结果</div></div>';
    } else {
      container.innerHTML = results.slice(0, 20).map(r => `
        <div class="search-result-item" data-module="${r.module}" data-id="${r.id}" data-date="${r.date}">
          <div class="search-result-type">${r.type}</div>
          <div class="search-result-content">${escapeHtml(r.content)}</div>
        </div>
      `).join('');

      container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', function () {
          const date = this.dataset.date;
          const module = this.dataset.module;
          // 切换到对应日期
          document.getElementById('currentDate').value = date;
          Store.setCurrentDate(date);
          // 切换到对应模块
          loadModule(module);
          container.classList.remove('active');
          document.getElementById('globalSearch').value = '';
        });

    container.classList.add('active');

  function closeModal() {

  // 应用主题

  // Toast 通知
  function toast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transform = 'translateX(100%)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 2800);

  // 通用：创建模态框
  function modal(title, contentHtml, actions) {
    const html = `
      <div class="modal-overlay" id="dynamicModal">
        <div class="modal">
          <div class="modal-title">${title}</div>
          <div id="dynamicModalBody">${contentHtml}</div>
          <div class="modal-actions" id="dynamicModalActions"></div>
        </div>
      </div>
    `;
    document.getElementById('modalContainer').innerHTML = html;

    const actionsContainer = document.getElementById('dynamicModalActions');
    if (actions && actions.length > 0) {
      actions.forEach(a => {
        const btn = document.createElement('button');
        btn.className = a.primary ? 'btn btn-primary' : 'btn';
        btn.textContent = a.label;
        btn.addEventListener('click', function () {
          var result = undefined;
          if (a.onClick) result = a.onClick(document.getElementById('dynamicModalBody'));
          if (result !== false && a.closeAfter !== false) closeModal();
        });
        actionsContainer.appendChild(btn);
      });
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '关闭';
      btn.addEventListener('click', closeModal);
      actionsContainer.appendChild(btn);
    }

    document.getElementById('dynamicModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  }

  // 工具函数
  function escapeHtml(str) {
    if (str == null) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function formatMoney(num) {
    return '¥' + (parseFloat(num) || 0).toFixed(2);
  }

  // 获取某月的天数范围
  function getMonthRange(dateStr) {
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = d.getMonth();
    return {
      yearMonth: `${year}-${String(month + 1).padStart(2, '0')}`,
      year: String(year),
      start: `${year}-${String(month + 1).padStart(2, '0')}-01`,
      end: `${year}-${String(month + 1).padStart(2, '0')}-${new Date(year, month + 1, 0).getDate()}`
    };
  }

  // ============ SVG 图表工具（不依赖外部库） ============

  // 折线图：opts = { labels:[], series:[{name,color,data:[]}], height, unit }
  function lineChart(container, opts) {
    const labels = opts.labels || [];
    const series = opts.series || [];
    const height = opts.height || 220;
    const unit = opts.unit || '';
    let allVals = [];
    series.forEach(s => { allVals = allVals.concat(s.data); });
    if (allVals.length === 0 || labels.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📈</div>暂无统计数据</div>';
      return;
    }
    const max = Math.max(...allVals, 1);
    const min = Math.min(...allVals, 0);
    const w = 360, padL = 38, padR = 14, padT = 16, padB = 30;
    const plotW = w - padL - padR;
    const plotH = height - padT - padB;
    const n = labels.length;
    const xStep = n > 1 ? plotW / (n - 1) : 0;
    const xOf = i => padL + (n > 1 ? i * xStep : plotW / 2);
    const yOf = v => padT + plotH - ((v - min) / ((max - min) || 1)) * plotH;
    const gridN = 4;
    let svg = `<svg viewBox="0 0 ${w} ${height}" width="100%" preserveAspectRatio="none" style="display:block;">`;
    // 网格线 + Y轴刻度
    for (let g = 0; g <= gridN; g++) {
      const val = min + (max - min) * (g / gridN);
      const y = yOf(val);
      svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--divider)" stroke-width="1"/>`;
      svg += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-light)">${Math.round(val)}</text>`;
    }
    // X轴标签
    labels.forEach((lb, i) => {
      const show = n <= 10 || i % Math.ceil(n / 10) === 0;
      if (show) {
        svg += `<text x="${xOf(i).toFixed(1)}" y="${height - 10}" text-anchor="middle" font-size="9" fill="var(--ink-light)">${escapeHtml(String(lb))}</text>`;
      }
    });
    // 各折线
    series.forEach(s => {
      const pts = s.data.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.data.forEach((v, i) => {
        svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="2.6" fill="${s.color}"/>`;
      });
    });
    svg += '</svg>';
    // 图例
    let legend = '';
    if (series.length > 1) {
      legend = '<div class="chart-legend">' + series.map(s =>
        `<span class="chart-legend-item"><span class="chart-legend-dot" style="background:${s.color};"></span>${escapeHtml(s.name)}</span>`
      ).join('') + '</div>';
    }
    container.innerHTML = svg + legend;
  }

  // 柱状图：opts = { labels:[], data:[], color, height, unit }
  function barChart(container, opts) {
    const labels = opts.labels || [];
    const data = opts.data || [];
    const color = opts.color || 'var(--celadon)';
    const height = opts.height || 220;
    if (data.length === 0 || labels.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div>暂无统计数据</div>';
      return;
    }
    const max = Math.max(...data, 1);
    const w = 360, padL = 38, padR = 14, padT = 16, padB = 30;
    const plotW = w - padL - padR;
    const plotH = height - padT - padB;
    const n = data.length;
    const slot = plotW / n;
    const barW = Math.min(slot * 0.6, 40);
    const yOf = v => padT + plotH - (v / max) * plotH;
    let svg = `<svg viewBox="0 0 ${w} ${height}" width="100%" preserveAspectRatio="none" style="display:block;">`;
    for (let g = 0; g <= 4; g++) {
      const val = max * (g / 4);
      const y = yOf(val);
      svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--divider)" stroke-width="1"/>`;
      svg += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-light)">${Math.round(val)}</text>`;
    }
    data.forEach((v, i) => {
      const x = padL + slot * i + (slot - barW) / 2;
      const y = yOf(v);
      const h = padT + plotH - y;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="3" fill="${color}"/>`;
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--ink-medium)">${v}</text>`;
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${height - 10}" text-anchor="middle" font-size="9" fill="var(--ink-light)">${escapeHtml(String(labels[i]))}</text>`;
    });
    svg += '</svg>';
    container.innerHTML = svg;
  }

  // 绑定折叠组件：让 .section-block.collapsible 的标题可点击展开/收起
  function bindCollapsible(container, defaultCollapsed) {
    var blocks = container.querySelectorAll('.section-block.collapsible');
    blocks.forEach(function (block) {
      if (block.dataset.collapsibleBound) return;
      block.dataset.collapsibleBound = '1';
      var title = block.querySelector('.section-title');
      if (!title) return;
      // 添加折叠箭头
      var chevron = document.createElement('span');
      chevron.className = 'collapse-chevron';
      chevron.textContent = '▼';
      title.appendChild(chevron);
      // 默认折叠
      if (defaultCollapsed) block.classList.add('collapsed');
      title.addEventListener('click', function (e) {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;
        block.classList.toggle('collapsed');
      });
    });
  }

  return {
    init,
    loadModule,
    toast,
    modal,
    closeModal,
    updateTimerRepoCount,
    escapeHtml,
    formatDate,
    formatMoney,
    getMonthRange,
    bindCollapsible,
    lineChart,
    barChart,
    getCurrentDate: () => Store.getCurrentDate()
  };
})();
