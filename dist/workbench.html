  // ============ 待学清单（紧凑） ============
  function renderTodoList() {
    const container = document.getElementById('studyTodoList');
    const date = Store.getCurrentDate();
    const todos = Store.getStudyTodosByDate(date);

    if (todos.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div>暂无待学任务</div>';
      return;
    }

    let html = '';
    todos.forEach(t => {
      const isCheckedToday = (t.checkDates || []).includes(date);
      const linkedTimers = (t.timerIds || []).map(id => {
        const timer = Store.getTimer(id);
        return timer ? `<span class="tag" style="font-size:11px;cursor:pointer;" data-timer-id="${id}">${App.escapeHtml(timer.name)} (${Timer.formatTime(timer.duration)})</span>` : '';
      }).join(' ');
      const priorityColors = { high: 'var(--danger)', normal: 'var(--ink-light)', low: 'var(--ink-faint)' };
      const priorityLabels = { high: '高', normal: '中', low: '低' };
      let deadlineInfo = null;
      if (t.deadline) {
        const dDiff = Math.floor((new Date(t.deadline) - new Date(Store.getCurrentDate())) / 86400000);
        if (dDiff > 0) deadlineInfo = { text: '剩' + dDiff + '天', color: 'var(--celadon)' };
        else if (dDiff < 0) deadlineInfo = { text: '已过' + Math.abs(dDiff) + '天', color: 'var(--danger)' };
        else deadlineInfo = { text: '今天截止', color: '#e8a04e' };
      }

      html += `
        <div class="study-todo-row" data-id="${t.id}">
          <div class="checkbox ${isCheckedToday ? 'checked' : ''}" data-id="${t.id}"></div>
          <div class="flex-1">
            <div class="flex-row" style="gap:6px;">
              <span style="${isCheckedToday ? 'text-decoration:line-through;color:var(--ink-faint);' : ''}">${App.escapeHtml(t.name)}</span>
              <span class="text-xs" style="color:${priorityColors[t.priority]};border:1px solid ${priorityColors[t.priority]};padding:0 5px;border-radius:4px;">${priorityLabels[t.priority]}</span>
            </div>
            ${linkedTimers ? `<div class="mt-8">${linkedTimers}</div>` : ''}
          </div>
          <div class="flex-row">
            ${deadlineInfo ? `<span class="text-sm" style="color:${deadlineInfo.color};margin-right:6px;">${deadlineInfo.text}</span>` : ''}
            <button class="btn-text import-timer-btn" data-id="${t.id}" title="导入计时">⏱</button>
            <button class="btn-text edit-todo-btn" data-id="${t.id}">编辑</button>
            <button class="btn-text danger delete-todo-btn" data-id="${t.id}">✕</button>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;

    container.querySelectorAll('.checkbox').forEach(cb => {
      cb.addEventListener('click', function () {
        const todo = Store.getStudyTodos().find(t => t.id === this.dataset.id);
        if (!todo) return;
        let dates = todo.checkDates || [];
        const today = Store.getCurrentDate();
        if (dates.includes(today)) { dates = dates.filter(d => d !== today); App.toast('已取消今日打卡', 'success'); }
        else { dates = [...dates, today]; App.toast('今日打卡完成！', 'success'); }
        Store.updateStudyTodo(this.dataset.id, { checkDates: dates, completed: dates.includes(today) });
        renderTodoList();
      });
    });
    container.querySelectorAll('.delete-todo-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('确定删除该任务？')) { Store.deleteStudyTodo(this.dataset.id); renderTodoList(); App.toast('已删除', 'success'); }
      });
    });
    container.querySelectorAll('.edit-todo-btn').forEach(btn => btn.addEventListener('click', function () { showEditTodoModal(this.dataset.id); }));
    container.querySelectorAll('.import-timer-btn').forEach(btn => btn.addEventListener('click', function () { showImportTimerModal(this.dataset.id); }));
  }

  function showEditTodoModal(id) {
    const todo = Store.getStudyTodos().find(t => t.id === id);
    if (!todo) return;
    App.modal('编辑任务', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">任务名称</label>
        <input type="text" class="input" id="editTodoName" value="${App.escapeHtml(todo.name)}">
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">截止日期</label>
          <input type="date" class="input" id="editTodoDeadline" value="${todo.deadline || ''}">
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">优先级</label>
          <select class="select" id="editTodoPriority">
            <option value="low" ${todo.priority === 'low' ? 'selected' : ''}>低</option>
            <option value="normal" ${todo.priority === 'normal' ? 'selected' : ''}>中</option>
            <option value="high" ${todo.priority === 'high' ? 'selected' : ''}>高</option>
          </select>
        </div>
      </div>
    `, [
      { label: '取消' },
      { label: '保存', primary: true, onClick: function (body) {
          const name = body.querySelector('#editTodoName').value.trim();
          if (!name) { App.toast('请输入任务名称', 'warning'); return false; }
          Store.updateStudyTodo(id, { name, deadline: body.querySelector('#editTodoDeadline').value, priority: body.querySelector('#editTodoPriority').value });
          renderTodoList(); App.toast('已更新', 'success');
        } }
    ]);
  }

  function showImportTimerModal(todoId) {
    const todo = Store.getStudyTodos().find(t => t.id === todoId);
    if (!todo) return;
    App.modal(`导入计时到「${todo.name}」`, `
      <p class="text-muted mb-12">从全局计时仓库选择一段学习计时关联：</p>
      <div id="importTimerList" style="max-height:300px;overflow-y:auto;"></div>
    `, [{ label: '关闭' }]);
    Timer.renderTimerRepo('importTimerList', function (t) { return t.source === 'study' || t.source === 'timer'; }, function (timer) {
      const cur = todo.timerIds || [];
      if (cur.includes(timer.id)) { App.toast('已关联', 'warning'); return; }
      Store.updateStudyTodo(todoId, { timerIds: [...cur, timer.id] });
      App.toast(`已关联「${timer.name}」`, 'success');
      App.closeModal(); renderTodoList(); renderStats();
    });
  }

  // ============ 学习笔记（竖型目录） ============
  function renderNotesDir() {
    const container = document.getElementById('studyNotesDir');
    const notes = currentCategoryId ? Store.getStudyNotes(currentCategoryId) : Store.getStudyNotes();
    const categories = Store.getStudyCategories();
    const sorted = [...notes].sort((a, b) => b.createdAt - a.createdAt);

    let catRow = '<div class="note-cat-row mb-12">';
    catRow += `<span class="note-cat-chip ${currentCategoryId === null ? 'active' : ''}" data-id="">📚 全部 (${Store.getStudyNotes().length})</span>`;
    categories.forEach(c => {
      catRow += `<span class="note-cat-chip ${currentCategoryId === c.id ? 'active' : ''}" data-id="${c.id}">${App.escapeHtml(c.name)} (${Store.getStudyNotes(c.id).length})</span>`;
    });
    catRow += '</div>';

    if (sorted.length === 0) {
      container.innerHTML = catRow + '<div class="empty-state"><div class="empty-state-icon">📖</div>暂无笔记，点击右上角开始写笔记</div>';
    } else {
      container.innerHTML = catRow + '<div class="dir-list">' + sorted.map(n => {
        const cat = Store.getStudyCategories().find(c => c.id === n.categoryId);
        return `
          <div class="dir-item note-dir-item" data-id="${n.id}">
            <span class="dir-item-icon">📄</span>
            <span class="dir-item-main">
              <span class="dir-item-title">${App.escapeHtml(n.title)}</span>
              <span class="dir-item-sub">${cat ? App.escapeHtml(cat.name) : '未分类'} · ${n.date}</span>
            </span>
            <span class="dir-item-arrow">›</span>
          </div>`;
      }).join('') + '</div>';
    }

    container.querySelectorAll('.note-cat-chip').forEach(chip => {
      chip.addEventListener('click', function () {
        currentCategoryId = this.dataset.id || null;
        renderNotesDir();
      });
    });
    container.querySelectorAll('.note-dir-item').forEach(item => {
      item.addEventListener('click', function () { renderNoteEditor(this.dataset.id); });
    });
  }

  // 笔记编辑页（独立页面）
  function renderNoteEditor(id) {
    const note = id ? Store.getStudyNotes().find(n => n.id === id) : null;
    const categories = Store.getStudyCategories();
    const todos = Store.getStudyTodos();
    const container = document.getElementById('contentArea');
    container.innerHTML = `
      <div class="module-header">
        <button class="btn-text" id="noteBackBtn">← 返回</button>
      </div>
      <div class="section-block">
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">标题</label>
          <input type="text" class="input" id="noteTitle" value="${note ? App.escapeHtml(note.title) : ''}" placeholder="输入笔记标题">
        </div>
        <div class="grid-2 mb-12">
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">所属目录</label>
            <select class="select" id="noteCategory">
              ${categories.length === 0 ? '<option value="">无目录</option>' : categories.map(c => `<option value="${c.id}" ${note && note.categoryId === c.id ? 'selected' : ''}>${App.escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">关联任务（可选）</label>
            <select class="select" id="noteLinkedTodo">
              <option value="">不关联</option>
              ${todos.map(t => `<option value="${t.id}" ${note && note.linkedTodoId === t.id ? 'selected' : ''}>${App.escapeHtml(t.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">内容</label>
          <textarea class="textarea" id="noteContent" rows="12" placeholder="开始记录...">${note ? App.escapeHtml(note.content) : ''}</textarea>
        </div>
        <div class="flex-row" style="gap:8px;justify-content:flex-end;">
          ${note ? '<button class="btn btn-danger" id="noteDelBtn">删除</button>' : ''}
          <button class="btn" id="noteCancelBtn">取消</button>
          <button class="btn btn-primary" id="noteSaveBtn">保存</button>
        </div>
      </div>
    `;
    container.querySelector('#noteBackBtn').addEventListener('click', function () { render(container); });
    container.querySelector('#noteCancelBtn').addEventListener('click', function () { render(container); });
    if (note) {
      container.querySelector('#noteDelBtn').addEventListener('click', function () {
        if (confirm('确定删除这篇笔记？')) { Store.deleteStudyNote(note.id); App.toast('已删除', 'success'); render(container); }
      });
    }
    container.querySelector('#noteSaveBtn').addEventListener('click', function () {
      const title = container.querySelector('#noteTitle').value.trim();
      if (!title) { App.toast('请输入标题', 'warning'); return; }
      const data = {
        title,
        categoryId: container.querySelector('#noteCategory').value || null,
        linkedTodoId: container.querySelector('#noteLinkedTodo').value || null,
        content: container.querySelector('#noteContent').value
      };
      if (note) Store.updateStudyNote(note.id, data);
      else Store.addStudyNote(data);
      App.toast('已保存', 'success');
      render(container);
    });
  }

  // ============ 学习统计 ============
  function buildStatSeries() {
    const today = new Date(Store.getCurrentDate());
    let dates = [];
    if (statPeriod === 'week') {
      for (let i = 6; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); dates.push(d.toISOString().slice(0, 10)); }
    } else {
      const y = today.getFullYear(), m = today.getMonth();
      const days = new Date(y, m + 1, 0).getDate();
      for (let i = 1; i <= days; i++) dates.push(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    }
    const todos = Store.getStudyTodos();
    const dailyCompleted = dates.map(ds => todos.filter(t => (t.checkDates || []).includes(ds)).length);
    let cum = 0;
    const cumulative = dailyCompleted.map(v => (cum += v));
    const duration = dates.map(ds => {
      let sum = 0;
      todos.forEach(t => (t.timerIds || []).forEach(tid => {
        const tm = Store.getTimer(tid);
        if (tm && tm.date === ds) sum += tm.duration;
      }));
      return sum;
    });
    return { labels: dates.map(d => d.slice(5)), dailyCompleted, cumulative, duration };
  }

  function renderStats() {
    const el = document.getElementById('studyStatsArea');
    if (!el) return;
    const s = buildStatSeries();
    const color1 = 'var(--celadon)', color2 = 'var(--info)', color3 = 'var(--warning)';
    let html = '';
    const blocks = [
      { title: '每日完成待办数', labels: s.labels, data: s.dailyCompleted, color: color1 },
      { title: '累计完成数', labels: s.labels, data: s.cumulative, color: color2 },
      { title: '学习时长(秒)', labels: s.labels, data: s.duration, color: color3 }
    ];
    blocks.forEach(b => {
      html += `<div class="mb-16">
        <div class="text-sm text-muted mb-8">${b.title}</div>
        <div class="stat-chart-block" data-title="${b.title}"></div>
      </div>`;
    });
    el.innerHTML = html;
    blocks.forEach(b => {
      const blockEl = el.querySelector(`.stat-chart-block[data-title="${b.title}"]`);
      if (statType === 'bar') App.barChart(blockEl, { labels: b.labels, data: b.data, color: b.color });
      else App.lineChart(blockEl, { labels: b.labels, series: [{ name: b.title, color: b.color, data: b.data }] });
    });
  }

  // ============ 事件 ============
  function bindEvents() {
    document.getElementById('addStudyTodoBtn').addEventListener('click', function () {
      App.modal('新增待学任务', `
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">任务名称</label>
          <input type="text" class="input" id="newTodoName" placeholder="如：学习React Hooks">
        </div>
        <div class="grid-2 mb-12">
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">截止日期（可选）</label>
            <input type="date" class="input" id="newTodoDeadline">
          </div>
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">优先级</label>
            <select class="select" id="newTodoPriority">
              <option value="low">低</option>
              <option value="normal" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
        </div>
      `, [
        { label: '取消' },
        { label: '添加', primary: true, onClick: function (body) {
            const name = body.querySelector('#newTodoName').value.trim();
            if (!name) { App.toast('请输入任务名称', 'warning'); return false; }
            Store.addStudyTodo({ name, deadline: body.querySelector('#newTodoDeadline').value, priority: body.querySelector('#newTodoPriority').value });
            renderTodoList(); App.toast('任务已添加', 'success');
          } }
      ]);
    });

    document.getElementById('addStudyCategoryBtn').addEventListener('click', function () {
      App.modal('新增笔记目录', `
        <div class="mb-12"><input type="text" class="input" id="newCatName" placeholder="如：前端开发"></div>
      `, [
        { label: '取消' },
        { label: '添加', primary: true, onClick: function (body) {
            const name = body.querySelector('#newCatName').value.trim();
            if (!name) { App.toast('请输入目录名称', 'warning'); return false; }
            Store.addStudyCategory(name); renderNotesDir(); App.toast('目录已添加', 'success');
          } }
      ]);
    });

    document.getElementById('addStudyNoteBtn').addEventListener('click', function () {
      if (Store.getStudyCategories().length === 0) { App.toast('请先创建笔记目录', 'warning'); return; }
      renderNoteEditor(null);
    });

    document.querySelectorAll('.chart-type-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        statType = this.dataset.type;
        document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('btn-primary'));
        this.classList.add('btn-primary');
        renderStats();
      });
    });
    document.querySelectorAll('.stat-period-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        statPeriod = this.dataset.period;
        document.querySelectorAll('.stat-period-btn').forEach(b => b.classList.remove('btn-primary'));
        this.classList.add('btn-primary');
        renderStats();
      });
    });
  }

  return { render };
})();


/* ===== checklist.js ===== */
/* ============================================
 * checklist.js - 每日清单模块（重构）
 * 直接展示四象限 · 象限内联添加任务 · 完成/编辑/删除
 * ============================================ */

const Checklist = (function () {

  const QUADRANTS = [
    { id: 0, name: '重要且紧急', icon: '🔴', color: 'var(--danger)', desc: '立即处理' },
    { id: 1, name: '重要不紧急', icon: '🟡', color: 'var(--warning)', desc: '计划安排' },
    { id: 2, name: '不重要但紧急', icon: '🟠', color: '#D4855E', desc: '委托或快速完成' },
    { id: 3, name: '不重要不紧急', icon: '🟢', color: 'var(--bean-green)', desc: '闲暇时做' }
  ];

  let draggedTaskId = null;
  let addingQuadrant = null; // 当前正在内联添加的象限

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>📋 每日清单</h2>
        <div class="module-subtitle">四象限看板 · 象限内直接添加 · ${App.formatDate(date)}</div>
      </div>

      <div class="flex-between mb-16">
        <div class="text-sm text-muted" id="checklistSummary"></div>
        <button class="btn" id="showArchivedBtn">查看已完成</button>
      </div>

      <div class="quadrant-board" id="quadrantBoard">
        ${QUADRANTS.map(q => `
          <div class="quadrant" data-quadrant="${q.id}">
            <div class="quadrant-header" style="border-top:3px solid ${q.color};">
              <span class="quadrant-icon">${q.icon}</span>
              <span class="quadrant-name">${q.name}</span>
              <span class="quadrant-count" id="qCount_${q.id}">0</span>
            </div>
            <div class="quadrant-desc text-xs text-muted">${q.desc}</div>
            <div class="quadrant-drop-zone" data-quadrant="${q.id}" id="qZone_${q.id}"></div>
            <button class="quadrant-add-btn" data-quadrant="${q.id}">＋ 添加任务</button>
          </div>
        `).join('')}
      </div>
    `;

    renderTasks();
    bindEvents();
  }

  function renderTasks() {
    const date = Store.getCurrentDate();
    const tasks = Store.getChecklistTasks(date);
    const completed = Store.getArchivedTasks(date).length;
    document.getElementById('checklistSummary').textContent = `今日 ${tasks.length} 项待办，已完成 ${completed} 项`;

    QUADRANTS.forEach(q => {
      const zone = document.getElementById('qZone_' + q.id);
      const qTasks = tasks.filter(t => t.quadrant === q.id);
      document.getElementById('qCount_' + q.id).textContent = qTasks.length;

      let html = '';
      if (qTasks.length === 0 && addingQuadrant !== q.id) {
        html = '<div class="quadrant-empty text-xs text-muted">点击下方「＋ 添加任务」</div>';
      } else {
        html = qTasks.map(t => {
          const recurringLabel = t.recurring === 'daily' ? '每日' : (t.recurring === 'weekly' ? '每周' : '');
          return `
            <div class="task-card" draggable="true" data-id="${t.id}" data-quadrant="${t.quadrant}">
              <div class="flex-row">
                <div class="checkbox task-complete-btn" data-id="${t.id}"></div>
                <span class="task-text">${App.escapeHtml(t.text)}</span>
              </div>
              <div class="flex-between mt-8">
                <div>${recurringLabel ? `<span class="tag" style="font-size:10px;cursor:default;">🔁 ${recurringLabel}</span>` : ''}</div>
                <div class="flex-row">
                  <button class="btn-text edit-task-btn" data-id="${t.id}" style="font-size:12px;">编辑</button>
                  <button class="btn-text danger delete-task-btn" data-id="${t.id}" style="font-size:12px;">删除</button>
                </div>
              </div>
            </div>`;
        }).join('');
      }

      // 内联添加表单
      if (addingQuadrant === q.id) {
        html += `
          <div class="inline-add">
            <input type="text" class="input inline-add-input" placeholder="输入任务内容，回车保存" data-quadrant="${q.id}">
            <div class="flex-row mt-8" style="gap:6px;">
              <select class="select inline-add-recurring" style="flex:1;">
                <option value="none">不循环</option>
                <option value="daily">每日重复</option>
                <option value="weekly">每周重复</option>
              </select>
              <button class="btn btn-sm btn-primary inline-add-save" data-quadrant="${q.id}">保存</button>
              <button class="btn btn-sm inline-add-cancel">取消</button>
            </div>
          </div>`;
      }

      zone.innerHTML = html;

      // 拖放
      zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', function () { zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (draggedTaskId) {
          Store.updateChecklistTask(draggedTaskId, { quadrant: parseInt(this.dataset.quadrant) });
          App.toast('已移动到「' + QUADRANTS[parseInt(this.dataset.quadrant)].name + '」', 'success');
          draggedTaskId = null;
          renderTasks();
        }
      });
    });

    // 拖拽
    document.querySelectorAll('.task-card').forEach(card => {
      card.addEventListener('dragstart', function (e) {
        draggedTaskId = this.dataset.id; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function () { this.classList.remove('dragging'); });
    });

    // 完成
    document.querySelectorAll('.task-complete-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        Store.updateChecklistTask(this.dataset.id, { completed: true });
        App.toast('任务已完成，已归档', 'success');
        renderTasks();
      });
    });
    // 编辑
    document.querySelectorAll('.edit-task-btn').forEach(btn => btn.addEventListener('click', function () { showEditTaskModal(this.dataset.id); }));
    // 删除
    document.querySelectorAll('.delete-task-btn').forEach(btn => btn.addEventListener('click', function () {
      if (confirm('确定删除该任务？')) { Store.deleteChecklistTask(this.dataset.id); App.toast('已删除', 'success'); renderTasks(); }
    }));
    // 内联添加交互
    bindInlineAdd();
  }

  function bindInlineAdd() {
    document.querySelectorAll('.quadrant-add-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        addingQuadrant = parseInt(this.dataset.quadrant);
        renderTasks();
        const input = document.querySelector('.inline-add-input[data-quadrant="' + this.dataset.quadrant + '"]');
        if (input) input.focus();
      });
    });
    document.querySelectorAll('.inline-add-cancel').forEach(btn => {
      btn.addEventListener('click', function () { addingQuadrant = null; renderTasks(); });
    });
    document.querySelectorAll('.inline-add-save').forEach(btn => {
      btn.addEventListener('click', function () { commitInlineAdd(parseInt(this.dataset.quadrant)); });
    });
    document.querySelectorAll('.inline-add-input').forEach(input => {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { commitInlineAdd(parseInt(this.dataset.quadrant)); }
        else if (e.key === 'Escape') { addingQuadrant = null; renderTasks(); }
      });
    });
  }

  function commitInlineAdd(quadrant) {
    const input = document.querySelector('.inline-add-input[data-quadrant="' + quadrant + '"]');
    const recurringSel = document.querySelector('.inline-add-recurring');
    const text = input ? input.value.trim() : '';
    if (!text) { App.toast('请输入任务内容', 'warning'); return; }
    Store.addChecklistTask({ text, quadrant, recurring: recurringSel ? recurringSel.value : 'none' });
    addingQuadrant = null;
    App.toast('已添加', 'success');
    renderTasks();
  }

  function showEditTaskModal(id) {
    const tasks = Store.getChecklistTasks(Store.getCurrentDate());
    const task = id ? tasks.find(t => t.id === id) : null;
    App.modal('编辑任务', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">任务内容</label>
        <input type="text" class="input" id="taskText" value="${task ? App.escapeHtml(task.text) : ''}" placeholder="输入任务内容">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">所属象限</label>
        <select class="select" id="taskQuadrant">
          ${QUADRANTS.map(q => `<option value="${q.id}" ${task && task.quadrant === q.id ? 'selected' : ''}>${q.icon} ${q.name}</option>`).join('')}
        </select>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">循环设置</label>
        <select class="select" id="taskRecurring">
          <option value="none" ${task && task.recurring === 'none' ? 'selected' : ''}>不循环</option>
          <option value="daily" ${task && task.recurring === 'daily' ? 'selected' : ''}>每日重复</option>
          <option value="weekly" ${task && task.recurring === 'weekly' ? 'selected' : ''}>每周重复</option>
        </select>
      </div>
    `, [
      { label: '取消' },
      { label: '保存', primary: true, onClick: function (body) {
          const text = body.querySelector('#taskText').value.trim();
          if (!text) { App.toast('请输入任务内容', 'warning'); return false; }
          Store.updateChecklistTask(id, {
            text,
            quadrant: parseInt(body.querySelector('#taskQuadrant').value),
            recurring: body.querySelector('#taskRecurring').value
          });
          App.toast('已保存', 'success');
          renderTasks();
        } }
    ]);
  }

  function showArchivedModal() {
    const date = Store.getCurrentDate();
    const archived = Store.getArchivedTasks(date);
    App.modal(`已完成任务 · ${App.formatDate(date)}`, `
      ${archived.length === 0
        ? '<div class="empty-state"><div class="empty-state-icon">✓</div>今日暂无已完成任务</div>'
        : archived.map(t => `
            <div class="list-item">
              <div class="checkbox checked" style="cursor:default;"></div>
              <span style="flex:1;text-decoration:line-through;color:var(--ink-light);">${App.escapeHtml(t.text)}</span>
              <span class="text-xs text-muted">${QUADRANTS[t.quadrant].name}</span>
            </div>`).join('')
      }
    `, [{ label: '关闭' }]);
  }

  function bindEvents() {
    document.getElementById('showArchivedBtn').addEventListener('click', showArchivedModal);
  }

  return { render };
})();


/* ===== accounting.js ===== */
/* ============================================
 * accounting.js - 每日记账模块
 * 账户管理 · 收支录入 · 数据汇总 · 占比统计
 * ============================================ */

const Accounting = (function () {

  let currentSummaryView = 'day'; // 'day' | 'month' | 'year'

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>💰 每日记账</h2>
        <div class="module-subtitle">账户管理 · 收支录入 · 数据汇总 · ${App.formatDate(date)}</div>
      </div>

      <!-- 板块1：账户管理 -->
      <div class="section-block collapsible collapsed">
        <div class="section-title">
          <span class="section-title-icon">🏦</span>
          账户管理
          <button class="btn btn-sm" id="addAccountBtn" style="margin-left:auto;">+ 新增账户</button>
        </div>
        <div id="accountsList" class="grid-3"></div>
      </div>

      <!-- 板块2：收支录入 -->
      <div class="section-block collapsible">
        <div class="section-title">
          <span class="section-title-icon">✍️</span>
          收支录入
          <button class="btn btn-sm btn-primary" id="addTransactionBtn" style="margin-left:auto;">+ 记一笔</button>
        </div>
        <div id="todayTransactions"></div>
      </div>

      <!-- 板块3：数据汇总 -->
      <div class="section-block collapsible collapsed">
        <div class="section-title">
          <span class="section-title-icon">📊</span>
          数据汇总
          <div style="margin-left:auto;display:flex;gap:6px;">
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'day' ? 'btn-primary' : ''}" data-view="day">日汇总</button>
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'month' ? 'btn-primary' : ''}" data-view="month">月汇总</button>
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'year' ? 'btn-primary' : ''}" data-view="year">年汇总</button>
          </div>
        </div>
        <div id="summaryView"></div>
      </div>

      <!-- 板块4：支出占比统计 -->
      <div class="section-block collapsible collapsed">
        <div class="section-title">
          <span class="section-title-icon">🥧</span>
          支出分类占比
        </div>
        <div id="categoryStats"></div>
      </div>
    `;

    renderAccounts();
    renderTodayTransactions();
    renderSummary();
    renderCategoryStats();
    bindEvents();
    App.bindCollapsible(container);
  }

  // ============ 账户管理 ============
  function renderAccounts() {
    const container = document.getElementById('accountsList');
    const accounts = Store.getAccounts();

    if (accounts.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏦</div>暂无账户</div>';
      return;
    }

    container.innerHTML = accounts.map(a => `
      <div class="account-card stat-card">
        <div class="flex-between mb-8">
          <span class="fw-600">${App.escapeHtml(a.name)}</span>
          <div>
            <button class="btn-text edit-account-btn" data-id="${a.id}" style="font-size:12px;">编辑</button>
            <button class="btn-text danger delete-account-btn" data-id="${a.id}" style="font-size:12px;">删除</button>
          </div>
        </div>
        <div class="stat-card-value">${App.formatMoney(a.balance)}</div>
        <div class="stat-card-label">当前余额</div>
      </div>
    `).join('');

    container.querySelectorAll('.edit-account-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        showEditAccountModal(this.dataset.id);
      });
    });

    container.querySelectorAll('.delete-account-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('删除账户将影响关联的账单记录，确定？')) {
          Store.deleteAccount(this.dataset.id);
          renderAccounts();
          renderTodayTransactions();
          App.toast('已删除', 'success');
        }
      });
    });
  }

  function showEditAccountModal(id) {
    const account = id ? Store.getAccounts().find(a => a.id === id) : null;
    App.modal(account ? '编辑账户' : '新增账户', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">账户名称</label>
        <input type="text" class="input" id="accountName" value="${account ? App.escapeHtml(account.name) : ''}" placeholder="如：银行卡">
      </div>
      ${account ? `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">余额调整</label>
        <input type="number" class="input" id="accountBalance" value="${account.balance}" step="0.01">
      </div>
      ` : ''}
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const name = body.querySelector('#accountName').value.trim();
          if (!name) {
            App.toast('请输入账户名称', 'warning');
            return false;
          }
          if (account) {
            Store.updateAccount(id, {
              name: name,
              balance: parseFloat(body.querySelector('#accountBalance').value) || 0
            });
          } else {
            Store.addAccount(name);
          }
          renderAccounts();
          App.toast('已保存', 'success');
        }
      }
    ]);
  }

  // ============ 收支录入 ============
  function renderTodayTransactions() {
    const container = document.getElementById('todayTransactions');
    const date = Store.getCurrentDate();
    const allTxs = Store.getTransactions();

    if (allTxs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div>暂无账单记录</div>';
      return;
    }

    // 按日期分组
    var grouped = {};
    allTxs.forEach(function (t) {
      if (!grouped[t.date]) grouped[t.date] = [];
      grouped[t.date].push(t);
    });

    // 按日期倒序，最多显示15天
    var dates = Object.keys(grouped).sort(function (a, b) { return b.localeCompare(a); }).slice(0, 15);
    var today = Store.getCurrentDate();

    var html = '';
    dates.forEach(function (d) {
      var txs = grouped[d].sort(function (a, b) { return b.createdAt - a.createdAt; });
      var dayIncome = txs.filter(function (t) { return t.type === 'income'; }).reduce(function (s, t) { return s + t.amount; }, 0);
      var dayExpense = txs.filter(function (t) { return t.type === 'expense'; }).reduce(function (s, t) { return s + t.amount; }, 0);
      var isToday = d === today;

      html += '<div class="tx-date-group' + (isToday ? '' : ' collapsed') + '" data-date="' + d + '">';
      html += '<div class="tx-date-header">';
      html += '<span>' + App.formatDate(d) + (isToday ? ' （今天）' : '') + '</span>';
      html += '<span class="text-xs text-muted" style="margin-left:8px;">' + txs.length + '笔</span>';
      html += '<span class="text-xs" style="margin-left:auto;color:var(--danger);">-' + App.formatMoney(dayExpense) + '</span>';
      if (dayIncome > 0) html += '<span class="text-xs" style="color:var(--celadon-dark);">+' + App.formatMoney(dayIncome) + '</span>';
      html += '<span class="collapse-chevron">▼</span>';
      html += '</div>';
      html += '<div class="tx-date-body" style="padding:8px 0;">';

      txs.forEach(function (t) {
        var account = Store.getAccounts().find(function (a) { return a.id === t.accountId; });
        var isExpense = t.type === 'expense';
        html += '<div class="list-item">';
        html += '<span style="font-size:20px;">' + (isExpense ? '💸' : '💵') + '</span>';
        html += '<div class="flex-1">';
        html += '<div class="fw-600">' + App.escapeHtml(t.category) + (t.subCategory ? ' · ' + App.escapeHtml(t.subCategory) : '') + '</div>';
        html += '<div class="text-sm text-muted">' + (account ? App.escapeHtml(account.name) : '未知账户') + (t.note ? ' · ' + App.escapeHtml(t.note) : '') + '</div>';
        html += '</div>';
        html += '<span class="fw-600" style="color:' + (isExpense ? 'var(--danger)' : 'var(--celadon-dark)') + ';">' + (isExpense ? '-' : '+') + App.formatMoney(t.amount) + '</span>';
        html += '<button class="btn-text danger delete-tx-btn" data-id="' + t.id + '">删除</button>';
        html += '</div>';
      });

      html += '</div>';
      html += '</div>';
    });

    container.innerHTML = html;

    // 绑定日期折叠
    container.querySelectorAll('.tx-date-header').forEach(function (header) {
      header.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        this.parentElement.classList.toggle('collapsed');
      });
    });

    container.querySelectorAll('.delete-tx-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('确定删除该账单？')) {
          Store.deleteTransaction(this.dataset.id);
          renderTodayTransactions();
          renderAccounts();
          renderSummary();
          renderCategoryStats();
          App.toast('已删除', 'success');
        }
      });
    });
  }

  function showAddTransactionModal() {
    const accounts = Store.getAccounts();
    if (accounts.length === 0) {
      App.toast('请先创建一个账户', 'warning');
      return;
    }

    const expenseCats = Store.getExpenseCategories();
    const incomeCats = Store.getIncomeCategories();

    App.modal('记一笔', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">类型</label>
        <div class="flex-row">
          <button class="btn tx-type-btn active" data-type="expense" id="txTypeExpense">💸 支出</button>
          <button class="btn tx-type-btn" data-type="income" id="txTypeIncome">💵 收入</button>
        </div>
        <input type="hidden" id="txType" value="expense">
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">账户</label>
          <select class="select" id="txAccount">
            ${accounts.map(a => `<option value="${a.id}">${App.escapeHtml(a.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">日期</label>
          <input type="date" class="input" id="txDate" value="${Store.getCurrentDate()}">
        </div>
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">一级分类</label>
          <select class="select" id="txCategory"></select>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">二级分类</label>
          <div class="flex-row">
            <select class="select" id="txSubCategory" style="flex:1;"></select>
            <button class="btn btn-sm" id="addSubCatBtn" title="新增子分类">+</button>
          </div>
        </div>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">金额</label>
        <input type="number" class="input" id="txAmount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">备注</label>
        <input type="text" class="input" id="txNote" placeholder="可选备注">
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const amount = parseFloat(body.querySelector('#txAmount').value);
          if (!amount || amount <= 0) {
            App.toast('请输入有效金额', 'warning');
            return false;
          }
          const type = body.querySelector('#txType').value;
          const categorySelect = body.querySelector('#txCategory');
          const subCategorySelect = body.querySelector('#txSubCategory');
          Store.addTransaction({
            date: body.querySelector('#txDate').value,
            accountId: body.querySelector('#txAccount').value,
            type: type,
            category: categorySelect.value,
            subCategory: subCategorySelect.value,
            amount: amount,
            note: body.querySelector('#txNote').value
          });
          App.toast('记账成功！', 'success');
          // 刷新
          renderAccounts();
          renderTodayTransactions();
          renderSummary();
          renderCategoryStats();
        }
      }
    ]);

    // 类型切换
    function updateCategories() {
      const type = document.getElementById('txType').value;
      const cats = type === 'expense' ? expenseCats : incomeCats;
      const catSelect = document.getElementById('txCategory');
      catSelect.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      updateSubCategories();
    }

    function updateSubCategories() {
      const type = document.getElementById('txType').value;
      const catName = document.getElementById('txCategory').value;
      const cats = type === 'expense' ? expenseCats : incomeCats;
      const cat = cats.find(c => c.name === catName);
      const subs = cat ? cat.subCategories : [];
      const subSelect = document.getElementById('txSubCategory');
      subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
      if (subs.length === 0) {
        subSelect.innerHTML = '<option value="">无子分类</option>';
      }
    }

    document.getElementById('txTypeExpense').addEventListener('click', function () {
      document.getElementById('txType').value = 'expense';
      document.querySelectorAll('.tx-type-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
      this.classList.add('active', 'btn-primary');
      updateCategories();
    });

    document.getElementById('txTypeIncome').addEventListener('click', function () {
      document.getElementById('txType').value = 'income';
      document.querySelectorAll('.tx-type-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
      this.classList.add('active', 'btn-primary');
      updateCategories();
    });

    document.getElementById('txCategory').addEventListener('change', updateSubCategories);

    document.getElementById('addSubCatBtn').addEventListener('click', function () {
      const type = document.getElementById('txType').value;
      const catName = document.getElementById('txCategory').value;
      const newSub = prompt('请输入新的子分类名称：');
      if (newSub && newSub.trim()) {
        if (type === 'expense') {
          const cat = expenseCats.find(c => c.name === catName);
          if (cat) Store.addExpenseSubCategory(cat.id, newSub.trim());
        }
        updateSubCategories();
        document.getElementById('txSubCategory').value = newSub.trim();
      }
    });

    // 初始化
    document.getElementById('txTypeExpense').classList.add('btn-primary');
    updateCategories();
  }

  // ============ 数据汇总 ============
  function renderSummary() {
    const container = document.getElementById('summaryView');
    const date = Store.getCurrentDate();
    let txs = [];

    let label = '';
    if (currentSummaryView === 'day') {
      txs = Store.getTransactions(date);
      label = App.formatDate(date);
    } else if (currentSummaryView === 'month') {
      const monthStr = date.slice(0, 7);
      txs = Store.getTransactionsByMonth(monthStr);
      const d = new Date(date);
      label = `${d.getFullYear()}年${d.getMonth() + 1}月`;
    } else {
      const yearStr = date.slice(0, 4);
      txs = Store.getTransactionsByYear(yearStr);
      label = `${yearStr}年`;
    }

    const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance = income - expense;

    container.innerHTML = `
      <div class="grid-3 mb-16">
        <div class="stat-card">
          <div class="stat-card-value" style="color:var(--celadon-dark);">+${App.formatMoney(income)}</div>
          <div class="stat-card-label">${label}总收入</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" style="color:var(--danger);">-${App.formatMoney(expense)}</div>
          <div class="stat-card-label">${label}总支出</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" style="color:${balance >= 0 ? 'var(--celadon-dark)' : 'var(--danger)'};">${balance >= 0 ? '+' : ''}${App.formatMoney(balance)}</div>
          <div class="stat-card-label">${label}结余</div>
        </div>
      </div>
      ${txs.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📊</div>该时段暂无账单记录</div>' : `
        <div class="text-sm text-muted mb-8">账单明细（共${txs.length}条）</div>
        <div style="max-height:300px;overflow-y:auto;">
          ${[...txs].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt).map(t => {
            const account = Store.getAccounts().find(a => a.id === t.accountId);
            return `
              <div class="list-item">
                <span style="font-size:18px;">${t.type === 'expense' ? '💸' : '💵'}</span>
                <div class="flex-1">
                  <div class="text-sm fw-600">${App.escapeHtml(t.category)}${t.subCategory ? ' · ' + App.escapeHtml(t.subCategory) : ''}</div>
                  <div class="text-xs text-muted">${t.date} · ${account ? App.escapeHtml(account.name) : ''}${t.note ? ' · ' + App.escapeHtml(t.note) : ''}</div>
                </div>
                <span class="fw-600 text-sm" style="color:${t.type === 'expense' ? 'var(--danger)' : 'var(--celadon-dark)'};">
                  ${t.type === 'expense' ? '-' : '+'}${App.formatMoney(t.amount)}
                </span>
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
  }

  // ============ 支出占比统计 ============
  function renderCategoryStats() {
    const container = document.getElementById('categoryStats');
    const date = Store.getCurrentDate();
    const monthStr = date.slice(0, 7);
    const txs = Store.getTransactionsByMonth(monthStr).filter(t => t.type === 'expense');

    if (txs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🥧</div>本月暂无支出数据</div>';
      return;
    }

    // 按一级分类统计
    const catTotals = {};
    txs.forEach(t => {
      catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
    });

    const total = Object.values(catTotals).reduce((s, v) => s + v, 0);
    const sorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

    // 颜色映射
    const colors = ['var(--celadon)', 'var(--bean-green)', 'var(--jade-blue)', 'var(--info)', 'var(--warning)', 'var(--danger)'];

    let html = `<div class="text-sm text-muted mb-8">本月支出分类占比（总支出 ${App.formatMoney(total)}）</div>`;

    // 简易条形图
    html += '<div class="freq-chart mb-16">';
    sorted.forEach(([cat, amount], i) => {
      const percent = (amount / total * 100).toFixed(1);
      const width = percent;
      html += `
        <div class="freq-bar-row">
          <span class="freq-bar-label">${App.escapeHtml(cat)}</span>
          <div class="freq-bar-track">
            <div class="freq-bar-fill" style="width:${width}%;background:${colors[i % colors.length]};"></div>
          </div>
          <span class="freq-bar-count">${App.formatMoney(amount)} (${percent}%)</span>
        </div>
      `;
    });
    html += '</div>';

    // 简易饼图（用CSS conic-gradient）
    let gradientParts = [];
    let cumulative = 0;
    sorted.forEach(([cat, amount], i) => {
      const percent = amount / total * 100;
      const color = colors[i % colors.length];
      gradientParts.push(`${color} ${cumulative}% ${cumulative + percent}%`);
      cumulative += percent;
    });

    html += `
      <div class="flex-row" style="justify-content:center;gap:30px;flex-wrap:wrap;">

          <div class="pie-chart-center">
            <div class="stat-card-value" style="font-size:16px;">${App.formatMoney(total)}</div>
            <div class="stat-card-label">总支出</div>

            <div class="flex-row mb-8">

  // ============ 事件绑定 ============
  function bindEvents() {

        document.querySelectorAll('.summary-view-btn').forEach(b => b.classList.remove('btn-primary'));
