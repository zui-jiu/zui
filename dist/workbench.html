/* ============================================
 * timer.js - 共享计时器组件
 * 正计时 / 倒计时，记录存入全局计时仓库
 * ============================================ */

const Timer = (function () {

  // 当前活跃计时器实例
  let activeTimers = {}; // { instanceId: {intervalId, mode, seconds, target, name, source, startTime} }

  // 格式化时间
  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) {
      return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  // 创建计时器UI
  function createTimerWidget(containerId, source, onSaved) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const instanceId = containerId + '_' + Date.now();

    container.innerHTML = `
      <div class="timer-widget" id="${instanceId}">
        <div class="timer-mode-switch">
          <button class="btn btn-sm timer-mode-btn active" data-mode="up">正计时</button>
          <button class="btn btn-sm timer-mode-btn" data-mode="down">倒计时</button>
        </div>
        <div class="timer-name-row mt-12">
          <input type="text" class="input timer-name-input" placeholder="为本次计时命名（可选）">
        </div>
        <div class="timer-countdown-setup mt-12" style="display:none;">
          <div class="flex-row">
            <input type="number" class="input timer-min-input" placeholder="分钟" min="0" style="width:80px;" value="25">
            <span class="text-muted">分</span>
            <input type="number" class="input timer-sec-input" placeholder="秒" min="0" max="59" style="width:70px;" value="0">
            <span class="text-muted">秒</span>
          </div>
        </div>
        <div class="timer-display mt-12" id="${instanceId}_display">0:00</div>
        <div class="timer-controls mt-12">
          <button class="btn btn-primary timer-start-btn" id="${instanceId}_start">开始</button>
          <button class="btn timer-stop-btn" id="${instanceId}_stop" style="display:none;">暂停</button>
          <button class="btn timer-reset-btn" id="${instanceId}_reset">重置</button>
          <button class="btn timer-save-btn" id="${instanceId}_save" style="display:none;">保存记录</button>
        </div>
        <div class="timer-status mt-8 text-sm text-muted" id="${instanceId}_status"></div>
      </div>
    `;

    const widget = document.getElementById(instanceId);
    let mode = 'up';
    let seconds = 0;
    let target = 0;
    let intervalId = null;
    let isRunning = false;
    let startTime = null;

    // 模式切换
    widget.querySelectorAll('.timer-mode-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (isRunning) return;
        mode = this.dataset.mode;
        widget.querySelectorAll('.timer-mode-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const setup = widget.querySelector('.timer-countdown-setup');
        setup.style.display = mode === 'down' ? 'block' : 'none';
        seconds = 0;
        updateDisplay();
      });
    });

    // 更新显示
    function updateDisplay() {
      const display = document.getElementById(instanceId + '_display');
      if (mode === 'down' && target > 0) {
        const remaining = Math.max(0, target - seconds);
        display.textContent = formatTime(remaining);
      } else {
        display.textContent = formatTime(seconds);
      }
    }

    // 开始
    const startBtn = document.getElementById(instanceId + '_start');
    const stopBtn = document.getElementById(instanceId + '_stop');
    const resetBtn = document.getElementById(instanceId + '_reset');
    const saveBtn = document.getElementById(instanceId + '_save');
    const statusEl = document.getElementById(instanceId + '_status');

    startBtn.addEventListener('click', function () {
      const nameInput = widget.querySelector('.timer-name-input');
      if (mode === 'down') {
        const min = parseInt(widget.querySelector('.timer-min-input').value) || 0;
        const sec = parseInt(widget.querySelector('.timer-sec-input').value) || 0;
        target = min * 60 + sec;
        if (target === 0) {
          App.toast('请设置倒计时时长', 'warning');
          return;
        }
      }
      isRunning = true;
      startTime = Date.now();
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-flex';
      saveBtn.style.display = 'none';
      statusEl.textContent = '计时中…';

      intervalId = setInterval(function () {
        seconds++;
        updateDisplay();
        if (mode === 'down' && seconds >= target) {
          stopTimer(true);
          App.toast('倒计时完成！', 'success');
          // 播放提示音
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 1);
          } catch (e) {}
        }
      }, 1000);
    });

    function stopTimer(finished) {
      isRunning = false;
      clearInterval(intervalId);
      startBtn.style.display = 'inline-flex';
      stopBtn.style.display = 'none';
      saveBtn.style.display = 'inline-flex';
      statusEl.textContent = finished ? '已完成' : '已暂停';

      // 切换按钮文字
      if (!finished) {
        startBtn.textContent = '继续';
      } else {
        startBtn.textContent = '开始';
      }
    }

    stopBtn.addEventListener('click', function () {
      stopTimer(false);
    });

    resetBtn.addEventListener('click', function () {
      clearInterval(intervalId);
      isRunning = false;
      seconds = 0;
      target = 0;
      startBtn.style.display = 'inline-flex';
      startBtn.textContent = '开始';
      stopBtn.style.display = 'none';
      saveBtn.style.display = 'none';
      statusEl.textContent = '';
      updateDisplay();
    });

    saveBtn.addEventListener('click', function () {
      const nameInput = widget.querySelector('.timer-name-input');
      const name = nameInput.value.trim() || (source === 'exercise' ? '训练计时' : '学习计时');
      const timer = Store.addTimer({
        name: name,
        mode: mode,
        duration: seconds,
        targetDuration: target,
        source: source,
        startTime: startTime,
        endTime: Date.now()
      });
      App.toast(`计时记录"${name}"已保存到全局仓库（${formatTime(seconds)}）`, 'success');
      nameInput.value = '';
      seconds = 0;
      target = 0;
      startBtn.textContent = '开始';
      saveBtn.style.display = 'none';
      statusEl.textContent = '';
      updateDisplay();
      if (onSaved) onSaved(timer);
      App.updateTimerRepoCount();
    });

    updateDisplay();
  }

  // 渲染计时仓库列表（可嵌入任意模块）
  function renderTimerRepo(containerId, filter, onSelect) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const timers = Store.getTimers();
    const sorted = [...timers].sort((a, b) => b.createdAt - a.createdAt);

    if (sorted.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏱</div>暂无计时记录</div>';
      return;
    }

    let html = '<div class="timer-repo-list">';
    sorted.forEach(t => {
      if (filter && !filter(t)) return;
      const mins = Math.floor(t.duration / 60);
      const secs = t.duration % 60;
      const timeStr = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
      const sourceLabel = t.source === 'exercise' ? '锻炼' : '学习';
      html += `
        <div class="list-item timer-repo-item" data-id="${t.id}">
          <div class="flex-1">
            <div class="fw-600">${escapeHtml(t.name)}</div>
            <div class="text-sm text-muted">
              <span class="timer-source-tag">${sourceLabel}</span>
              ${t.mode === 'up' ? '正计时' : '倒计时'} · ${timeStr} · ${t.date}
            </div>
          </div>
          ${onSelect ? `<button class="btn btn-sm timer-import-btn" data-id="${t.id}">导入</button>` : ''}
          <button class="btn-text danger timer-delete-btn" data-id="${t.id}">删除</button>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;

    // 绑定事件
    if (onSelect) {
      container.querySelectorAll('.timer-import-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const timer = Store.getTimer(this.dataset.id);
          if (timer) onSelect(timer);
        });
      });
    }
    container.querySelectorAll('.timer-delete-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('确定删除这条计时记录？')) {
          Store.deleteTimer(this.dataset.id);
          App.toast('已删除', 'success');
          renderTimerRepo(containerId, filter, onSelect);
          App.updateTimerRepoCount();
        }
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 独立计时器页面
  function render(container) {
    container.innerHTML = `
      <div class="module-header">
        <h2>⏱ 计时器</h2>
        <div class="module-subtitle">正计时 / 倒计时 · 记录自动存入全局计时仓库</div>
      </div>

      <div class="section-block">
        <div id="timerMainWidget"></div>
      </div>

      <div class="section-block collapsible">
        <div class="section-title">
          <span class="section-title-icon">📜</span>
          计时记录
          <span class="text-xs text-muted" style="margin-left:4px;">（来源：计时器）</span>
        </div>
        <div id="timerRecordsList" style="max-height:320px;overflow-y:auto;"></div>
      </div>
    `;

    createTimerWidget('timerMainWidget', 'timer', function () {
      renderRecords();
    });
    renderRecords();
    App.bindCollapsible(container);
  }

  function renderRecords() {
    const el = document.getElementById('timerRecordsList');
    if (!el) return;
    renderTimerRepo('timerRecordsList', function (t) { return t.source === 'timer'; }, null);
  }

  return {
    createTimerWidget,
    renderTimerRepo,
    formatTime,
    render
  };
})();


/* ===== dashboard.js ===== */
/* ============================================
 * dashboard.js - 总览面板模块
 * 月历组件 · 今日动态（快捷入口 + 当日汇总）· 目标管理
 * ============================================ */

const Dashboard = (function () {

  // 当前日历显示的月份（YYYY-MM），默认跟随当前日期
  let calMonth = null;

  function render(container) {
    if (!calMonth) calMonth = Store.getCurrentDate().slice(0, 7);
    const date = Store.getCurrentDate();

    container.innerHTML = `
      <div class="module-header">
        <h2>◈ 总览面板</h2>
        <div class="module-subtitle">${getWeekdayText(date)}</div>
      </div>

      <!-- 月历组件 -->
      <div class="section-block">
        <div id="calendarArea">${renderCalendar()}</div>
      </div>

      <!-- 今日动态：合并快捷入口 + 当日汇总 -->
      <div class="section-block collapsible">
        <div class="section-title">
          <span class="section-title-icon">⚡</span>
          今日动态
        </div>
        <div id="todayDynamicArea">${renderTodayDynamic()}</div>
      </div>

      <!-- 目标管理 -->
      <div class="section-block collapsible">
        <div class="section-title">
          <span class="section-title-icon">🎯</span>
          目标管理
          <button class="btn btn-sm" id="editGoalsBtn" style="margin-left:auto;">设置目标</button>
        </div>
        <div class="grid-3">
          ${renderGoalCard('exercise', '月度运动目标', Timer.formatTime(monthExerciseDuration()), goalsSummary().exercise.target ? Timer.formatTime(goalsSummary().exercise.target) : '未设置', monthExerciseDuration(), goalsSummary().exercise.target, '分')}
          ${renderGoalCard('reading', '月度阅读目标', Timer.formatTime(monthStudyDuration()), goalsSummary().reading.target ? Timer.formatTime(goalsSummary().reading.target) : '未设置', goalsSummary().reading.current, goalsSummary().reading.target, '分')}
          ${renderGoalCard('savings', '月度储蓄目标', App.formatMoney(monthSavings()), goalsSummary().savings.target ? App.formatMoney(goalsSummary().savings.target) : '未设置', monthSavings(), goalsSummary().savings.target, '元')}
        </div>
      </div>
    `;

    bindEvents();
    App.bindCollapsible(container);
  }

  // 月历渲染
  function renderCalendar() {
    const [year, month] = calMonth.split('-').map(Number);
    const firstDay = new Date(year, month - 1, 1);
    const startWeekday = firstDay.getDay(); // 0=周日
    const daysInMonth = new Date(year, month, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);
    const curDate = Store.getCurrentDate();

    // 备注标记
    const dailyNotes = Store.getAll().dailyNotes || {};

    let cells = '';
    for (let i = 0; i < startWeekday; i++) {
      cells += '<div class="cal-cell cal-cell-empty"></div>';
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = ds === todayStr;
      const isSelected = ds === curDate;
      const hasNote = !!dailyNotes[ds];
      const cls = ['cal-cell'];
      if (isToday) cls.push('cal-today');
      if (isSelected) cls.push('cal-selected');
      cells += `<div class="${cls.join(' ')}" data-date="${ds}">
        <span class="cal-num">${d}</span>
        ${hasNote ? '<span class="cal-note-dot"></span>' : ''}
      </div>`;
    }

    const weekHead = ['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="cal-weekday">${w}</div>`).join('');

    return `
      <div class="calendar">
        <div class="calendar-header">
          <button class="date-nav-btn" id="calPrevBtn" title="上一月">‹</button>
          <div class="calendar-title">${year}年${month}月</div>
          <button class="date-nav-btn" id="calNextBtn" title="下一月">›</button>
          <button class="date-today-btn" id="calTodayBtn" style="margin-left:8px;">今天</button>
        </div>
        <div class="calendar-weekdays">${weekHead}</div>
        <div class="calendar-grid">${cells}</div>
      </div>
    `;
  }

  // 今日动态（快捷入口 + 当日汇总）
  function renderTodayDynamic() {
    const date = Store.getCurrentDate();

    const checklistTasks = Store.getChecklistTasks(date);
    const archivedTasks = Store.getArchivedTasks(date);
    const exerciseCheckins = Store.getExerciseCheckins(date);
    const studyTodos = Store.getStudyTodosByDate(date);
    const transactions = Store.getTransactions(date);

    let exerciseDuration = 0;
    exerciseCheckins.forEach(c => (c.timerIds || []).forEach(id => {
      const t = Store.getTimer(id); if (t) exerciseDuration += t.duration;
    }));
    let studyDuration = 0;
    studyTodos.forEach(t => (t.timerIds || []).forEach(id => {
      const tm = Store.getTimer(id); if (tm) studyDuration += tm.duration;
    }));
    const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

    const quickActions = [
      { module: 'exercise', icon: '🏃', label: '去锻炼' },
      { module: 'study', icon: '📚', label: '去学习' },
      { module: 'checklist', icon: '📋', label: '去清单' },
      { module: 'accounting', icon: '💰', label: '去记账' }
    ];

    const summaryCards = [
      { icon: '🏃', value: Timer.formatTime(exerciseDuration), label: '运动时长', sub: `${exerciseCheckins.length} 次训练` },
      { icon: '📚', value: Timer.formatTime(studyDuration), label: '学习时长', sub: `${studyTodos.filter(t => (t.checkDates || []).includes(date)).length}/${studyTodos.length} 已完成` },
      { icon: '📋', value: checklistTasks.length, label: '待办事项', sub: `${archivedTasks.length} 已完成` },
      { icon: '💰', value: App.formatMoney(expense), label: '今日支出', sub: `收入 ${App.formatMoney(income)}` }
    ];

    return `
      <div class="quick-actions-grid">
        ${quickActions.map(q => `
          <div class="quick-action" data-module="${q.module}">
            <span style="font-size:26px;">${q.icon}</span>
            <span class="text-sm">${q.label}</span>
          </div>
        `).join('')}
      </div>

      <div class="today-summary mt-16">
        ${summaryCards.map(c => `
          <div class="dashboard-card today-summary-card">
            <div class="dashboard-card-icon">${c.icon}</div>
            <div class="dashboard-card-info">
              <div class="dashboard-card-value">${c.value}</div>
              <div class="dashboard-card-label">${c.label}</div>
              <div class="dashboard-card-sub">${c.sub}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // 月份维度的目标统计
  function goalsSummary() {
    const monthStr = Store.getCurrentDate().slice(0, 7);
    let monthExerciseDuration = 0;
    Store.getAllCheckins().forEach(c => {
      if (c.date.startsWith(monthStr)) (c.timerIds || []).forEach(id => {
        const t = Store.getTimer(id); if (t) monthExerciseDuration += t.duration;
      });
    });
    let monthStudyDuration = 0;
    Store.getStudyTodos().forEach(t => (t.timerIds || []).forEach(id => {
      const tm = Store.getTimer(id);
      if (tm && tm.date.startsWith(monthStr)) monthStudyDuration += tm.duration;
    }));
    const monthTxs = Store.getTransactionsByMonth(monthStr);
    const monthIncome = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const monthExpense = monthTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const goals = Store.getGoals();
    return {
      exercise: { current: monthExerciseDuration, target: goals.exercise.monthlyMinutes * 60 },
      reading: { current: monthStudyDuration, target: goals.reading.monthlyMinutes * 60 },
      savings: { current: monthIncome - monthExpense, target: goals.savings.monthlyTarget }
    };
  }
  function monthExerciseDuration() { return goalsSummary().exercise.current; }
  function monthStudyDuration() { return goalsSummary().reading.current; }
  function monthSavings() { return goalsSummary().savings.current; }

  function getWeekdayText(dateStr) {
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${'日一二三四五六'[d.getDay()]}`;
  }

  function renderGoalCard(key, label, currentValue, targetValue, current, target, unit) {
    const percent = target > 0 ? Math.min(100, (current / target * 100)).toFixed(0) : 0;
    return `
      <div class="goal-card stat-card">
        <div class="text-sm text-muted mb-8">${label}</div>
        <div class="flex-between mb-8">
          <span class="fw-600" style="font-size:18px;color:var(--celadon-dark);">${currentValue}</span>
          <span class="text-sm text-muted">/ ${targetValue}</span>
        </div>
        <div class="goal-progress-bar">
          <div class="goal-progress-fill" style="width:${percent}%;background:${percent >= 100 ? 'var(--celadon)' : 'var(--celadon-light)'};"></div>
        </div>
        <div class="text-xs text-muted mt-8">${percent}% ${percent >= 100 ? '🎉 已达成！' : ''}</div>
      </div>
    `;
  }

  // 编辑某日期「一句话备注」的弹窗
  function showDateNoteModal(dateStr) {
    const existing = Store.getDailyNote(dateStr);
    App.modal(`${dateStr} 的备注`, `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">一句话备注</label>
        <textarea class="textarea" id="dailyNoteInput" rows="3" placeholder="为这一天写一句话备注…">${App.escapeHtml(existing)}</textarea>
      </div>
      <div class="text-sm text-muted">该备注会显示在月历对应日期上。</div>
    `, [
      { label: '删除', onClick: function () {
          Store.deleteDailyNote(dateStr);
          App.toast('备注已删除', 'success');
          refreshCalendar();
        }
      },
      { label: '保存', primary: true, onClick: function (body) {
          const val = body.querySelector('#dailyNoteInput').value;
          Store.setDailyNote(dateStr, val);
          App.toast('备注已保存', 'success');
          refreshCalendar();
        }
      }
    ]);
  }

  function refreshCalendar() {
    const area = document.getElementById('calendarArea');
    if (area) area.innerHTML = renderCalendar();
    bindCalendarEvents();
  }

  function bindCalendarEvents() {
    const prev = document.getElementById('calPrevBtn');
    const next = document.getElementById('calNextBtn');
    const todayBtn = document.getElementById('calTodayBtn');
    if (prev) prev.addEventListener('click', function () {
      const [y, m] = calMonth.split('-').map(Number);
      const d = new Date(y, m - 2, 1);
      calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      refreshCalendar();
    });
    if (next) next.addEventListener('click', function () {
      const [y, m] = calMonth.split('-').map(Number);
      const d = new Date(y, m, 1);
      calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      refreshCalendar();
    });
    if (todayBtn) todayBtn.addEventListener('click', function () {
      const t = new Date().toISOString().slice(0, 10);
      calMonth = t.slice(0, 7);
      Store.setCurrentDate(t);
      const di = document.getElementById('currentDate');
      if (di) di.value = t;
      render(document.getElementById('contentArea'));
    });
    document.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', function () {
        const ds = this.dataset.date;
        Store.setCurrentDate(ds);
        const di = document.getElementById('currentDate');
        if (di) di.value = ds;
        // 先刷新高亮，再弹备注
        refreshCalendar();
        showDateNoteModal(ds);
      });
    });
  }

  function showEditGoalsModal() {
    const goals = Store.getGoals();
    App.modal('设置月度目标', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">月度运动目标（分钟/月）</label>
        <input type="number" class="input" id="goalExercise" value="${goals.exercise.monthlyMinutes || ''}" placeholder="如 1000">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">月度阅读目标（分钟/月）</label>
        <input type="number" class="input" id="goalReading" value="${goals.reading.monthlyMinutes || ''}" placeholder="如 1200">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">月度储蓄目标（元/月）</label>
        <input type="number" class="input" id="goalSavings" value="${goals.savings.monthlyTarget || ''}" placeholder="如 3000">
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          Store.updateGoals({
            exercise: { monthlyMinutes: parseInt(body.querySelector('#goalExercise').value) || 0, label: '月度运动目标(分钟)' },
            reading: { monthlyMinutes: parseInt(body.querySelector('#goalReading').value) || 0, label: '月度阅读目标(分钟)' },
            savings: { monthlyTarget: parseFloat(body.querySelector('#goalSavings').value) || 0, label: '月度储蓄目标(元)' }
          });
          App.toast('目标已设置', 'success');
          render(document.getElementById('contentArea'));
        }
      }
    ]);
  }

  function bindEvents() {
    document.getElementById('editGoalsBtn').addEventListener('click', showEditGoalsModal);
    bindCalendarEvents();
    document.querySelectorAll('.quick-action').forEach(el => {
      el.addEventListener('click', function () {
        App.loadModule(this.dataset.module);
      });
    });
  }

  return { render };
})();


/* ===== exercise.js ===== */
/* ============================================
 * exercise.js - 锻炼计划模块（重构）
 * 每日打卡方框 · 详情弹窗 · 目录式历史统计（SVG 折线图）· 数据录入
 * ============================================ */

const Exercise = (function () {

  // 历史统计视图状态
  let statView = 'menu'; // 'menu' | 'weight' | 'fitness' | 'freq' | 'all'
  let statPeriod = 'month'; // 'week' | 'month'

  // 选中的标签和计时器（详情弹窗内）
  let selectedLabels = [];
  let selectedTimerIds = [];

  function render(container) {
    const date = Store.getCurrentDate();

          训练历史统计
        </div>
        <div id="exerciseStatsArea">${renderStatsArea()}</div>
      </div>

      <!-- 板块3：数据录入（目录式） -->
      <div class="section-block collapsible collapsed">
        <div class="section-title">
          <span class="section-title-icon">⚖️</span>
          体能与体重录入
        </div>
        <div class="dir-list">
          <div class="dir-item" data-action="new-checkin">
            <span class="dir-item-icon">🏋</span>
            <span class="dir-item-main">
              <span class="dir-item-title">新增训练打卡</span>
              <span class="dir-item-sub">记录今日训练标签、备注、体重、体能</span>
            </span>
            <span class="dir-item-arrow">›</span>
          </div>
          <div class="dir-item" data-action="weight-quick">
            <span class="dir-item-icon">⚖️</span>
            <span class="dir-item-main">
              <span class="dir-item-title">体重速记</span>
              <span class="dir-item-sub">快速记录今日体重</span>
            </span>
            <span class="dir-item-arrow">›</span>
          </div>
          <div class="dir-item" data-action="fitness-quick">
            <span class="dir-item-icon">🔥</span>
            <span class="dir-item-main">
              <span class="dir-item-title">体能速记</span>
              <span class="dir-item-sub">快速记录今日体能</span>
            </span>
            <span class="dir-item-arrow">›</span>
          </div>
        </div>
      </div>
    `;

    bindEvents();
    App.bindCollapsible(container);
  }

  // 渲染今日打卡列表（紧凑）
  function renderTodayCheckins() {
    const date = Store.getCurrentDate();
    const checkins = Store.getExerciseCheckins(date);
    if (checkins.length === 0) {
      return '<div class="text-sm text-muted">今日还没有打卡记录</div>';
    }
    return checkins.map(c => {
      const timers = (c.timerIds || []).map(id => {
        const t = Store.getTimer(id);
        return t ? `<span class="tag" style="font-size:11px;">${App.escapeHtml(t.name)} (${Timer.formatTime(t.duration)})</span>` : '';
      }).join(' ');
      return `
        <div class="list-item checkin-mini" data-id="${c.id}" style="cursor:pointer;align-items:flex-start;flex-direction:column;">
          <div class="flex-between w-full">
            <div class="flex-row flex-wrap">
              ${c.labels.map(l => `<span class="tag selected" style="cursor:default;">${l}</span>`).join(' ')}
            </div>
            <button class="btn-text danger delete-checkin-btn" data-id="${c.id}">删除</button>
          </div>
          ${timers ? `<div class="mt-8">${timers}</div>` : ''}
          ${c.notes || c.summary || c.weight || c.fitness ? `
            <div class="text-sm text-muted mt-8" style="line-height:1.7;">
              ${c.weight ? '体重 ' + App.escapeHtml(c.weight) + 'kg · ' : ''}${c.fitness ? '体能 ' + App.escapeHtml(c.fitness) + ' · ' : ''}${c.notes ? App.escapeHtml(c.notes) : ''}${c.summary ? '『' + App.escapeHtml(c.summary) + '』' : ''}
            </div>` : ''}
        </div>
      `;
    }).join('');
  }

  // 历史统计区域（目录 / 图表）
  function renderStatsArea() {
    if (statView === 'menu') {
      const items = [
        { key: 'weight', icon: '⚖️', title: '体重变化', sub: '体重随时间的折线趋势' },
        { key: 'fitness', icon: '🔥', title: '体能评分', sub: '体能记录数值化折线趋势' },
        { key: 'freq', icon: '📅', title: '训练频次', sub: '每日训练次数折线' },
        { key: 'all', icon: '📈', title: '综合概览', sub: '体重 / 体能 / 频次 同图' }
      ];
      return '<div class="dir-list">' + items.map(it => `
        <div class="dir-item" data-stat="${it.key}">
          <span class="dir-item-icon">${it.icon}</span>
          <span class="dir-item-main">
            <span class="dir-item-title">${it.title}</span>
            <span class="dir-item-sub">${it.sub}</span>
          </span>
          <span class="dir-item-arrow">›</span>
        </div>
      `).join('') + '</div>';
    }

    // 子视图
    const titles = { weight: '体重变化', fitness: '体能评分', freq: '训练频次', all: '综合概览' };
    let html = `
      <div class="flex-between mb-12">
        <button class="btn-text" id="statBackBtn">← 返回目录</button>
        <div class="flex-row" style="gap:6px;">
          <button class="btn btn-sm stat-period-btn ${statPeriod === 'week' ? 'btn-primary' : ''}" data-period="week">本周</button>
          <button class="btn btn-sm stat-period-btn ${statPeriod === 'month' ? 'btn-primary' : ''}" data-period="month">本月</button>
        </div>
      </div>
      <div class="text-sm text-muted mb-8">${titles[statView]} · ${statPeriod === 'week' ? '本周' : '本月'}</div>
      <div id="statChartArea"></div>
    `;
    return html;
  }

  // 计算统计序列
  function buildSeries() {
    const all = Store.getAllCheckins();
    const today = new Date(Store.getCurrentDate());
    let dates = [];
    if (statPeriod === 'week') {
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        dates.push(d.toISOString().slice(0, 10));
      }
    } else {
      const y = today.getFullYear(), m = today.getMonth();
      const days = new Date(y, m + 1, 0).getDate();
      for (let i = 1; i <= days; i++) {
        dates.push(`${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
      }
    }
    // 频次
    const freqData = dates.map(ds => all.filter(c => c.date === ds).length);
    // 体重 / 体能
    const wMap = {}, fMap = {};
    all.forEach(c => {
      if (c.weight && !isNaN(parseFloat(c.weight))) wMap[c.date] = parseFloat(c.weight);
      const num = extractNumber(c.fitness);
      if (num != null) fMap[c.date] = num;
    });
    const wDates = Object.keys(wMap).filter(d => dates.includes(d)).sort();
    const fDates = Object.keys(fMap).filter(d => dates.includes(d)).sort();
    return {
      freq: { labels: dates.map(d => d.slice(5)), data: freqData },
      weight: { labels: wDates.map(d => d.slice(5)), data: wDates.map(d => wMap[d]) },
      fitness: { labels: fDates.map(d => d.slice(5)), data: fDates.map(d => fMap[d]) }
    };
  }

  function extractNumber(str) {
    if (!str) return null;
    const m = str.match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  function renderStatChart() {
    const el = document.getElementById('statChartArea');
    if (!el) return;
    const s = buildSeries();
    if (statView === 'weight') {
      if (s.weight.data.length < 2) { el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚖️</div>体重数据不足，请在打卡时填写体重</div>'; return; }
      App.lineChart(el, { labels: s.weight.labels, series: [{ name: '体重(kg)', color: 'var(--info)', data: s.weight.data }] });
    } else if (statView === 'fitness') {
      if (s.fitness.data.length < 2) { el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔥</div>体能数据不足，请在打卡时填写可量化的体能（如 5km）</div>'; return; }
      App.lineChart(el, { labels: s.fitness.labels, series: [{ name: '体能(数值)', color: 'var(--warning)', data: s.fitness.data }] });
    } else if (statView === 'freq') {
      App.lineChart(el, { labels: s.freq.labels, series: [{ name: '训练次数', color: 'var(--celadon)', data: s.freq.data }] });
    } else if (statView === 'all') {
      const series = [];
      if (s.weight.data.length >= 2) series.push({ name: '体重(kg)', color: 'var(--info)', data: s.weight.data });
      if (s.fitness.data.length >= 2) series.push({ name: '体能', color: 'var(--warning)', data: s.fitness.data });
      series.push({ name: '训练次数', color: 'var(--celadon)', data: s.freq.data });
      if (series.length === 0) { el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📈</div>暂无足够数据</div>'; return; }
      App.lineChart(el, { labels: s.freq.labels, series: series });
    }
  }

  // 打卡详情弹窗
  function openCheckinModal(existing) {
    const isEdit = !!existing;
    if (!isEdit) { selectedLabels = []; selectedTimerIds = []; }
    else {
      selectedLabels = [...(existing.labels || [])];
      selectedTimerIds = [...(existing.timerIds || [])];
    }
    const labels = Store.getTrainingLabels();

    App.modal(isEdit ? '编辑训练打卡' : '训练打卡', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">训练标签（可多选）</label>
        <div class="flex-row flex-wrap" id="modalLabels" style="gap:6px;">
          ${labels.map(l => `<span class="tag training-label-tag ${selectedLabels.includes(l) ? 'selected' : ''}" data-label="${App.escapeHtml(l)}">${App.escapeHtml(l)}</span>`).join('')}
        </div>
        <button class="btn btn-sm mt-8" id="addTrainingLabelBtn">+ 自定义标签</button>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">导入计时记录（可选）</label>
        <div id="checkinTimerRepo" class="timer-repo-container"></div>
        <div id="selectedTimersDisplay" class="mt-8 flex-row flex-wrap" style="gap:6px;"></div>
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">备注</label>
          <textarea class="textarea" id="checkinNotes" rows="2" placeholder="训练感受…">${isEdit ? App.escapeHtml(existing.notes || '') : ''}</textarea>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">总结</label>
          <textarea class="textarea" id="checkinSummary" rows="2" placeholder="完成情况…">${isEdit ? App.escapeHtml(existing.summary || '') : ''}</textarea>
        </div>
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">体重 (kg)</label>
          <input type="number" class="input" id="checkinWeight" step="0.1" placeholder="如 65.5" value="${isEdit ? App.escapeHtml(existing.weight || '') : ''}">
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">体能记录</label>
          <input type="text" class="input" id="checkinFitness" placeholder="如 跑步5km/俯卧撑30" value="${isEdit ? App.escapeHtml(existing.fitness || '') : ''}">
        </div>
      </div>
    `, [
      ...(isEdit ? [{ label: '删除', onClick: function () {
          if (confirm('确定删除这条打卡？')) {
            Store.deleteExerciseCheckin(existing.id);
            App.toast('已删除', 'success');
            refreshAfterCheckin();
          }
        } }] : []),
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const data = {
            labels: [...selectedLabels],
            timerIds: [...selectedTimerIds],
            notes: body.querySelector('#checkinNotes').value,
            summary: body.querySelector('#checkinSummary').value,
            weight: body.querySelector('#checkinWeight').value,
            fitness: body.querySelector('#checkinFitness').value
          };
          if (isEdit) {
            Store.updateExerciseCheckin(existing.id, data);
            App.toast('打卡已更新', 'success');
          } else {
            if (data.labels.length === 0 && data.timerIds.length === 0 && !data.notes && !data.summary && !data.weight && !data.fitness) {
              App.toast('请至少填写一项内容', 'warning');
              return false;
            }
            Store.addExerciseCheckin(data);
            App.toast('打卡已保存', 'success');
          }
          refreshAfterCheckin();
        }
      }
    ]);

    // 标签选择
    document.querySelectorAll('#modalLabels .training-label-tag').forEach(tag => {
      tag.addEventListener('click', function () {
        const l = this.dataset.label;
        if (selectedLabels.includes(l)) { selectedLabels = selectedLabels.filter(x => x !== l); this.classList.remove('selected'); }
        else { selectedLabels.push(l); this.classList.add('selected'); }
      });
    });
    const addLblBtn = document.getElementById('addTrainingLabelBtn');
    addLblBtn.addEventListener('click', function () {
      App.modal('添加训练标签', `
        <div class="mb-12"><input type="text" class="input" id="newTrainingLabel" placeholder="如：HIIT训练"></div>
      `, [
        { label: '取消' },
        { label: '添加', primary: true, onClick: function (b) {
            const name = b.querySelector('#newTrainingLabel').value.trim();
            if (!name) { App.toast('请输入名称', 'warning'); return false; }
            Store.addTrainingLabel(name);
            App.toast('已添加', 'success');
            openCheckinModal(isEdit ? existing : null);
          } }
      ]);
    });

    // 计时仓库
    Timer.renderTimerRepo('checkinTimerRepo', function (t) { return t.source === 'exercise' || t.source === 'timer'; }, function (timer) {
      if (!selectedTimerIds.includes(timer.id)) {
        selectedTimerIds.push(timer.id);
        App.toast(`已导入「${timer.name}」`, 'success');
        renderSelectedTimers();
      }
    });
    renderSelectedTimers();
  }

  function renderSelectedTimers() {
    const el = document.getElementById('selectedTimersDisplay');
    if (!el) return;
    if (selectedTimerIds.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = selectedTimerIds.map(id => {
      const t = Store.getTimer(id);
      return t ? `<span class="tag selected" style="cursor:pointer;" data-id="${id}">${App.escapeHtml(t.name)} ✕</span>` : '';
    }).join(' ');
    el.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', function () {
        selectedTimerIds = selectedTimerIds.filter(x => x !== this.dataset.id);
        renderSelectedTimers();
      });
    });
  }

  // 快捷录入（体重/体能）
  function quickEntry(kind) {
    const date = Store.getCurrentDate();
    const existing = Store.getExerciseCheckins(date)[0];
    if (existing) {
      const val = prompt(kind === 'weight' ? '请输入今日体重(kg)：' : '请输入今日体能记录：');
      if (val == null) return;
      const updates = kind === 'weight' ? { weight: val } : { fitness: val };
      Store.updateExerciseCheckin(existing.id, updates);
      App.toast('已记录', 'success');
      render(document.getElementById('contentArea'));
    } else {
      const val = prompt(kind === 'weight' ? '请输入今日体重(kg)：' : '请输入今日体能记录：');
      if (val == null) return;
      const data = kind === 'weight' ? { weight: val } : { fitness: val };
      Store.addExerciseCheckin(data);
      App.toast('已打卡并记录', 'success');
      render(document.getElementById('contentArea'));
    }
  }

  function refreshAfterCheckin() {
    render(document.getElementById('contentArea'));
  }

  function bindEvents() {
    document.getElementById('openCheckinBtn').addEventListener('click', function () {
      const date = Store.getCurrentDate();
      const checkins = Store.getExerciseCheckins(date);
      openCheckinModal(checkins.length > 0 ? checkins[0] : null);
    });

    document.getElementById('checkinStatusBox').addEventListener('click', function (e) {
      if (e.target.closest('#openCheckinBtn')) return;
      const date = Store.getCurrentDate();
      const checkins = Store.getExerciseCheckins(date);
      openCheckinModal(checkins.length > 0 ? checkins[0] : null);
    });

    document.querySelectorAll('.checkin-mini').forEach(el => {
      el.addEventListener('click', function (e) {
        if (e.target.closest('.delete-checkin-btn')) return;
        const c = Store.getExerciseCheckins(Store.getCurrentDate()).find(x => x.id === this.dataset.id);
        if (c) openCheckinModal(c);
      });
    });

    document.querySelectorAll('.delete-checkin-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('确定删除这条打卡？')) {
          Store.deleteExerciseCheckin(this.dataset.id);
          App.toast('已删除', 'success');
          render(document.getElementById('contentArea'));
        }
      });
    });

    // 历史统计目录
    document.querySelectorAll('[data-stat]').forEach(item => {
      item.addEventListener('click', function () {
        statView = this.dataset.stat;
        const area = document.getElementById('exerciseStatsArea');
        area.innerHTML = renderStatsArea();
        bindStatsArea();
        if (statView !== 'menu') renderStatChart();
      });
    });

    // 数据录入目录
    document.querySelectorAll('.dir-item[data-action]').forEach(item => {
      item.addEventListener('click', function () {
        const action = this.dataset.action;
        if (action === 'new-checkin') {
          const date = Store.getCurrentDate();
          openCheckinModal(Store.getExerciseCheckins(date)[0] || null);
        } else if (action === 'weight-quick') quickEntry('weight');
        else if (action === 'fitness-quick') quickEntry('fitness');
      });
    });
  }

  function bindStatsArea() {
    const back = document.getElementById('statBackBtn');
    if (back) back.addEventListener('click', function () {
      statView = 'menu';
      document.getElementById('exerciseStatsArea').innerHTML = renderStatsArea();
      bindStatsArea();
    });
    document.querySelectorAll('.stat-period-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        statPeriod = this.dataset.period;
        document.querySelectorAll('.stat-period-btn').forEach(b => b.classList.remove('btn-primary'));
        this.classList.add('btn-primary');
        renderStatChart();
      });
    });
  }

  return { render };
})();

          学习统计
          <div style="margin-left:auto;display:flex;gap:6px;">
            <button class="btn btn-sm stat-period-btn ${statPeriod === 'week' ? 'btn-primary' : ''}" data-period="week">本周</button>
            <button class="btn btn-sm stat-period-btn ${statPeriod === 'month' ? 'btn-primary' : ''}" data-period="month">本月</button>
          </div>
        </div>
        <div class="flex-row mb-12" style="gap:6px;justify-content:flex-end;">

        </div>
        <div id="studyStatsArea"></div>
      </div>
    `;

    renderTodoList();
    renderNotesDir();
    renderStats();
    bindEvents();
