    const todos = Store.getStudyTodos();

    App.modal(note ? '编辑笔记' : '写笔记', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">标题</label>
        <input type="text" class="input" id="noteTitle" value="${note ? App.escapeHtml(note.title) : ''}" placeholder="输入笔记标题">
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">所属目录</label>
          <select class="select" id="noteCategory">
            ${categories.map(c => `<option value="${c.id}" ${note && note.categoryId === c.id ? 'selected' : ''}>${App.escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">关联任务（可选）</label>
          <select class="select" id="noteLinkedTodo">
            <option value="">不关联</option>
            ${todos.map(t => `<option value="${t.id}" ${note && note.linkedTodoId === t.id ? 'selected' : ''}>${App.escapeHtml(t.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">内容</label>
        <textarea class="textarea" id="noteContent" rows="8" placeholder="开始记录...">${note ? App.escapeHtml(note.content) : ''}</textarea>
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const title = body.querySelector('#noteTitle').value.trim();
          if (!title) {
            App.toast('请输入标题', 'warning');
            return false;
          }
          const data = {
            title: title,
            categoryId: body.querySelector('#noteCategory').value,
            linkedTodoId: body.querySelector('#noteLinkedTodo').value || null,
            content: body.querySelector('#noteContent').value
          };
          if (note) {
            Store.updateStudyNote(note.id, data);
          } else {
            Store.addStudyNote(data);
          }
          renderNotes();
          renderCategories();
          App.toast('已保存', 'success');
        }
      }
    ]);
  }

  // ============ 学习时长统计 ============
  function renderTimeStats() {
    const container = document.getElementById('studyTimeStats');
    const categories = Store.getStudyCategories();
    const todos = Store.getStudyTodos();

    // 按目录统计累计时长
    const stats = {};
    categories.forEach(c => { stats[c.id] = { name: c.name, duration: 0, count: 0 }; });

    todos.forEach(t => {
      (t.timerIds || []).forEach(id => {
        const timer = Store.getTimer(id);
        if (timer) {
          // 通过笔记的关联任务反查目录
          const notes = Store.getStudyNotes().filter(n => n.linkedTodoId === t.id);
          if (notes.length > 0) {
            notes.forEach(n => {
              if (stats[n.categoryId]) {
                stats[n.categoryId].duration += timer.duration;
                stats[n.categoryId].count++;
              }
            });
          } else {
            // 没有关联笔记的任务，归到"未分类"
            if (!stats['uncategorized']) {
              stats['uncategorized'] = { name: '未分类', duration: 0, count: 0 };
            }
            stats['uncategorized'].duration += timer.duration;
            stats['uncategorized'].count++;
          }
        }
      });
    });

    const entries = Object.entries(stats).filter(([k, v]) => v.duration > 0);

    if (entries.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div>暂无学习时长数据，开始计时学习吧！</div>';
      return;
    }

    const totalDuration = entries.reduce((sum, [, v]) => sum + v.duration, 0);
    const maxDuration = Math.max(...entries.map(([, v]) => v.duration));

    let html = `
      <div class="stat-card mb-16" style="text-align:left;">
        <div class="flex-between">
          <div>
            <div class="stat-card-value">${Timer.formatTime(totalDuration)}</div>
            <div class="stat-card-label">累计学习总时长</div>
          </div>
          <div style="font-size:36px;opacity:0.3;">📚</div>
        </div>
      </div>
      <div class="text-sm text-muted mb-8">各学习类目累计时长</div>
      <div class="freq-chart">
    `;

    entries.sort((a, b) => b[1].duration - a[1].duration);
    entries.forEach(([, v]) => {
      const width = (v.duration / maxDuration * 100).toFixed(0);
      html += `
        <div class="freq-bar-row">
          <span class="freq-bar-label">${App.escapeHtml(v.name)}</span>
          <div class="freq-bar-track">
            <div class="freq-bar-fill" style="width:${width}%;"></div>
          </div>
          <span class="freq-bar-count">${Timer.formatTime(v.duration)}</span>
        </div>
      `;
    });
    html += '</div>';

    container.innerHTML = html;
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    document.getElementById('addStudyTodoBtn').addEventListener('click', function () {
      App.modal('新增待学任务', `
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">任务名称</label>
          <input type="text" class="input" id="newTodoName" placeholder="如：学习React Hooks">
        </div>
        <div class="grid-2 mb-12">
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">截止日期（可选）</label>
            <input type="date" class="input" id="newTodoDeadline">
          </div>
          <div>
            <label class="text-sm text-muted mb-8" style="display:block;">优先级</label>
            <select class="select" id="newTodoPriority">
              <option value="low">低</option>
              <option value="normal" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
        </div>
      `, [
        { label: '取消' },
        {
          label: '添加',
          primary: true,
          onClick: function (body) {
            const name = body.querySelector('#newTodoName').value.trim();
            if (!name) {
              App.toast('请输入任务名称', 'warning');
              return false;
            }
            Store.addStudyTodo({
              name: name,
              deadline: body.querySelector('#newTodoDeadline').value,
              priority: body.querySelector('#newTodoPriority').value
            });
            renderTodoList();
            App.toast('任务已添加', 'success');
          }
        }
      ]);
    });

    document.getElementById('addStudyCategoryBtn').addEventListener('click', function () {
      App.modal('新增笔记目录', `
        <div class="mb-12">
          <label class="text-sm text-muted mb-8" style="display:block;">目录名称</label>
          <input type="text" class="input" id="newCatName" placeholder="如：前端开发">
        </div>
      `, [
        { label: '取消' },
        {
          label: '添加',
          primary: true,
          onClick: function (body) {
            const name = body.querySelector('#newCatName').value.trim();
            if (!name) {
              App.toast('请输入目录名称', 'warning');
              return false;
            }
            Store.addStudyCategory(name);
            renderCategories();
            App.toast('目录已添加', 'success');
          }
        }
      ]);
    });

    document.getElementById('addStudyNoteBtn').addEventListener('click', function () {
      const categories = Store.getStudyCategories();
      if (categories.length === 0) {
        App.toast('请先创建一个笔记目录', 'warning');
        return;
      }
      showEditNoteModal(null);
    });
  }

  return { render };
})();


/* ===== checklist.js ===== */
/* ============================================
 * checklist.js - 每日清单模块
 * 四象限看板 · 跨象限拖拽 · 循环任务 · 归档
 * ============================================ */

const Checklist = (function () {

  const QUADRANTS = [
    { id: 0, name: '重要且紧急', icon: '🔴', color: 'var(--danger)', desc: '立即处理' },
    { id: 1, name: '重要不紧急', icon: '🟡', color: 'var(--warning)', desc: '计划安排' },
    { id: 2, name: '不重要但紧急', icon: '🟠', color: '#D4855E', desc: '委托或快速完成' },
    { id: 3, name: '不重要不紧急', icon: '🟢', color: 'var(--bean-green)', desc: '闲暇时做' }
  ];

  let draggedTaskId = null;

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>📋 每日清单</h2>
        <div class="module-subtitle">四象限看板 · 拖拽排序 · 循环任务 · ${App.formatDate(date)}</div>
      </div>

      <div class="flex-between mb-16">
        <div class="flex-row">
          <button class="btn btn-primary" id="addChecklistTaskBtn">+ 新增任务</button>
          <button class="btn" id="showArchivedBtn">查看已完成</button>
        </div>
        <div class="text-sm text-muted" id="checklistSummary"></div>
      </div>

      <div class="quadrant-board" id="quadrantBoard">
        ${QUADRANTS.map(q => `
          <div class="quadrant" data-quadrant="${q.id}">
            <div class="quadrant-header" style="border-top:3px solid ${q.color};">
              <span class="quadrant-icon">${q.icon}</span>
              <span class="quadrant-name">${q.name}</span>
              <span class="quadrant-count" id="qCount_${q.id}">0</span>
            </div>
            <div class="quadrant-desc text-xs text-muted">${q.desc}</div>
            <div class="quadrant-drop-zone" data-quadrant="${q.id}" id="qZone_${q.id}">
            </div>
          </div>
        `).join('')}
      </div>
    `;

    renderTasks();
    bindEvents();
  }

  function renderTasks() {
    const date = Store.getCurrentDate();
    const tasks = Store.getChecklistTasks(date);

    let total = tasks.length;
    let completed = Store.getArchivedTasks(date).length;

    document.getElementById('checklistSummary').textContent = `今日 ${total} 项待办，已完成 ${completed} 项`;

    QUADRANTS.forEach(q => {
      const zone = document.getElementById('qZone_' + q.id);
      const qTasks = tasks.filter(t => t.quadrant === q.id);

      document.getElementById('qCount_' + q.id).textContent = qTasks.length;

      if (qTasks.length === 0) {
        zone.innerHTML = '<div class="quadrant-empty text-xs text-muted">拖拽任务到此象限</div>';
      } else {
        zone.innerHTML = qTasks.map(t => {
          const recurringLabel = t.recurring === 'daily' ? '每日' : (t.recurring === 'weekly' ? '每周' : '');
          return `
            <div class="task-card" draggable="true" data-id="${t.id}" data-quadrant="${t.quadrant}">
              <div class="flex-row">
                <div class="checkbox task-complete-btn" data-id="${t.id}"></div>
                <span class="task-text">${App.escapeHtml(t.text)}</span>
              </div>
              <div class="flex-between mt-8">
                <div>
                  ${recurringLabel ? `<span class="tag" style="font-size:10px;cursor:default;">🔁 ${recurringLabel}</span>` : ''}
                </div>
                <div class="flex-row">
                  <button class="btn-text edit-task-btn" data-id="${t.id}" style="font-size:12px;">编辑</button>
                  <button class="btn-text danger delete-task-btn" data-id="${t.id}" style="font-size:12px;">删除</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // 绑定拖放
      zone.addEventListener('dragover', function (e) {
        e.preventDefault();
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function () {
        zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (draggedTaskId) {
          const newQuadrant = parseInt(this.dataset.quadrant);
          Store.updateChecklistTask(draggedTaskId, { quadrant: newQuadrant });
          App.toast('已移动到「' + QUADRANTS[newQuadrant].name + '」', 'success');
          draggedTaskId = null;
          renderTasks();
        }
      });
    });

    // 绑定拖拽
    document.querySelectorAll('.task-card').forEach(card => {
      card.addEventListener('dragstart', function (e) {
        draggedTaskId = this.dataset.id;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function () {
        this.classList.remove('dragging');
      });
    });

    // 绑定完成
    document.querySelectorAll('.task-complete-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        Store.updateChecklistTask(this.dataset.id, { completed: true });
        App.toast('任务已完成，已归档', 'success');
        renderTasks();
      });
    });

    // 绑定编辑
    document.querySelectorAll('.edit-task-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        showEditTaskModal(this.dataset.id);
      });
    });

    // 绑定删除
    document.querySelectorAll('.delete-task-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('确定删除该任务？')) {
          Store.deleteChecklistTask(this.dataset.id);
          App.toast('已删除', 'success');
          renderTasks();
        }
      });
    });
  }

  function showEditTaskModal(id) {
    const tasks = Store.getChecklistTasks(Store.getCurrentDate());
    const task = id ? tasks.find(t => t.id === id) : null;

    App.modal(task ? '编辑任务' : '新增任务', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">任务内容</label>
        <input type="text" class="input" id="taskText" value="${task ? App.escapeHtml(task.text) : ''}" placeholder="输入任务内容">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">所属象限</label>
        <select class="select" id="taskQuadrant">
          ${QUADRANTS.map(q => `<option value="${q.id}" ${task && task.quadrant === q.id ? 'selected' : ''}>${q.icon} ${q.name}</option>`).join('')}
        </select>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">循环设置</label>
        <select class="select" id="taskRecurring">
          <option value="none" ${task && task.recurring === 'none' ? 'selected' : ''}>不循环</option>
          <option value="daily" ${task && task.recurring === 'daily' ? 'selected' : ''}>每日重复</option>
          <option value="weekly" ${task && task.recurring === 'weekly' ? 'selected' : ''}>每周重复</option>
        </select>
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const text = body.querySelector('#taskText').value.trim();
          if (!text) {
            App.toast('请输入任务内容', 'warning');
            return false;
          }
          const data = {
            text: text,
            quadrant: parseInt(body.querySelector('#taskQuadrant').value),
            recurring: body.querySelector('#taskRecurring').value
          };
          if (task) {
            Store.updateChecklistTask(id, data);
          } else {
            Store.addChecklistTask(data);
          }
          App.toast('已保存', 'success');
          renderTasks();
        }
      }
    ]);
  }

  function showArchivedModal() {
    const date = Store.getCurrentDate();
    const archived = Store.getArchivedTasks(date);

    App.modal(`已完成任务 · ${App.formatDate(date)}`, `
      ${archived.length === 0
        ? '<div class="empty-state"><div class="empty-state-icon">✓</div>今日暂无已完成任务</div>'
        : archived.map(t => `
            <div class="list-item">
              <div class="checkbox checked" style="cursor:default;"></div>
              <span style="flex:1;text-decoration:line-through;color:var(--ink-light);">${App.escapeHtml(t.text)}</span>
              <span class="text-xs text-muted">${QUADRANTS[t.quadrant].name}</span>
            </div>
          `).join('')
      }
    `, [{ label: '关闭' }]);
  }

  function bindEvents() {
    document.getElementById('addChecklistTaskBtn').addEventListener('click', function () {
      showEditTaskModal(null);
    });

    document.getElementById('showArchivedBtn').addEventListener('click', showArchivedModal);
  }

  return { render };
})();


/* ===== accounting.js ===== */
/* ============================================
 * accounting.js - 每日记账模块
 * 账户管理 · 收支录入 · 数据汇总 · 占比统计
 * ============================================ */

const Accounting = (function () {

  let currentSummaryView = 'day'; // 'day' | 'month' | 'year'

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>💰 每日记账</h2>
        <div class="module-subtitle">账户管理 · 收支录入 · 数据汇总 · ${App.formatDate(date)}</div>
      </div>

      <!-- 板块1：账户管理 -->
      <div class="section-block">
        <div class="section-title">
          <span class="section-title-icon">🏦</span>
          账户管理
          <button class="btn btn-sm" id="addAccountBtn" style="margin-left:auto;">+ 新增账户</button>
        </div>
        <div id="accountsList" class="grid-3"></div>
      </div>

      <!-- 板块2：收支录入 -->
      <div class="section-block">
        <div class="section-title">
          <span class="section-title-icon">✍️</span>
          收支录入
          <button class="btn btn-sm btn-primary" id="addTransactionBtn" style="margin-left:auto;">+ 记一笔</button>
        </div>
        <div id="todayTransactions"></div>
      </div>

      <!-- 板块3：数据汇总 -->
      <div class="section-block">
        <div class="section-title">
          <span class="section-title-icon">📊</span>
          数据汇总
          <div style="margin-left:auto;display:flex;gap:6px;">
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'day' ? 'btn-primary' : ''}" data-view="day">日汇总</button>
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'month' ? 'btn-primary' : ''}" data-view="month">月汇总</button>
            <button class="btn btn-sm summary-view-btn ${currentSummaryView === 'year' ? 'btn-primary' : ''}" data-view="year">年汇总</button>
          </div>
        </div>
        <div id="summaryView"></div>
      </div>

      <!-- 板块4：支出占比统计 -->
      <div class="section-block">
        <div class="section-title">
          <span class="section-title-icon">🥧</span>
          支出分类占比
        </div>
        <div id="categoryStats"></div>
      </div>
    `;

    renderAccounts();
    renderTodayTransactions();
    renderSummary();
    renderCategoryStats();
    bindEvents();
  }

  // ============ 账户管理 ============
  function renderAccounts() {
    const container = document.getElementById('accountsList');
    const accounts = Store.getAccounts();

    if (accounts.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏦</div>暂无账户</div>';
      return;
    }

    container.innerHTML = accounts.map(a => `
      <div class="account-card stat-card">
        <div class="flex-between mb-8">
          <span class="fw-600">${App.escapeHtml(a.name)}</span>
          <div>
            <button class="btn-text edit-account-btn" data-id="${a.id}" style="font-size:12px;">编辑</button>
            <button class="btn-text danger delete-account-btn" data-id="${a.id}" style="font-size:12px;">删除</button>
          </div>
        </div>
        <div class="stat-card-value">${App.formatMoney(a.balance)}</div>
        <div class="stat-card-label">当前余额</div>
      </div>
    `).join('');

    container.querySelectorAll('.edit-account-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        showEditAccountModal(this.dataset.id);
      });
    });

    container.querySelectorAll('.delete-account-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('删除账户将影响关联的账单记录，确定？')) {
          Store.deleteAccount(this.dataset.id);
          renderAccounts();
          renderTodayTransactions();
          App.toast('已删除', 'success');
        }
      });
    });
  }

  function showEditAccountModal(id) {
    const account = id ? Store.getAccounts().find(a => a.id === id) : null;
    App.modal(account ? '编辑账户' : '新增账户', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">账户名称</label>
        <input type="text" class="input" id="accountName" value="${account ? App.escapeHtml(account.name) : ''}" placeholder="如：银行卡">
      </div>
      ${account ? `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">余额调整</label>
        <input type="number" class="input" id="accountBalance" value="${account.balance}" step="0.01">
      </div>
      ` : ''}
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const name = body.querySelector('#accountName').value.trim();
          if (!name) {
            App.toast('请输入账户名称', 'warning');
            return false;
          }
          if (account) {
            Store.updateAccount(id, {
              name: name,
              balance: parseFloat(body.querySelector('#accountBalance').value) || 0
            });
          } else {
            Store.addAccount(name);
          }
          renderAccounts();
          App.toast('已保存', 'success');
        }
      }
    ]);
  }

  // ============ 收支录入 ============
  function renderTodayTransactions() {
    const container = document.getElementById('todayTransactions');
    const date = Store.getCurrentDate();
    const txs = Store.getTransactions(date);

    if (txs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div>今日暂无账单记录</div>';
      return;
    }

    const sorted = [...txs].sort((a, b) => b.createdAt - a.createdAt);
    container.innerHTML = sorted.map(t => {
      const account = Store.getAccounts().find(a => a.id === t.accountId);
      const isExpense = t.type === 'expense';
      return `
        <div class="list-item">
          <span style="font-size:20px;">${isExpense ? '💸' : '💵'}</span>
          <div class="flex-1">
            <div class="fw-600">${App.escapeHtml(t.category)}${t.subCategory ? ' · ' + App.escapeHtml(t.subCategory) : ''}</div>
            <div class="text-sm text-muted">
              ${account ? App.escapeHtml(account.name) : '未知账户'}
              ${t.note ? ' · ' + App.escapeHtml(t.note) : ''}
            </div>
          </div>
          <span class="fw-600" style="color:${isExpense ? 'var(--danger)' : 'var(--celadon-dark)'};">
            ${isExpense ? '-' : '+'}${App.formatMoney(t.amount)}
          </span>
          <button class="btn-text danger delete-tx-btn" data-id="${t.id}">删除</button>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.delete-tx-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('确定删除该账单？')) {
          Store.deleteTransaction(this.dataset.id);
          renderTodayTransactions();
          renderAccounts();
          renderSummary();
          renderCategoryStats();
          App.toast('已删除', 'success');
        }
      });
    });
  }

  function showAddTransactionModal() {
    const accounts = Store.getAccounts();
    if (accounts.length === 0) {
      App.toast('请先创建一个账户', 'warning');
      return;
    }

    const expenseCats = Store.getExpenseCategories();
    const incomeCats = Store.getIncomeCategories();

    App.modal('记一笔', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">类型</label>
        <div class="flex-row">
          <button class="btn tx-type-btn active" data-type="expense" id="txTypeExpense">💸 支出</button>
          <button class="btn tx-type-btn" data-type="income" id="txTypeIncome">💵 收入</button>
        </div>
        <input type="hidden" id="txType" value="expense">
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">账户</label>
          <select class="select" id="txAccount">
            ${accounts.map(a => `<option value="${a.id}">${App.escapeHtml(a.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">日期</label>
          <input type="date" class="input" id="txDate" value="${Store.getCurrentDate()}">
        </div>
      </div>
      <div class="grid-2 mb-12">
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">一级分类</label>
          <select class="select" id="txCategory"></select>
        </div>
        <div>
          <label class="text-sm text-muted mb-8" style="display:block;">二级分类</label>
          <div class="flex-row">
            <select class="select" id="txSubCategory" style="flex:1;"></select>
            <button class="btn btn-sm" id="addSubCatBtn" title="新增子分类">+</button>
          </div>
        </div>
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">金额</label>
        <input type="number" class="input" id="txAmount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">备注</label>
        <input type="text" class="input" id="txNote" placeholder="可选备注">
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const amount = parseFloat(body.querySelector('#txAmount').value);
          if (!amount || amount <= 0) {
            App.toast('请输入有效金额', 'warning');
            return false;
          }
          const type = body.querySelector('#txType').value;
          const categorySelect = body.querySelector('#txCategory');
          const subCategorySelect = body.querySelector('#txSubCategory');
          Store.addTransaction({
            date: body.querySelector('#txDate').value,
            accountId: body.querySelector('#txAccount').value,
            type: type,
            category: categorySelect.value,
            subCategory: subCategorySelect.value,
            amount: amount,
            note: body.querySelector('#txNote').value
          });
          App.toast('记账成功！', 'success');
          // 刷新
          renderAccounts();
          renderTodayTransactions();
          renderSummary();
          renderCategoryStats();
        }
      }
    ]);

    // 类型切换
    function updateCategories() {
      const type = document.getElementById('txType').value;
      const cats = type === 'expense' ? expenseCats : incomeCats;
      const catSelect = document.getElementById('txCategory');
      catSelect.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      updateSubCategories();
    }

    function updateSubCategories() {
      const type = document.getElementById('txType').value;
      const catName = document.getElementById('txCategory').value;
      const cats = type === 'expense' ? expenseCats : incomeCats;
      const cat = cats.find(c => c.name === catName);
      const subs = cat ? cat.subCategories : [];
      const subSelect = document.getElementById('txSubCategory');
      subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
      if (subs.length === 0) {
        subSelect.innerHTML = '<option value="">无子分类</option>';
      }
    }

    document.getElementById('txTypeExpense').addEventListener('click', function () {
      document.getElementById('txType').value = 'expense';
      document.querySelectorAll('.tx-type-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
      this.classList.add('active', 'btn-primary');
      updateCategories();
    });

    document.getElementById('txTypeIncome').addEventListener('click', function () {
      document.getElementById('txType').value = 'income';
      document.querySelectorAll('.tx-type-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
      this.classList.add('active', 'btn-primary');
      updateCategories();
    });

    document.getElementById('txCategory').addEventListener('change', updateSubCategories);

    document.getElementById('addSubCatBtn').addEventListener('click', function () {
      const type = document.getElementById('txType').value;
      const catName = document.getElementById('txCategory').value;
      const newSub = prompt('请输入新的子分类名称：');
      if (newSub && newSub.trim()) {
        if (type === 'expense') {
          const cat = expenseCats.find(c => c.name === catName);
          if (cat) Store.addExpenseSubCategory(cat.id, newSub.trim());
        }
        updateSubCategories();
        document.getElementById('txSubCategory').value = newSub.trim();
      }
    });

    // 初始化
    document.getElementById('txTypeExpense').classList.add('btn-primary');
    updateCategories();
  }

  // ============ 数据汇总 ============
  function renderSummary() {
    const container = document.getElementById('summaryView');
    const date = Store.getCurrentDate();
    let txs = [];

    let label = '';
    if (currentSummaryView === 'day') {
      txs = Store.getTransactions(date);
      label = App.formatDate(date);
    } else if (currentSummaryView === 'month') {
      const monthStr = date.slice(0, 7);
      txs = Store.getTransactionsByMonth(monthStr);
      const d = new Date(date);
      label = `${d.getFullYear()}年${d.getMonth() + 1}月`;
    } else {
      const yearStr = date.slice(0, 4);
      txs = Store.getTransactionsByYear(yearStr);
      label = `${yearStr}年`;
    }

    const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance = income - expense;

    container.innerHTML = `
      <div class="grid-3 mb-16">
        <div class="stat-card">
          <div class="stat-card-value" style="color:var(--celadon-dark);">+${App.formatMoney(income)}</div>
          <div class="stat-card-label">${label}总收入</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" style="color:var(--danger);">-${App.formatMoney(expense)}</div>
          <div class="stat-card-label">${label}总支出</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" style="color:${balance >= 0 ? 'var(--celadon-dark)' : 'var(--danger)'};">${balance >= 0 ? '+' : ''}${App.formatMoney(balance)}</div>
          <div class="stat-card-label">${label}结余</div>
        </div>
      </div>
      ${txs.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📊</div>该时段暂无账单记录</div>' : `
        <div class="text-sm text-muted mb-8">账单明细（共${txs.length}条）</div>
        <div style="max-height:300px;overflow-y:auto;">
          ${[...txs].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt).map(t => {
            const account = Store.getAccounts().find(a => a.id === t.accountId);
            return `
              <div class="list-item">
                <span style="font-size:18px;">${t.type === 'expense' ? '💸' : '💵'}</span>
                <div class="flex-1">
                  <div class="text-sm fw-600">${App.escapeHtml(t.category)}${t.subCategory ? ' · ' + App.escapeHtml(t.subCategory) : ''}</div>
                  <div class="text-xs text-muted">${t.date} · ${account ? App.escapeHtml(account.name) : ''}${t.note ? ' · ' + App.escapeHtml(t.note) : ''}</div>
                </div>
                <span class="fw-600 text-sm" style="color:${t.type === 'expense' ? 'var(--danger)' : 'var(--celadon-dark)'};">
                  ${t.type === 'expense' ? '-' : '+'}${App.formatMoney(t.amount)}
                </span>
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
  }

  // ============ 支出占比统计 ============
  function renderCategoryStats() {
    const container = document.getElementById('categoryStats');
    const date = Store.getCurrentDate();
    const monthStr = date.slice(0, 7);
    const txs = Store.getTransactionsByMonth(monthStr).filter(t => t.type === 'expense');

    if (txs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🥧</div>本月暂无支出数据</div>';
      return;
    }

    // 按一级分类统计
    const catTotals = {};
    txs.forEach(t => {
      catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
    });

    const total = Object.values(catTotals).reduce((s, v) => s + v, 0);
    const sorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

    // 颜色映射
    const colors = ['var(--celadon)', 'var(--bean-green)', 'var(--jade-blue)', 'var(--info)', 'var(--warning)', 'var(--danger)'];

    let html = `<div class="text-sm text-muted mb-8">本月支出分类占比（总支出 ${App.formatMoney(total)}）</div>`;

    // 简易条形图
    html += '<div class="freq-chart mb-16">';
    sorted.forEach(([cat, amount], i) => {
      const percent = (amount / total * 100).toFixed(1);
      const width = percent;
      html += `
        <div class="freq-bar-row">
          <span class="freq-bar-label">${App.escapeHtml(cat)}</span>
          <div class="freq-bar-track">
            <div class="freq-bar-fill" style="width:${width}%;background:${colors[i % colors.length]};"></div>
          </div>
          <span class="freq-bar-count">${App.formatMoney(amount)} (${percent}%)</span>
        </div>
      `;
    });
    html += '</div>';

    // 简易饼图（用CSS conic-gradient）
    let gradientParts = [];
    let cumulative = 0;
    sorted.forEach(([cat, amount], i) => {
      const percent = amount / total * 100;
      const color = colors[i % colors.length];
      gradientParts.push(`${color} ${cumulative}% ${cumulative + percent}%`);
      cumulative += percent;
    });

    html += `
      <div class="flex-row" style="justify-content:center;gap:30px;flex-wrap:wrap;">
        <div class="pie-chart" style="background: conic-gradient(${gradientParts.join(', ')});">
          <div class="pie-chart-center">
            <div class="stat-card-value" style="font-size:16px;">${App.formatMoney(total)}</div>
            <div class="stat-card-label">总支出</div>
          </div>
        </div>
        <div class="pie-legend">
          ${sorted.map(([cat, amount], i) => `
            <div class="flex-row mb-8">
              <span class="pie-legend-color" style="background:${colors[i % colors.length]};"></span>
              <span class="text-sm">${App.escapeHtml(cat)}</span>
              <span class="text-sm text-muted">${App.formatMoney(amount)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    container.innerHTML = html;
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    document.getElementById('addAccountBtn').addEventListener('click', function () {
      showEditAccountModal(null);
    });

    document.getElementById('addTransactionBtn').addEventListener('click', function () {
      showAddTransactionModal();
    });

    document.querySelectorAll('.summary-view-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        currentSummaryView = this.dataset.view;
        document.querySelectorAll('.summary-view-btn').forEach(b => b.classList.remove('btn-primary'));
        this.classList.add('btn-primary');
        renderSummary();
      });
    });
  }

  return { render };
})();


/* ===== records.js ===== */
/* ============================================
 * records.js - 日常记录模块
 * 随笔 · 心情 · 图片 · 习惯打卡 · 自定义板块
 * ============================================ */

const Records = (function () {

  const MOOD_OPTIONS = ['开心', '平淡', '疲惫', '焦虑', '兴奋', '低落', '感恩', '愤怒'];

  function render(container) {
    const date = Store.getCurrentDate();
    container.innerHTML = `
      <div class="module-header">
        <h2>✏️ 日常记录</h2>
        <div class="module-subtitle">随笔 · 心情 · 图片 · 习惯打卡 · ${App.formatDate(date)}</div>
      </div>

      <div class="flex-between mb-16">
        <div class="flex-row">
          <button class="btn btn-primary" id="addRecordEntryBtn">+ 新增记录</button>
          <button class="btn" id="addRecordBoardBtn">+ 新增板块</button>
        </div>
      </div>

      <div id="recordsBoardsContainer"></div>
    `;

    renderBoards();
    bindEvents();
  }

  function renderBoards() {
    const container = document.getElementById('recordsBoardsContainer');
    const boards = Store.getRecordBoards();
    const date = Store.getCurrentDate();

    if (boards.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✏️</div>暂无板块，点击上方按钮创建</div>';
      return;
    }

    let html = '';
    boards.forEach(board => {
      const entries = Store.getRecordEntries(board.id, date);

      html += `
        <div class="section-block" data-board-id="${board.id}">
          <div class="section-title">
            <span class="section-title-icon">${getBoardIcon(board.type)}</span>
            ${App.escapeHtml(board.name)}
            <span class="text-xs text-muted" style="margin-left:4px;">(${getBoardTypeLabel(board.type)})</span>
            <div style="margin-left:auto;display:flex;gap:4px;">
              <button class="btn-text edit-board-btn" data-id="${board.id}" style="font-size:12px;">重命名</button>
              <button class="btn-text danger delete-board-btn" data-id="${board.id}" style="font-size:12px;">删除</button>
            </div>
          </div>
          <div id="boardEntries_${board.id}">
            ${renderBoardEntries(board, entries)}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    // 绑定事件
    container.querySelectorAll('.edit-board-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        showEditBoardModal(this.dataset.id);
      });
    });

    container.querySelectorAll('.delete-board-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('删除板块将同时删除该板块下所有记录，确定？')) {
          Store.deleteRecordBoard(this.dataset.id);
          renderBoards();
          App.toast('已删除板块', 'success');
        }
      });
    });

    container.querySelectorAll('.delete-entry-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (confirm('确定删除该记录？')) {
          Store.deleteRecordEntry(this.dataset.id);
          renderBoards();
          App.toast('已删除', 'success');
        }
      });
    });

    // 习惯打卡
    container.querySelectorAll('.habit-check-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        handleHabitCheck(this.dataset.id);
      });
    });

    // 图片预览
    container.querySelectorAll('.record-image').forEach(img => {
      img.addEventListener('click', function () {
        showImagePreview(this.src);
      });
    });
  }

  function renderBoardEntries(board, entries) {
    if (entries.length === 0) {
      return '<div class="empty-state"><div class="empty-state-icon">' + getBoardIcon(board.type) + '</div>今日暂无记录</div>';
    }

    const sorted = [...entries].sort((a, b) => b.createdAt - a.createdAt);

    return sorted.map(e => {
      let html = '<div class="list-item record-entry" style="flex-direction:column;align-items:stretch;">';
      html += '<div class="flex-between">';

      // 根据类型显示不同内容
      if (board.type === 'mood') {
        html += `<div class="flex-row"><span class="mood-tag-display">${getMoodIcon(e.mood)} ${App.escapeHtml(e.mood || '')}</span></div>`;
      } else if (board.type === 'habit') {
        const isCheckedToday = e.lastCheckDate === Store.getCurrentDate();
        html += `<div class="flex-row">
          <button class="btn ${isCheckedToday ? 'btn-primary' : ''} habit-check-btn" data-id="${e.id}">
            ${isCheckedToday ? '✓ 今日已打卡' : '打卡'}
          </button>
          <span class="fw-600">${App.escapeHtml(e.content)}</span>
          <span class="tag" style="cursor:default;">🔥 连续 ${e.habitStreak || 0} 天</span>
          <span class="text-xs text-muted">${e.habitPeriod === 'daily' ? '每日' : '每周'}</span>
        </div>`;
      } else {
        html += `<span>${App.escapeHtml(e.content).replace(/\n/g, '<br>')}</span>`;
      }

      html += `<div class="flex-row">
        <span class="text-xs text-muted">${e.date}</span>
        <button class="btn-text danger delete-entry-btn" data-id="${e.id}">删除</button>
      </div>`;
      html += '</div>';

      // 图片展示
      if (board.type === 'image' && e.images && e.images.length > 0) {
        html += '<div class="record-images mt-8">';
        e.images.forEach(src => {
          html += `<img src="${src}" class="record-image" alt="记录图片">`;
        });
        html += '</div>';
        if (e.content) {
          html += `<div class="text-sm text-muted mt-8">${App.escapeHtml(e.content).replace(/\n/g, '<br>')}</div>`;
        }
      }

      html += '</div>';
      return html;
    }).join('');
  }

  function handleHabitCheck(entryId) {
    const allEntries = Store.getRecordEntries();
    const habit = allEntries.find(e => e.id === entryId);
    if (!habit) return;

    const today = Store.getCurrentDate();
    if (habit.lastCheckDate === today) {
      App.toast('今日已打卡', 'warning');
      return;
    }

    // 计算连续天数
    let newStreak = 1;
    if (habit.lastCheckDate) {
      const lastDate = new Date(habit.lastCheckDate);
      const todayDate = new Date(today);
      const diffDays = Math.round((todayDate - lastDate) / (1000 * 60 * 60 * 24));
      if (habit.habitPeriod === 'daily' && diffDays === 1) {
        newStreak = (habit.habitStreak || 0) + 1;
      } else if (habit.habitPeriod === 'weekly' && diffDays <= 7) {
        newStreak = (habit.habitStreak || 0) + 1;
      } else {
        newStreak = 1; // 断了，重新开始
      }
    }

    Store.updateRecordEntry(entryId, {
      lastCheckDate: today,
      habitStreak: newStreak
    });
    App.toast(`打卡成功！连续 ${newStreak} 天 🔥`, 'success');
    renderBoards();
  }

  function showAddEntryModal() {
    const boards = Store.getRecordBoards();
    if (boards.length === 0) {
      App.toast('请先创建一个板块', 'warning');
      return;
    }

    App.modal('新增记录', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">选择板块</label>
        <select class="select" id="entryBoard">
          ${boards.map(b => `<option value="${b.id}" data-type="${b.type}">${getBoardIcon(b.type)} ${App.escapeHtml(b.name)} (${getBoardTypeLabel(b.type)})</option>`).join('')}
        </select>
      </div>
      <div id="entryDynamicFields"></div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const boardId = body.querySelector('#entryBoard').value;
          const board = boards.find(b => b.id === boardId);
          if (!board) return false;

          const data = { boardId: boardId };

          if (board.type === 'mood') {
            data.mood = body.querySelector('#entryMood') ? body.querySelector('#entryMood .mood-tag.selected')?.dataset.mood : '';
            if (!data.mood) {
              App.toast('请选择心情', 'warning');
              return false;
            }
            data.content = body.querySelector('#entryContent') ? body.querySelector('#entryContent').value : '';
          } else if (board.type === 'habit') {
            data.content = body.querySelector('#habitName').value.trim();
            if (!data.content) {
              App.toast('请输入习惯名称', 'warning');
              return false;
            }
            data.habitPeriod = body.querySelector('#habitPeriod').value;
            data.habitStreak = 0;
          } else if (board.type === 'image') {
            data.content = body.querySelector('#entryContent') ? body.querySelector('#entryContent').value : '';
            const fileInput = body.querySelector('#entryImages');
            if (fileInput.files.length > 0) {
              // 读取图片为base64
              const promises = Array.from(fileInput.files).slice(0, 5).map(file => {
                return new Promise(resolve => {
                  const reader = new FileReader();
                  reader.onload = e => resolve(e.target.result);
                  reader.readAsDataURL(file);
                });
              });
              Promise.all(promises).then(images => {
                data.images = images;
                Store.addRecordEntry(data);
                App.toast('记录已保存', 'success');
                renderBoards();
                App.closeModal();
              });
              return false; // 阻止关闭，由promise处理
            }
            data.images = [];
          } else {
            data.content = body.querySelector('#entryContent').value;
            if (!data.content.trim()) {
              App.toast('请输入内容', 'warning');
              return false;
            }
          }

          Store.addRecordEntry(data);
          App.toast('记录已保存', 'success');
          renderBoards();
        }
      }
    ]);

    // 动态渲染字段
    function updateFields() {
      const select = document.getElementById('entryBoard');
      const selectedOption = select.options[select.selectedIndex];
      const type = selectedOption.dataset.type;
      const fieldsContainer = document.getElementById('entryDynamicFields');

      let html = '';
      if (type === 'mood') {
        html = `
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">选择心情</label>
            <div class="flex-row flex-wrap" id="entryMood">
              ${MOOD_OPTIONS.map(m => `<span class="tag mood-tag" data-mood="${m}">${getMoodIcon(m)} ${m}</span>`).join('')}
            </div>
          </div>
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">心情描述（可选）</label>
            <textarea class="textarea" id="entryContent" rows="3" placeholder记录此刻的心情…"></textarea>
          </div>
        `;
      } else if (type === 'habit') {
        html = `
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">习惯名称</label>
            <input type="text" class="input" id="habitName" placeholder="如：早起喝杯水">
          </div>
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">重复周期</label>
            <select class="select" id="habitPeriod">
              <option value="daily">每日</option>
              <option value="weekly">每周</option>
            </select>
          </div>
        `;
      } else if (type === 'image') {
        html = `
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">上传图片（最多5张）</label>
            <input type="file" class="input" id="entryImages" accept="image/*" multiple>
          </div>
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">图片描述（可选）</label>
            <textarea class="textarea" id="entryContent" rows="2" placeholder="为图片添加文字说明…"></textarea>
          </div>
        `;
      } else {
        html = `
          <div class="mb-12">
            <label class="text-sm text-muted mb-8" style="display:block;">内容</label>
            <textarea class="textarea" id="entryContent" rows="6" placeholder="写下你的想法…"></textarea>
          </div>
        `;
      }
      fieldsContainer.innerHTML = html;

      // 心情标签选择
      const moodContainer = document.getElementById('entryMood');
      if (moodContainer) {
        moodContainer.querySelectorAll('.mood-tag').forEach(tag => {
          tag.addEventListener('click', function () {
            moodContainer.querySelectorAll('.mood-tag').forEach(t => t.classList.remove('selected'));
            this.classList.add('selected');
          });
        });
      }
    }

    document.getElementById('entryBoard').addEventListener('change', updateFields);
    updateFields();
  }

  function showEditBoardModal(id) {
    const board = Store.getRecordBoards().find(b => b.id === id);
    if (!board) return;

    App.modal('重命名板块', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">板块名称</label>
        <input type="text" class="input" id="boardName" value="${App.escapeHtml(board.name)}">
      </div>
    `, [
      { label: '取消' },
      {
        label: '保存',
        primary: true,
        onClick: function (body) {
          const name = body.querySelector('#boardName').value.trim();
          if (!name) {
            App.toast('请输入名称', 'warning');
            return false;
          }
          Store.updateRecordBoard(id, { name: name });
          renderBoards();
          App.toast('已更新', 'success');
        }
      }
    ]);
  }

  function showAddBoardModal() {
    App.modal('新增板块', `
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">板块名称</label>
        <input type="text" class="input" id="newBoardName" placeholder="如：读书笔记">
      </div>
      <div class="mb-12">
        <label class="text-sm text-muted mb-8" style="display:block;">板块类型</label>
        <select class="select" id="newBoardType">
          <option value="note">📝 随笔（纯文字）</option>
          <option value="mood">😊 心情记录（带心情标签）</option>
          <option value="image">📷 图片记录（多图+文字）</option>
          <option value="habit">🔁 习惯打卡（周期+连续天数）</option>
        </select>
      </div>
    `, [
      { label: '取消' },
      {
        label: '创建',
        primary: true,
        onClick: function (body) {
          const name = body.querySelector('#newBoardName').value.trim();
          if (!name) {
            App.toast('请输入板块名称', 'warning');
            return false;
          }
          const type = body.querySelector('#newBoardType').value;
          Store.addRecordBoard(name, type);
          renderBoards();
          App.toast('板块已创建', 'success');
        }
      }
    ]);
  }

  function showImagePreview(src) {
    App.modal('图片预览', `<img src="${src}" style="width:100%;border-radius:10px;">`, [{ label: '关闭' }]);
  }

  function getBoardIcon(type) {
    const icons = { note: '📝', mood: '😊', image: '📷', habit: '🔁' };
    return icons[type] || '📝';
  }

  function getBoardTypeLabel(type) {
    const labels = { note: '随笔', mood: '心情', image: '图片', habit: '习惯' };
    return labels[type] || '随笔';
  }

  function getMoodIcon(mood) {
    const icons = {
      '开心': '😄', '平淡': '😐', '疲惫': '😵', '焦虑': '😰',
      '兴奋': '🤩', '低落': '😢', '感恩': '🙏', '愤怒': '😡'
    };
    return icons[mood] || '😐';
  }

  function bindEvents() {
    document.getElementById('addRecordEntryBtn').addEventListener('click', function () {
      showAddEntryModal();
    });

    document.getElementById('addRecordBoardBtn').addEventListener('click', function () {
      showAddBoardModal();
    });
  }

  return { render };
})();


/* ===== app.js ===== */
/* ============================================
 * app.js - 核心应用框架
 * 导航路由 · 日期切换 · 全局搜索 · 导出 · 初始化
 * ============================================ */

const App = (function () {

  let currentModule = 'dashboard';

  // 获取可见导航项
  function getNavItems() {
    return Store.getModules().filter(m => m.visible !== false);
  }

  // 初始化
  function init() {
    Store.init();

    // 应用主题
    applyTheme(Store.getTheme());

    // 设置日期
    document.getElementById('currentDate').value = Store.getCurrentDate();

    // 渲染导航
    renderNav();

    // 绑定事件
    bindEvents();

    // 更新计时仓库计数
    updateTimerRepoCount();

    // 加载默认模块（取第一个可见模块）
    const items = getNavItems();
    currentModule = items.length > 0 ? items[0].id : 'dashboard';
    loadModule(currentModule);
  }

  // 渲染导航
  function renderNav() {
    const navList = document.getElementById('navList');
    const items = getNavItems();
    navList.innerHTML = items.map(item => `
      <div class="nav-item ${item.id === currentModule ? 'active' : ''}" data-module="${item.id}">
        <span class="nav-item-icon">${item.icon}</span>
        <span class="nav-item-label">${item.name}</span>
      </div>
    `).join('');

    navList.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', function () {
        loadModule(this.dataset.module);
      });
    });

    // 侧边栏底部计时仓库点击
    const miniTimer = document.getElementById('globalTimerMini');
    miniTimer.addEventListener('click', function () {
      showTimerRepoModal();
    });
  }

  // 加载模块
  function loadModule(moduleId) {
    currentModule = moduleId;
    // 更新导航高亮
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.module === moduleId);
    });

    // 移动端选择后自动收起抽屉
    closeSidebar();

    const contentArea = document.getElementById('contentArea');
    contentArea.innerHTML = '';
    contentArea.scrollTop = 0;

    switch (moduleId) {
      case 'dashboard':
        Dashboard.render(contentArea);
        break;
      case 'exercise':
        Exercise.render(contentArea);
        break;
      case 'study':
        Study.render(contentArea);
        break;
      case 'checklist':
        Checklist.render(contentArea);
        break;
      case 'accounting':
        Accounting.render(contentArea);
        break;
      case 'records':
        Records.render(contentArea);
        break;
      default:
        // 自定义模块
        if (moduleId.indexOf('custom_') === 0) {
          renderCustomPage(contentArea, moduleId);
        }
    }
  }

  // 渲染自定义页面（按日期的笔记/记录）
  function renderCustomPage(container, pageId) {
    const mod = Store.getModules().find(m => m.id === pageId);
    const pageName = mod ? mod.name : '自定义页面';
    const pageIcon = mod ? mod.icon : '📝';
    const date = Store.getCurrentDate();
    const entries = Store.getCustomPageEntriesByDate(pageId, date);

    container.innerHTML = `
      <div class="module-header">
        <h2>${pageIcon} ${pageName}</h2>
        <p class="module-subtitle">${date} 的记录</p>
      </div>
      <div class="card">
        <textarea class="custom-page-input" id="customPageInput" placeholder="在这里写下内容，点击添加保存到 ${date}…" rows="4" style="width:100%;border:1px solid var(--divider);border-radius:var(--radius-md);padding:12px;font-size:14px;font-family:inherit;background:var(--celadon-paler);color:var(--ink);resize:vertical;"></textarea>
        <div style="margin-top:10px;text-align:right;">
          <button class="btn-primary" id="customPageAdd" style="padding:8px 20px;border:none;border-radius:var(--radius-md);background:var(--celadon);color:#fff;font-size:14px;cursor:pointer;">添加记录</button>
        </div>
      </div>
      <div id="customPageList">
        ${entries.length === 0 ? '<div class="card text-muted text-center" style="padding:30px;">今天还没有记录，写点什么吧</div>' : entries.map(e => `
          <div class="card custom-entry" data-id="${e.id}">
            <div class="flex-row" style="justify-content:space-between;align-items:flex-start;">
              <div class="flex-1" style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:var(--ink);">${escapeHtml(e.content)}</div>
              <button class="custom-entry-del" data-id="${e.id}" style="border:none;background:transparent;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 8px;">✕</button>
            </div>
            <div class="text-sm text-muted" style="margin-top:8px;">${new Date(e.createdAt).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        `).join('')}
      </div>
    `;

    // 添加记录
    const input = container.querySelector('#customPageInput');
    container.querySelector('#customPageAdd').addEventListener('click', function () {
      const val = input.value.trim();
      if (!val) { toast('请输入内容', 'error'); return; }
      Store.addCustomPageEntry(pageId, val);
      toast('记录已添加', 'success');
      renderCustomPage(container, pageId);
    });

    // 删除记录
    container.querySelectorAll('.custom-entry-del').forEach(btn => {
      btn.addEventListener('click', function () {
        Store.deleteCustomPageEntry(pageId, this.dataset.id);
        renderCustomPage(container, pageId);
      });
    });
  }

  // 移动端侧边栏抽屉控制
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('open')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  }

  // 绑定全局事件
  function bindEvents() {
    // 移动端目录抽屉
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    // 日期切换
    const dateInput = document.getElementById('currentDate');
    dateInput.addEventListener('change', function () {
      Store.setCurrentDate(this.value);
      loadModule(currentModule);
    });

    document.getElementById('prevDate').addEventListener('click', function () {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() - 1);
      dateInput.value = d.toISOString().slice(0, 10);
      Store.setCurrentDate(dateInput.value);
      loadModule(currentModule);
    });

    document.getElementById('nextDate').addEventListener('click', function () {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() + 1);
      dateInput.value = d.toISOString().slice(0, 10);
      Store.setCurrentDate(dateInput.value);
      loadModule(currentModule);
    });

    document.getElementById('todayBtn').addEventListener('click', function () {
      const today = new Date().toISOString().slice(0, 10);
      dateInput.value = today;
      Store.setCurrentDate(today);
      loadModule(currentModule);
    });

    // 全局搜索
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    const searchToggle = document.getElementById('searchToggle');
    let searchTimer = null;

    // 移动端搜索展开/收起
    if (searchToggle) {
      searchToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        const box = document.querySelector('.search-box');
        box.classList.toggle('expanded');
        if (box.classList.contains('expanded')) {
          searchInput.focus();
        } else {
          searchInput.value = '';
          searchResults.classList.remove('active');
        }
      });
    }

    searchInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      const kw = this.value.trim();
      if (!kw) {
        searchResults.classList.remove('active');
        return;
      }
      searchTimer = setTimeout(function () {
        const results = Store.search(kw);
        renderSearchResults(results);
      }, 200);
    });

    searchInput.addEventListener('focus', function () {
      if (this.value.trim()) {
        searchResults.classList.add('active');
      }
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search-box')) {
        searchResults.classList.remove('active');
        const box = document.querySelector('.search-box');
        if (box) box.classList.remove('expanded');
      }
    });

    // 导出
    document.getElementById('exportBtn').addEventListener('click', function () {
      showExportModal();
    });

    // 主题切换
    document.getElementById('themeToggle').addEventListener('click', function () {
      const current = Store.getTheme();
      const next = current === 'light' ? 'dark' : 'light';
      Store.setTheme(next);
      applyTheme(next);
      toast(next === 'dark' ? '已切换至暗色护眼模式' : '已切换至亮色模式', 'success');
    });

    // 管理目录
    const manageBtn = document.getElementById('manageModulesBtn');
    if (manageBtn) {
      manageBtn.addEventListener('click', showManageModulesModal);
    }
  }

  // 管理目录弹窗
  function showManageModulesModal() {
    const modules = Store.getModules();
    const iconOptions = ['📝','📋','📌','🎯','💡','🔥','⭐','🏷️','📂','🔔','🎨','🎵','🎮','☕','🌱','📅','📊','🛒','💊','🏠'];

    const html = `
      <div class="modal-overlay" id="manageModal">
        <div class="modal">
          <div class="modal-title">⚙ 管理目录</div>
          <p class="text-muted text-sm mb-16">勾选显示/隐藏，点击名称可重命名，自定义模块可删除</p>
          <div id="moduleManageList" style="max-height:50vh;overflow-y:auto;margin-bottom:16px;">
            ${modules.map(m => `
              <div class="module-manage-item" data-id="${m.id}" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-md);background:var(--celadon-paler);margin-bottom:8px;">
                <input type="checkbox" class="module-visible-cb" data-id="${m.id}" ${m.visible !== false ? 'checked' : ''} style="width:20px;height:20px;flex-shrink:0;">
                <span class="module-icon-display" data-id="${m.id}" style="font-size:22px;cursor:pointer;flex-shrink:0;">${m.icon}</span>
                <input type="text" class="module-name-input" data-id="${m.id}" value="${escapeHtml(m.name)}" style="flex:1;border:1px solid var(--divider);border-radius:var(--radius-sm);padding:6px 10px;font-size:14px;background:var(--bg-card);color:var(--ink);font-family:inherit;min-width:0;">
                ${m.builtin ? '<span class="text-sm text-muted" style="flex-shrink:0;">内置</span>' : '<button class="module-del-btn" data-id="' + m.id + '" style="border:none;background:transparent;color:#e74c3c;font-size:18px;cursor:pointer;flex-shrink:0;padding:4px 8px;">🗑</button>'}
              </div>
            `).join('')}
          </div>

          <div style="border-top:1px solid var(--divider);padding-top:16px;margin-bottom:16px;">
            <div class="fw-600 mb-8" style="margin-bottom:10px;">➕ 添加自定义模块</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <input type="text" id="newModuleName" placeholder="模块名称" style="flex:1;border:1px solid var(--divider);border-radius:var(--radius-md);padding:8px 12px;font-size:14px;background:var(--celadon-paler);color:var(--ink);font-family:inherit;min-width:120px;">
              <select id="newModuleIcon" style="border:1px solid var(--divider);border-radius:var(--radius-md);padding:8px;font-size:18px;background:var(--celadon-paler);color:var(--ink);">
                ${iconOptions.map(ic => `<option value="${ic}">${ic}</option>`).join('')}
              </select>
              <button id="addModuleBtn" style="padding:8px 16px;border:none;border-radius:var(--radius-md);background:var(--celadon);color:#fff;font-size:14px;cursor:pointer;white-space:nowrap;">添加</button>
            </div>
          </div>

          <div style="text-align:right;">
            <button class="icon-btn" id="closeManageModal">完成</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('modalContainer').innerHTML = html;
    const overlay = document.getElementById('manageModal');

    // 关闭
    document.getElementById('closeManageModal').addEventListener('click', function () {
      overlay.remove();
    });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
    });

    // 显示/隐藏切换
    overlay.querySelectorAll('.module-visible-cb').forEach(cb => {
      cb.addEventListener('change', function () {
        Store.updateModule(this.dataset.id, { visible: this.checked });
      });
    });

    // 重命名
    overlay.querySelectorAll('.module-name-input').forEach(inp => {
      inp.addEventListener('change', function () {
        const newName = this.value.trim();
        if (newName) {
          Store.updateModule(this.dataset.id, { name: newName });
        }
      });
    });

    // 换图标
    overlay.querySelectorAll('.module-icon-display').forEach(span => {
      span.addEventListener('click', function () {
        const id = this.dataset.id;
        const current = this.textContent;
        const idx = iconOptions.indexOf(current);
        const next = iconOptions[(idx + 1) % iconOptions.length];
        this.textContent = next;
        Store.updateModule(id, { icon: next });
      });
    });

    // 删除自定义模块
    overlay.querySelectorAll('.module-del-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = this.dataset.id;
        if (confirm('确定删除这个自定义模块？所有数据将丢失。')) {
          Store.deleteCustomModule(id);
          overlay.remove();
          renderNav();
          loadModule(getNavItems()[0].id);
          toast('模块已删除', 'success');
        }
      });
    });

    // 添加新模块
    document.getElementById('addModuleBtn').addEventListener('click', function () {
      const name = document.getElementById('newModuleName').value.trim();
      const icon = document.getElementById('newModuleIcon').value;
      if (!name) { toast('请输入模块名称', 'error'); return; }
      Store.addCustomModule(name, icon);
      toast('模块已添加', 'success');
      // 刷新弹窗
      overlay.remove();
      showManageModulesModal();
    });
  }

  // 渲染搜索结果
  function renderSearchResults(results) {
    const container = document.getElementById('searchResults');
    if (results.length === 0) {
      container.innerHTML = '<div class="search-result-item"><div class="search-result-content text-muted">未找到相关结果</div></div>';
    } else {
      container.innerHTML = results.slice(0, 20).map(r => `
        <div class="search-result-item" data-module="${r.module}" data-id="${r.id}" data-date="${r.date}">
          <div class="search-result-type">${r.type}</div>
          <div class="search-result-content">${escapeHtml(r.content)}</div>
        </div>
      `).join('');

      container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', function () {
          const date = this.dataset.date;
          const module = this.dataset.module;
          // 切换到对应日期
          document.getElementById('currentDate').value = date;
          Store.setCurrentDate(date);
          // 切换到对应模块
          loadModule(module);
          container.classList.remove('active');
          document.getElementById('globalSearch').value = '';
        });
      });
    }
    container.classList.add('active');
  }

  // 导出弹窗
  function showExportModal() {
    const html = `
      <div class="modal-overlay" id="exportModal">
        <div class="modal">
          <div class="modal-title">数据备份导出</div>
          <p class="text-muted mb-16">选择导出格式，备份你的全部数据：</p>
          <div class="flex-row" style="flex-direction:column;gap:12px;align-items:stretch;">
            <div class="list-item" style="cursor:pointer;" id="exportJson">
              <span style="font-size:24px;">📦</span>
              <div class="flex-1">
                <div class="fw-600">JSON 完整备份</div>
                <div class="text-sm text-muted">导出全部数据，可用于恢复</div>
              </div>
            </div>
            <div class="list-item" style="cursor:pointer;" id="exportCsv">
              <span style="font-size:24px;">📊</span>
              <div class="flex-1">
                <div class="fw-600">CSV 表格导出</div>
                <div class="text-sm text-muted">计时、账单、训练、清单表格格式</div>
              </div>
            </div>
            <div class="list-item" style="cursor:pointer;" id="exportTxt">
              <span style="font-size:24px;">📝</span>
              <div class="flex-1">
                <div class="fw-600">TXT 文本导出</div>
                <div class="text-sm text-muted">纯文本格式，便于阅读和打印</div>
              </div>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn" id="closeExportModal">关闭</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('modalContainer').innerHTML = html;

    document.getElementById('exportJson').addEventListener('click', function () {
      Store.exportData('json');
      toast('JSON备份已下载', 'success');
      closeModal();
    });
    document.getElementById('exportCsv').addEventListener('click', function () {
      Store.exportData('csv');
      toast('CSV文件已下载', 'success');
      closeModal();
    });
    document.getElementById('exportTxt').addEventListener('click', function () {
      Store.exportData('txt');
      toast('TXT文件已下载', 'success');
      closeModal();
    });
    document.getElementById('closeExportModal').addEventListener('click', closeModal);
    document.getElementById('exportModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  }

  // 计时仓库弹窗
  function showTimerRepoModal() {
    const html = `
      <div class="modal-overlay" id="timerRepoModal">
        <div class="modal" style="min-width:520px;">
          <div class="modal-title">⏱ 全局计时仓库</div>
          <p class="text-muted mb-12">所有计时记录汇总于此，可在锻炼和学习模块中调取使用。</p>
          <div id="timerRepoModalList" style="max-height:400px;overflow-y:auto;"></div>
          <div class="modal-actions">
            <button class="btn" id="closeTimerRepoModal">关闭</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('modalContainer').innerHTML = html;
    Timer.renderTimerRepo('timerRepoModalList', null, null);
    document.getElementById('closeTimerRepoModal').addEventListener('click', closeModal);
    document.getElementById('timerRepoModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  }

  function closeModal() {
    document.getElementById('modalContainer').innerHTML = '';
  }

  // 应用主题
  function applyTheme(theme) {
    document.body.classList.toggle('dark-mode', theme === 'dark');
  }

  // 更新计时仓库计数
  function updateTimerRepoCount() {
    const count = Store.getTimers().length;
    document.getElementById('timerRepoCount').textContent = count + ' 条记录';
  }

  // Toast 通知
  function toast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transform = 'translateX(100%)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 2800);
  }

  // 通用：创建模态框
  function modal(title, contentHtml, actions) {
    const html = `
      <div class="modal-overlay" id="dynamicModal">
        <div class="modal">
          <div class="modal-title">${title}</div>
          <div id="dynamicModalBody">${contentHtml}</div>
          <div class="modal-actions" id="dynamicModalActions"></div>
        </div>
      </div>
    `;
    document.getElementById('modalContainer').innerHTML = html;

    const actionsContainer = document.getElementById('dynamicModalActions');
    if (actions && actions.length > 0) {
      actions.forEach(a => {
        const btn = document.createElement('button');
        btn.className = a.primary ? 'btn btn-primary' : 'btn';
        btn.textContent = a.label;
        btn.addEventListener('click', function () {
          var result = undefined;
          if (a.onClick) result = a.onClick(document.getElementById('dynamicModalBody'));
          if (result !== false && a.closeAfter !== false) closeModal();
        });
        actionsContainer.appendChild(btn);
      });
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '关闭';
      btn.addEventListener('click', closeModal);
      actionsContainer.appendChild(btn);
    }

    document.getElementById('dynamicModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  }

  // 工具函数
  function escapeHtml(str) {
    if (str == null) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function formatMoney(num) {
    return '¥' + (parseFloat(num) || 0).toFixed(2);
  }

  // 获取某月的天数范围
  function getMonthRange(dateStr) {
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = d.getMonth();
    return {
      yearMonth: `${year}-${String(month + 1).padStart(2, '0')}`,
      year: String(year),
      start: `${year}-${String(month + 1).padStart(2, '0')}-01`,
      end: `${year}-${String(month + 1).padStart(2, '0')}-${new Date(year, month + 1, 0).getDate()}`
    };
  }

  return {
    init,
    loadModule,
    toast,
    modal,
    closeModal,
    updateTimerRepoCount,
    escapeHtml,
    formatDate,
    formatMoney,
    getMonthRange,
    getCurrentDate: () => Store.getCurrentDate()
  };
})();

// 启动应用
document.addEventListener('DOMContentLoaded', function () {
  App.init();
});


</script>
</body>
</html>
