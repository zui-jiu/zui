<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F7FAF9; --card:#FFFFFF; --accent:#6F8F88; --accent-soft:rgba(111,143,136,.1);
  --line:#E4EBE9; --text:#2A3331; --sub:#8FA39D; --radius:18px;
  --shadow:0 4px 18px rgba(42,51,49,.06);
}
:root.dark{
  --bg:#121C1A; --card:#1E2D2A; --accent:#8FB5AA; --accent-soft:rgba(143,181,170,.12);
  --line:#2C3E3A; --text:#E6ECEA; --sub:#7D948E; --shadow:0 4px 18px rgba(0,0,0,.34);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:inherit;}
svg{display:block;}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh;}
.sidebar{width:224px;flex:none;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;}
.logo{font-size:21px;font-weight:700;margin-bottom:18px;padding:0 10px;letter-spacing:1px;}
.logo em{color:var(--accent);font-style:normal;}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  color:var(--sub);font-size:14px;cursor:pointer;transition:.15s;user-select:none;}
.side-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.side-item:hover{background:var(--accent-soft);color:var(--accent);}
.side-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.side-foot{margin-top:auto;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;padding:10px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.header{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;}
.header h1{font-size:18px;font-weight:600;}
.spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);background:var(--card);border:1px solid var(--line);transition:.15s;}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* 日期选择控件（锻炼 / 学习 顶部） */
.date-bar{display:none;align-items:center;gap:8px;margin-left:6px;}
.date-bar.show{display:flex;}
.db-compact{display:flex;align-items:center;gap:4px;}
.db-arrow{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s;}
.db-arrow:hover{color:var(--accent);border-color:var(--accent);}
.db-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s;}
.db-chip:hover{border-color:var(--accent);color:var(--accent);}
.db-chip svg{width:14px;height:14px;stroke:var(--sub);fill:none;stroke-width:1.6;flex:none;}
.db-week{display:none;align-items:center;gap:4px;}
.db-day{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);cursor:pointer;border:1px solid transparent;transition:.15s;}
.db-day:hover{background:var(--accent-soft);color:var(--accent);}
.db-day.on{background:var(--accent);color:#fff;}
.db-day.t:not(.on){border-color:var(--accent);color:var(--accent);}
.db-calbtn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:.15s;}
.db-calbtn:hover{border-color:var(--accent);}
.db-calbtn svg{width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:1.6;}
@media(min-width:769px){.db-compact{display:none;}.db-week{display:flex;}}

/* 历史日期只读提示 */
.ro-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;margin-bottom:14px;}
.ro-banner svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.7;flex:none;}

/* 日历弹窗 */
.cal-pop{padding:4px;}
.cal-head{display:flex;align-items:center;justify-content:center;gap:16px;font-size:15px;margin-bottom:12px;}
.cal-head b{font-weight:600;}
.cal-weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-weekbar span{text-align:center;font-size:11px;color:var(--sub);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{height:38px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--text);cursor:pointer;position:relative;transition:.15s;}
.cal-cell:hover:not(.empty){background:var(--accent-soft);color:var(--accent);}
.cal-cell.empty{cursor:default;}
.cal-cell.on{background:var(--accent);color:#fff;}
.cal-cell.t:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-cell i{font-style:normal;font-size:9px;opacity:.7;margin-top:1px;}
.cal-pop .chip{font-size:12.5px;}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px;max-width:1080px;width:100%;margin:0 auto;scroll-behavior:smooth;}
.content::-webkit-scrollbar{width:8px;}
.content::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* 底部导航（手机） */
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;flex:1;user-select:none;}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--accent);}

@media(max-width:768px){
  .sidebar{display:none;}
  .tabbar{display:flex;}
  .content{padding:16px 14px 92px;}
  .header{padding:13px 16px;}
  .card{padding:14px;border-radius:14px;}
  .card-title{margin-bottom:12px;}
  .list-item{padding:12px 0;gap:8px;}
  .li-acts{gap:10px;}
  .li-acts .act i{display:none;}
  .li-acts svg{width:18px;height:18px;}
  .row{gap:8px;}
}

/* ===== 组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:14px;}
.card-title svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.card-title .more{margin-left:auto;font-size:11px;font-weight:400;color:var(--sub);}

.btn{border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;text-align:center;}
.btn-solid{background:var(--accent);color:#fff;}
.btn-solid:hover{filter:brightness(1.05);}
.btn-line{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn-text{background:transparent;color:var(--sub);font-weight:500;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn:active{transform:scale(.98);}

.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;}
.seg span{padding:8px 18px;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;transition:.15s;user-select:none;}
.seg span.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow);}

.input{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--sub);font-size:13px;}
.input svg{width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:1.7;stroke-linecap:round;flex:none;}
.input input,.input textarea,.input select{border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;resize:none;}
.input input::placeholder,.input textarea::placeholder{color:var(--sub);}

.chips-scroll{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips-scroll::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--bg);color:var(--sub);font-size:12.5px;border:1px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;transition:.15s;}
.chip.on,.chip.on-line{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
.chip.plus{color:var(--accent);}

.list-item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.li-main{flex:1;min-width:0;overflow:hidden;}
.li-title{font-size:14px;font-weight:500;word-break:break-word;overflow-wrap:anywhere;}
.li-sub{font-size:11.5px;color:var(--sub);margin-top:3px;}
.li-sub .tag{margin-right:4px;vertical-align:middle;}
.li-acts{display:flex;gap:13px;flex:none;align-items:flex-start;}
.li-acts .act{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.li-acts .act i{font-size:9px;color:var(--sub);font-style:normal;transition:.15s;}
.li-acts .act:hover i{color:var(--accent);}
.li-acts svg{width:16px;height:16px;stroke:#B9C6C2;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:.15s;}
.li-acts .act.ai svg,.li-acts .act:hover svg{stroke:var(--accent);}

.tag{font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--sub);border:1px solid var(--line);}
.tag.qc{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

.group-head{display:flex;align-items:center;gap:8px;padding:12px 2px 7px;position:sticky;top:0;background:var(--card);z-index:5;}
.group-head::before{content:"";width:4px;height:13px;background:var(--accent);border-radius:2px;opacity:.7;}
.group-head b{font-size:12.5px;font-weight:600;}
.group-head .cnt{font-size:10.5px;color:var(--sub);font-weight:400;}
.group-head .fold{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);cursor:pointer;user-select:none;}
.group-head .fold svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.load-hint{text-align:center;font-size:11.5px;color:var(--sub);padding:16px 0 6px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none;}
.load-hint .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.fab{position:fixed;right:18px;bottom:84px;width:46px;height:46px;border-radius:50%;background:var(--accent);
  box-shadow:0 8px 20px rgba(111,143,136,.45);display:none;align-items:center;justify-content:center;z-index:40;cursor:pointer;}
.fab.show{display:flex;}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
@media(min-width:769px){.fab{bottom:28px;right:28px;}}

/* 统计小卡 */
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{text-align:center;}
.stat b{font-size:20px;font-weight:700;color:var(--text);display:block;}
.stat i{font-size:11px;color:var(--sub);font-style:normal;margin-top:2px;display:block;}
@media(max-width:768px){.grid-2{grid-template-columns:1fr;}.grid-4{grid-template-columns:repeat(2,1fr);}}

.divider-v{width:1px;background:var(--line);align-self:stretch;}

/* 统计图表 */
.chart-title{font-size:12.5px;color:var(--sub);margin:14px 0 8px;}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 2px 0;position:relative;}
.chart-empty{display:flex;align-items:center;justify-content:center;height:110px;color:var(--sub);font-size:13px;background:var(--bg);border-radius:12px;}
.bar-track{flex:1;height:100%;background:var(--line);border-radius:6px;position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation;}
.bar-fill{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:6px 6px 0 0;opacity:.85;transition:opacity .15s;}
.bar-track:hover .bar-fill,.bar-track.active .bar-fill{opacity:1;}

/* ===================== 工具 ===================== */
const $=(s,r=document)=>r.querySelector(s);

function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h>0?pad(h)+":":"")+pad(m)+":"+pad(s);}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dateKey(ts){const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dayDiff(dateStr){const t=new Date();t.setHours(0,0,0,0);const d=new Date(dateStr+"T00:00:00");return Math.round((t-d)/86400000);}
function groupOf(dateStr){const d=dayDiff(dateStr);if(d===0)return"今日";if(d===1)return"昨天";if(d>=2&&d<=7)return"上周";return"更早";}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function daysBetween(a,b){const d1=new Date(a+"T00:00:00"),d2=new Date(b+"T00:00:00");return Math.round((d2-d1)/86400000);}
function addDays(dateStr,n){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function weekOf(dateStr){const d=new Date(dateStr+"T00:00:00");const wd=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>addDays(dateStr,-wd+i));}
function monthRange(dateStr){const d=new Date(dateStr+"T00:00:00");const y=d.getFullYear(),m=d.getMonth();const start=y+"-"+pad(m+1)+"-01";const end=y+"-"+pad(m+1)+"-"+pad(new Date(y,m+1,0).getDate());return [start,end];}
function yearRange(dateStr){const y=Number(dateStr.split("-")[0]);return [y+"-01-01",y+"-12-31"];}

function weekdayLabel(dateStr){return "周"+WD[new Date(dateStr+"T00:00:00").getDay()];}
function mdLabel(dateStr){const d=new Date(dateStr+"T00:00:00");return (d.getMonth()+1)+"月"+d.getDate()+"日";}

function timerStart(){
  const tm=state.timer;
  if(tm.running)return;
  tm.running=true;tm.last=Date.now();
  if(!tm.id)tm.id=uid();
  timerInt=setInterval(()=>{
    if(tm.mode==="up")tm.elapsed+=1;
    else{tm.elapsed-=1;if(tm.elapsed<=0){tm.elapsed=0;timerStop(true);}}
    const el=$("#timerBig");if(el)el.textContent=fmt(tm.elapsed);
    const st=$("#timerState");if(st)st.textContent=(tm.mode==="up"?"正计时":"倒计时")+(tm.running?"进行中":"已暂停");
  },1000);
  render();
}
function timerPause(){
  const tm=state.timer;if(!tm.running)return;
  tm.running=false;clearInterval(timerInt);timerInt=null;render();
}
function timerStop(auto){
  const tm=state.timer;if(!tm.running&&tm.elapsed===0&&!auto)return;
  clearInterval(timerInt);timerInt=null;
  if(tm.elapsed>0){
    store.timers.unshift({id:tm.id||uid(),name:tm.name||(tm.mode==="up"?"正计时记录":"倒计时记录"),mode:tm.mode,duration:tm.elapsed,date:todayStr(),ts:Date.now(),archived:false,importedBy:[]});
    save();
  }
  state.timer={running:false,mode:tm.mode,name:"",elapsed:0,last:0,cdMin:tm.cdMin,id:null};
  render();
}

/* ===================== 统计图表工具函数 ===================== */
function periodName(p){return {week:"本周",month:"本月",year:"本年"}[p]||"";}
function rangeBy(dateStr,period){
  if(period==="week"){const w=weekOf(dateStr);return [w[0],w[6]];}
  if(period==="month")return monthRange(dateStr);
  return yearRange(dateStr);
}
function fmtHours(sec){sec=Math.max(0,sec);const h=sec/3600;return h>=1?h.toFixed(1)+"h":Math.round(sec/60)+"min";}

function trendData(dateStr,period,source){
  const [s,e]=rangeBy(dateStr,period);
  let labels=[],values=[],tips=[],xLabels=[];
  const label=(ds)=>mdLabel(ds), tipPre=source==="workout"?"训练时长":"专注学习时长";
  if(period==="week"){
    const days=weekOf(dateStr);
    labels=days.map(ds=>WD[new Date(ds+"T00:00:00").getDay()]);
    xLabels=days.map(label);
    values=days.map(ds=>source==="workout"
      ?store.workouts.filter(w=>w.date===ds).reduce((a,w)=>a+(w.duration||0),0)
      :store.timers.filter(t=>t.date===ds&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0));
    tips=days.map((ds,i)=>`${xLabels[i]} · ${tipPre} ${fmtHours(values[i])}`);
  }else if(period==="month"){
    const y=Number(dateStr.split("-")[0]),m=Number(dateStr.split("-")[1])-1;
    const dc=new Date(y,m+1,0).getDate();
    labels=Array.from({length:dc},(_,i)=>{const day=i+1;return (day===1||day%5===0||day===dc)?String(day):"";});
    xLabels=Array.from({length:dc},(_,i)=>`${m+1}月${i+1}日`);
    values=Array.from({length:dc},(_,i)=>{
      const ds=`${y}-${pad(m+1)}-${pad(i+1)}`;
      return source==="workout"
        ?store.workouts.filter(w=>w.date===ds).reduce((a,w)=>a+(w.duration||0),0)
        :store.timers.filter(t=>t.date===ds&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0);
    });
    tips=labels.map((d,i)=>`${xLabels[i]} · ${tipPre} ${fmtHours(values[i])}`);
  }else{
    const y=Number(dateStr.split("-")[0]);
    labels=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    xLabels=labels;
    values=labels.map((_,i)=>{
      const ms=`${y}-${pad(i+1)}-01`,me=`${y}-${pad(i+1)}-${pad(new Date(y,i+1,0).getDate())}`;
      return source==="workout"
        ?store.workouts.filter(w=>w.date>=ms&&w.date<=me).reduce((a,w)=>a+(w.duration||0),0)
        :store.timers.filter(t=>t.date>=ms&&t.date<=me&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0);
    });
    tips=labels.map((lb,i)=>`${lb} · ${tipPre}总时长 ${fmtHours(values[i])}`);
  }
  const title=source==="workout"
    ?(period==="week"?"本周时长趋势":period==="month"?"本月时长趋势":"本年时长趋势")
    :(period==="week"?"本周学习趋势":period==="month"?"本月学习趋势":"本年学习趋势");
  return {labels,values,tips,title};
}
function barChartHtml(trend,yUnit,emptyText){
  const hasData=trend.values.some(v=>v>0);
  if(!hasData)return `<div class="chart-empty">${emptyText}</div>`;
  const maxV=Math.max(...trend.values,1);
  const yMax=Math.ceil(maxV/1800)*1800;
  const bars=trend.values.map((v,i)=>`<div class="bar-track" data-tip="${esc(trend.tips[i])}"><div class="bar-fill" style="height:${Math.min(100,Math.round(v/maxV*100))}%;"></div></div>`).join("");
  return `<div class="chart-title">${trend.title}</div>
    <div style="position:relative;">
      <div class="y-axis"><span>${fmtHours(yMax)}</span><span>${fmtHours(yMax/2)}</span><span>0</span></div>
      <div class="chart-wrap" style="margin-left:30px;">${bars}</div>
    </div>
    <div class="bar-labels" style="margin-left:30px;">${trend.labels.map(l=>`<span>${esc(l)}</span>`).join("")}</div>
    <div class="tiny" style="margin-top:4px;color:var(--sub);text-align:right;">纵轴：${yUnit}</div>`;
}
function ratioBars(tagDur,emptyText){
  const entries=Object.entries(tagDur).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return `<div class="empty" style="padding:12px 0;">${emptyText}</div>`;
  const maxV=Math.max(...entries.map(e=>e[1]),1);
  return entries.map(([name,val])=>`<div class="row cat-ratio"><span class="name">${esc(name)}</span><div class="bar-bg"><i class="bar-fill-i" style="width:${Math.round(val/maxV*100)}%;"></i></div><span class="val">${fmt(val)}</span></div>`).join("");
}
function segHtml(action,current){return `<span class="seg" style="margin-left:auto;">
  <span class="${current==="week"?"on":""}" data-action="${action}" data-p="week">周</span>
  <span class="${current==="month"?"on":""}" data-action="${action}" data-p="month">月</span>
  <span class="${current==="year"?"on":""}" data-action="${action}" data-p="year">年</span>
</span>`;}

/* Tooltip */
function ensureTip(){
  let t=$("#chartTip");if(t)return t;
  t=document.createElement("div");t.id="chartTip";t.className="chart-tooltip";document.body.appendChild(t);return t;
}
function showTip(el,text){
  const tip=ensureTip();tip.textContent=text;tip.classList.add("show");
  const r=el.getBoundingClientRect();const tr=tip.getBoundingClientRect();
  let x=r.left+r.width/2-tr.width/2,y=r.top-tr.height-8;
  if(x<4)x=4;if(x+tr.width>innerWidth-4)x=innerWidth-tr.width-4;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
function hideTip(){const t=$("#chartTip");if(t)t.classList.remove("show");}
document.addEventListener("mouseenter",e=>{const tr=e.target.closest("[data-tip]");if(tr)showTip(tr,tr.dataset.tip);},true);
document.addEventListener("mouseleave",e=>{if(e.target.closest("[data-tip]"))hideTip();},true);
document.addEventListener("touchstart",e=>{const tr=e.target.closest("[data-tip]");if(tr){showTip(tr,tr.dataset.tip);tr.classList.add("active");}},true);
document.addEventListener("touchend",e=>{const tr=e.target.closest("[data-tip]");if(tr){setTimeout(hideTip,1200);tr.classList.remove("active");}},true);

function curEditor(){return $("#ndEditor")||$("#mdEditor");}
function rtExec(btn){
  const rt=btn.dataset.rt, ed=curEditor();if(!ed)return;
  ed.focus();
  if(rt==="bold"||rt==="italic"||rt==="underline"){
    document.execCommand(rt);
    btn.classList.toggle("on",document.queryCommandState(rt));
  }else if(rt.startsWith("fs-")){
    document.execCommand("fontSize",false,rt.slice(3));
    [...btn.parentElement.querySelectorAll('[data-rt^="fs-"]')].forEach(b=>b.classList.toggle("on",b===btn));
  }else if(rt.startsWith("lh-")){
    const k=rt.slice(3);
    ed.style.lineHeight=LH_MAP[k];ed.dataset.lh=k;
    [...btn.parentElement.querySelectorAll('[data-rt^="lh-"]')].forEach(b=>b.classList.toggle("on",b===btn));
  }else if(rt==="ol")document.execCommand("insertOrderedList");
  else if(rt==="ul")document.execCommand("insertUnorderedList");
}

  let list=store.memos.slice().sort((a,b)=>b.ts-a.ts);

  else list=list.filter(m=>!m.archived);
  if(state.memoStar)list=list.filter(m=>m.star);
  if(state.memoTag!=="all")list=list.filter(m=>m.tag===state.memoTag);
  if(state.memoTime==="today")list=list.filter(m=>dayDiff(m.date)===0);
  if(state.memoTime==="3d")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=2);
  if(state.memoTime==="week")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=6);
  if(state.memoTime==="month")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=30);
  if(state.memoQ)list=list.filter(m=>m.content.includes(state.memoQ));
  return list;

/* ===================== 渲染调度 ===================== */
const TITLES={timer:"计时器",countdown:"倒数日",workout:"锻炼计划",study:"学习计划",todo:"每日清单",memo:"综合记录",noteDetail:"笔记详情",memoDetail:"备忘详情"};
const NAV_OF={noteDetail:"study",memoDetail:"memo"};
function go(page){
  if(page!=="workout")state.wkEdit=false;
  state.page=page;state.histPage=0;state.memoPage=0;
  const navKey=NAV_OF[page]||page;
  $$(".side-item").forEach(e=>e.classList.toggle("active",e.dataset.nav===navKey));
  $$(".tab").forEach(e=>e.classList.toggle("active",e.dataset.nav===navKey));
  $("#pageTitle").textContent=TITLES[page];
  const db=$("#dateBar");
  if(db){const showDP=(page==="workout"||page==="study");db.classList.toggle("show",showDP);db.innerHTML=showDP?dateBarHtml():"";}
  const mb=$("#moreBtn");
  if(mb)mb.style.display=(page==="workout"&&state.workoutDate!==todayStr())?"flex":"none";
  const map={timer:renderTimer,countdown:renderCountdown,workout:renderWorkout,study:renderStudy,todo:renderTodo,memo:renderMemo,noteDetail:renderNoteDetail,memoDetail:renderMemoDetail};
  $("#view").innerHTML=map[page]();
  if(page==="timer")afterTimer();
  if(page==="workout")afterWorkout();
  if(page==="memo")afterMemo();
  $("#view").scrollTop=0;
  // 回到顶部按钮
  const fab=$(".fab");if(fab)fab.classList.remove("show");
}

/* ===================== 事件分发 ===================== */
/* 工具栏按下时不抢编辑器焦点，保住文字选区 */
document.addEventListener("mousedown",e=>{if(e.target.closest(".rt-bar"))e.preventDefault();});
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");
  if(nav){go(nav.dataset.nav);return;}
  const jp=e.target.closest("[data-jump]");
  if(jp){const d=jp.dataset.jump;const gh=[...document.querySelectorAll("#view .group-head b")].find(b=>b.textContent.includes(d));if(gh)gh.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const rt=e.target.closest("[data-rt]");
  if(rt){rtExec(rt);return;}
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  // 导航类
  if(a==="theme"){toggleTheme();return;}
  if(a==="top"){$("#view").scrollTo({top:0,behavior:"smooth"});return;}
  if(a==="close"){closeModal();return;}
  if(a==="data-menu"){openDataMenu();return;}

  /* ---- 计时器 ---- */
  if(a==="timer-start"){state.timer.name=$("#timerName")?$("#timerName").value:state.timer.name;timerStart();return;}
  if(a==="timer-pause"){if(state.timer.running)timerPause();else if(state.timer.elapsed>0)timerStart();else{};return;}
  if(a==="timer-stop"){timerStop(false);return;}
  if(a==="hist-more"){histMore();return;}
  if(a==="timer-import"){pickTimer(t=>{markImported(id,"timer");toast("已准备好导入，请在对应页面保存");closeModal();});return;}
  if(a==="timer-edit"){editTimer(id);return;}
  if(a==="timer-archive"){const t=store.timers.find(x=>x.id===id);if(t){t.archived=!t.archived;save();render();}return;}
  if(a==="timer-del"){if(confirm("确定删除该计时记录？")){store.timers=store.timers.filter(x=>x.id!==id);save();render();}return;}

  /* ---- 倒数日 ---- */
  if(a==="cd-add"){addCountdown();return;}
  if(a==="cd-edit"){addCountdown(id);return;}
  if(a==="cd-del"){if(confirm("删除该倒数事件？")){store.countdowns=store.countdowns.filter(c=>c.id!==id);save();render();}return;}
  if(a==="cd-pin"){const c=store.countdowns.find(x=>x.id===id);if(c){store.countdowns.forEach(x=>x.pinned=false);c.pinned=true;save();render();}return;}
  if(a==="cd-ye"){const c=store.countdowns.find(x=>x.id===id);if(c){c.yearly=!c.yearly;save();render();}return;}

  /* ---- 日期切换 ---- */
  if(a==="date-prev"){shiftDate(-1);return;}
  if(a==="date-next"){shiftDate(1);return;}
  if(a==="date-open"){openCalendar();return;}
  if(a==="date-field"){
    const cur=el.dataset.dfdate||todayStr();
    openCalendar(cur,d=>{
      el.dataset.dfdate=d;
      const inp=$(el.dataset.dfinput);if(inp)inp.value=d;
      const dsp=$(el.dataset.dfdisp);if(dsp){dsp.textContent=d;dsp.style.color="var(--text)";}
    });
    return;
  }
  if(a==="date-clear"){el.closest(".input").dataset.dfdate="";const inp=$(el.closest(".input").dataset.dfinput);if(inp)inp.value="";return;}
  if(a==="db-day"){setCurDate(el.dataset.dbday);render();return;}
  if(a==="cal-day"){
    const ds=e.target.closest("[data-action='cal-day']").dataset.date;
    if(datePickerTarget){datePickerTarget.date=ds;datePickerTarget.onSelect(ds);datePickerTarget=null;closeModal();}
    else{setCurDate(ds);closeModal();render();}
    return;
  }
  if(a==="cal-prev"){calMonth.m--;if(calMonth.m<0){calMonth.m=11;calMonth.y--;}refreshCalendar();return;}
  if(a==="cal-next"){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++;}refreshCalendar();return;}
  if(a==="cal-week"){
    if(datePickerTarget){datePickerTarget.onSelect(todayStr());datePickerTarget=null;closeModal();}
    else{setCurDate(todayStr());closeModal();render();}
    return;
  }

  /* ---- 锻炼 ---- */
  if(a==="wk-clear"){confirmClearWorkout();return;}
  if(a==="wk-clear-ok"){const w=store.workouts.find(x=>x.date===todayStr());if(w){w.tags=[];save();}closeModal();render();toast("已取消今日全部打卡，备注与计时数据已保留");return;}
  if(a==="wk-period"){state.wkPeriod=el.dataset.p;render();return;}
  if(a==="wk-more"){if(state.page==="workout"&&state.workoutDate!==todayStr())openWorkoutMenu();return;}
  if(a==="wk-editmode"){state.wkEdit=true;closeModal();render();toast("已开启打卡编辑模式");return;}
  if(a==="wk-editdone"){state.wkEdit=false;render();toast("修改已保存");return;}
  if(a==="wk-copy"){
    const src=store.workouts.find(x=>x.date===state.workoutDate);
    if(!src||!src.tags.length){toast("当日暂无打卡标签可复制");return;}
    let t=store.workouts.find(x=>x.date===todayStr());
    if(!t){t={id:uid(),date:todayStr(),tags:[],timerId:null,duration:0,note:"",summary:"",weight:null,bodyFat:null};store.workouts.push(t);}
    src.tags.forEach(tg=>{if(!t.tags.includes(tg))t.tags.push(tg);});
    save();closeModal();toast("已复制打卡至今日："+src.tags.join("、"));return;}
  if(a==="wk-import"){if(state.workoutDate!==todayStr()){toast("历史日期不可导入");return;}pickTimer(t=>{let w=store.workouts.find(x=>x.date===state.workoutDate);if(!w){w={id:uid(),date:state.workoutDate,tags:[],timerId:null,duration:0,note:"",summary:"",weight:null,bodyFat:null};store.workouts.push(w);}w.timerId=t.id;w.duration=t.duration;if(!t.importedBy.includes("workout"))t.importedBy.push("workout");save();render();toast("已导入："+t.name+" "+fmt(t.duration));});return;}
  if(a==="wk-unbind"){
    const w=store.workouts.find(x=>x.date===state.workoutDate);
    if(w&&w.timerId){
      openModal(`<h3>解绑计时</h3><p style="color:var(--sub);font-size:13px;line-height:1.7;">确定将该计时从当前页面解绑？计时原始记录不会删除，仅取消关联。</p><div class="modal-actions"><div class="btn btn-text" data-action="close">取消</div><div class="btn btn-solid" data-action="wk-unbind-ok">确认解绑</div></div>`);
    }
    return;
  }
  if(a==="wk-unbind-ok"){
    const w=store.workouts.find(x=>x.date===state.workoutDate);
    if(w&&w.timerId){
      const t=store.timers.find(x=>x.id===w.timerId);
      if(t){t.importedBy=t.importedBy.filter(x=>x!=="workout");}
      w.timerId=null;w.duration=0;save();render();toast("已解绑计时关联");
    }
    closeModal();return;
  }
  if(a==="wk-save"){const w=store.workouts.find(x=>x.date===state.workoutDate)||{id:uid(),date:state.workoutDate,tags:[],timerId:null,duration:0,note:"",summary:"",weight:null,bodyFat:null};
    w.note=$("#wkNote")?$("#wkNote").value:w.note;w.summary=$("#wkSummary")?$("#wkSummary").value:w.summary;
    w.weight=$("#wkWeight")&&$("#wkWeight").value?parseFloat($("#wkWeight").value):null;
    w.bodyFat=$("#wkFat")&&$("#wkFat").value?parseFloat($("#wkFat").value):null;
    if(!store.workouts.find(x=>x.id===w.id))store.workouts.push(w);save();toast("训练已保存");render();return;}

  /* ---- 学习 ---- */
  if(a==="st-add"){if(state.studyDate!==todayStr()){toast("历史日期仅查看");return;}addStudy();return;}
  if(a==="st-edit"){if(state.studyDate!==todayStr()){toast("历史日期仅查看");return;}addStudy(id);return;}
  if(a==="st-del"){if(state.studyDate!==todayStr()){toast("历史日期仅查看");return;}if(confirm("删除该学习任务？")){store.studies=store.studies.filter(s=>s.id!==id);save();render();}return;}
  if(a==="st-done"){if(state.studyDate!==todayStr()){toast("历史日期仅查看");return;}const s=store.studies.find(x=>x.id===id);if(s){s.done=!s.done;save();render();}return;}
  if(a==="st-import"){if(state.studyDate!==todayStr()){toast("历史日期不可导入");return;}pickTimer(t=>{const s=store.studies.find(x=>x.id===id);if(s){s.timerId=t.id;s.duration=(s.duration||0)+t.duration;if(!t.importedBy.includes("study"))t.importedBy.push("study");save();render();toast("已关联："+t.name);}});return;}
  if(a==="st-period"){state.stPeriod=el.dataset.p;render();return;}
  if(a==="st-unbind"){
    const s=store.studies.find(x=>x.id===id);
    if(s&&s.timerId){
      openModal(`<h3>解绑计时</h3><p style="color:var(--sub);font-size:13px;line-height:1.7;">确定将该计时从当前页面解绑？计时原始记录不会删除，仅取消关联。</p><div class="modal-actions"><div class="btn btn-text" data-action="close">取消</div><div class="btn btn-solid" data-action="st-unbind-ok" data-id="${id}">确认解绑</div></div>`);
    }
    return;
  }
  if(a==="st-unbind-ok"){
    const s=store.studies.find(x=>x.id===id);
    if(s&&s.timerId){
      const t=store.timers.find(x=>x.id===s.timerId);
      if(t){t.importedBy=t.importedBy.filter(x=>x!=="study");}
      s.timerId=null;s.duration=0;save();render();toast("已解绑计时关联");
    }
    closeModal();return;
  }
  /* ---- 学习笔记目录 / 详情 ---- */
  if(a==="nt-new"){state.noteDetailId=null;go("noteDetail");return;}
  if(a==="nt-open"){state.noteDetailId=id;go("noteDetail");return;}
  if(a==="nt-arc"){const n=store.notes.find(x=>x.id===id);if(n){n.archived=!n.archived;save();render();toast(n.archived?"已归档":"已还原");}return;}
  if(a==="note-more"){state.notePage++;renderNoteListOnly();return;}
  if(a==="nt-back"){go("study");return;}
  if(a==="nd-img"){const f=$("#ndImgFile");if(f)f.click();return;}
  if(a==="nd-save"){saveNoteDetail();return;}
  if(a==="nd-del"){if(confirm("删除这篇笔记？")){store.notes=store.notes.filter(x=>x.id!==state.noteDetailId);save();go("study");toast("笔记已删除");}return;}

  /* ---- 清单 ---- */
  if(a==="td-add"){addTodo();return;}
  if(a==="td-edit"){addTodo(id);return;}
  if(a==="td-del"){if(confirm("删除该任务？")){store.todos=store.todos.filter(t=>t.id!==id);save();render();}return;}
  if(a==="td-done"){const t=store.todos.find(x=>x.id===id);if(t){t.done=!t.done;save();render();}return;}
  if(a==="td-import"){pickTimer(t=>{const td=store.todos.find(x=>x.id===id);if(td){td.timerId=t.id;td.duration=(td.duration||0)+t.duration;save();render();toast("已记录耗时："+fmt(t.duration));}});return;}

  /* ---- 备忘录 ---- */
  if(a==="memo-save"){memoSave();return;}
  if(a==="memo-more"){state.memoPage++;render();return;}
  if(a==="memo-starfilter"){state.memoStar=!state.memoStar;state.memoPage=0;render();return;}
  if(a==="mm-star"){const m=store.memos.find(x=>x.id===id);if(m){m.star=!m.star;save();render();}return;}
  if(a==="mm-arc"){const m=store.memos.find(x=>x.id===id);if(m){m.archived=!m.archived;save();render();}return;}
  if(a==="mm-del"){if(confirm("删除该备忘？")){store.memos=store.memos.filter(x=>x.id!==id);save();render();}return;}
  if(a==="mm-open"){state.memoDetailId=id;go("memoDetail");return;}
  if(a==="mm-new"){state.memoDetailId=null;go("memoDetail");return;}
  if(a==="mm-back"){go("memo");return;}
  if(a==="md-img"){const f=$("#mdImgFile");if(f)f.click();return;}
  if(a==="md-save"){saveMemoDetail();return;}
  if(a==="md-star"){const m=store.memos.find(x=>x.id===state.memoDetailId);if(m){m.star=!m.star;save();el.classList.toggle("on",m.star);toast(m.star?"已标星":"已取消标星");}return;}
  if(a==="data-export"){exportData();return;}
  if(a==="data-import"){$("#importFile").click();return;}
});

/* 计时器模式 / 筛选芯片 */
document.addEventListener("click",e=>{
  const seg=e.target.closest("#timerMode span");
  if(seg){state.timer.mode=seg.dataset.mode;render();return;}
  const hf=e.target.closest("#histFilter .chip");
  if(hf){state.histFilter=hf.dataset.f;state.histPage=0;render();return;}
  const cf=e.target.closest("#cdFilter .chip");
  if(cf){if(cf.dataset.cf==="plus"){addCategory();return;}state.cdFilter=cf.dataset.cf;render();return;}
  const tf=e.target.closest("#todoFilter .chip");
  if(tf){state.todoFilter=tf.dataset.tf;render();return;}
  const nc=e.target.closest("[data-nc]");
  if(nc){if(nc.dataset.nc==="__arc"){state.noteArchived=!state.noteArchived;}else{state.noteArchived=false;state.noteCat=nc.dataset.nc;}state.notePage=0;render();return;}
  const mt=e.target.closest("[data-mt]");
  if(mt){if(mt.dataset.mt==="已归档"){state.memoArchived=true;}else{state.memoArchived=false;state.memoTag=mt.dataset.mt;}state.memoPage=0;render();return;}
  const mtime=e.target.closest("[data-mtime]");
  if(mtime){state.memoTime=mtime.dataset.mtime;state.memoPage=0;render();return;}
});

/* 图片附件读取 */
document.addEventListener("change",e=>{
  if(e.target.id==="ndImgFile"||e.target.id==="mdImgFile"){
    const editorId=e.target.id==="ndImgFile"?"ndEditor":"mdEditor";
    const files=[...e.target.files];const reads=files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);}));
    Promise.all(reads).then(imgs=>{const ed=$("#"+editorId);if(!ed)return;imgs.forEach(src=>{const img=document.createElement("img");img.src=src;ed.appendChild(img);});toast("已插入 "+imgs.length+" 张图片");});
    e.target.value="";
  }
  if(e.target.id==="importFile"){
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);Object.assign(store,d);save();toast("数据已导入");go(state.page);}catch(err){alert("导入失败：文件格式不正确");}};
    rd.readAsText(f);
  }
});

/* 输入框/回车 委托监听（避免重渲染后丢失） */
document.addEventListener("input",e=>{
  if(e.target.id==="timerName")state.timer.name=e.target.value;

  else if(e.target.id==="memoSearch"){state.memoQ=e.target.value;state.memoPage=0;render();}
  else if(e.target.id==="noteSearch"){state.noteQ=e.target.value;state.notePage=0;renderNoteListOnly();}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="memoInput"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();memoSave();}
});

/* ===================== 表单/编辑逻辑 ===================== */
function toggleTheme(){const dark=document.documentElement.classList.toggle("dark");store.settings.theme=dark?"dark":"light";save();}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity="0",1600);}
function markImported(timerId,page){const t=store.timers.find(x=>x.id===timerId);if(t&&!t.importedBy.includes(page)){t.importedBy.push(page);save();}}

/* 通用青瓷日期选择字段（替代原生 input[type=date]，避免系统绿色日历弹窗） */
function dateFieldHtml(id,value,placeholder){
  const ph=placeholder||"选择日期";
  const hasValue=!!value;
  return `<div class="input" style="cursor:pointer;" data-action="date-field" data-dfinput="${id}" data-dfdisp="${id}Display" data-dfdate="${value||""}">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
    <span id="${id}Display" style="color:${hasValue?'var(--text)':'var(--sub)'};">${hasValue?value:ph}</span>
    <input type="hidden" id="${id}" value="${value||""}">
  </div>`;
}

function editTimer(id){
  const t=store.timers.find(x=>x.id===id);if(!t)return;
  openModal(`<h3>编辑计时记录</h3>
    ${field("名称",`<div class="input"><input id="etName" value="${esc(t.name)}"></div>`)}
    ${field("时长（秒）",`<div class="input"><input id="etDur" type="number" value="${t.duration}"></div>`)}
    ${field("日期",dateFieldHtml("etDate",t.date))}
    <div class="modal-actions"><div class="btn btn-text" data-action="close">取消</div><div class="btn btn-solid" id="etOk">保存</div></div>`);
  $("#etOk").onclick=()=>{t.name=$("#etName").value;t.duration=parseInt($("#etDur").value)||0;t.date=$("#etDate").value;save();closeModal();render();};
}
function addCountdown(id){
  const c=id?store.countdowns.find(x=>x.id===id):null;
  const cats=["考试","生活","目标","节日","其他"];
  openModal(`<h3>${id?"编辑":"新增"}倒数事件</h3>
    ${field("事件名称",`<div class="input"><input id="cdTitle" value="${c?esc(c.title):""}" placeholder="如：考研初试"></div>`)}
    ${field("目标日期",dateFieldHtml("cdTarget",c?c.target:todayStr()))}
    ${field("分类",`<select id="cdCat" class="input" style="width:100%;">${cats.map(x=>`<option ${c&&c.category===x?"selected":""}>${x}</option>`).join("")}</select>`)}
    ${field("备注",`<div class="input"><input id="cdNote" value="${c?esc(c.note):""}" placeholder="可选"></div>`)}
    <div class="field"><label>选项</label><div class="prio-pick">
      <div class="prio-opt ${c&&c.pinned?"on":""}" data-pin>📌 置顶</div>
      <div class="prio-opt ${c&&c.yearly?"on":""}" data-ye>🔁 每年循环</div></div></div>
    <div class="modal-actions"><div class="btn btn-text" data-action="close">取消</div><div class="btn btn-solid" id="cdOk">保存</div></div>`);
  let pin=c&&c.pinned,ye=c&&c.yearly;
  modal.querySelector("[data-pin]").onclick=function(){pin=!pin;this.classList.toggle("on",pin);};
  modal.querySelector("[data-ye]").onclick=function(){ye=!ye;this.classList.toggle("on",ye);};
  $("#cdOk").onclick=()=>{
    const title=$("#cdTitle").value.trim();if(!title){toast("请填写名称");return;}
    if(id){Object.assign(c,{title,target:$("#cdTarget").value,category:$("#cdCat").value,note:$("#cdNote").value,pinned:pin,yearly:ye});}
    else{const nc={id:uid(),title,target:$("#cdTarget").value,category:$("#cdCat").value,note:$("#cdNote").value,pinned:pin,yearly:ye};if(pin)store.countdowns.forEach(x=>x.pinned=false);store.countdowns.push(nc);}
    save();closeModal();render();
  };
}
function addCategory(){
  const name=prompt("新增倒数日分类名称：");
  if(name&&name.trim()){toast("分类「"+name.trim()+"」已记录（可在新增时选用）");}
}
function addStudy(id){
  const s=id?store.studies.find(x=>x.id===id):null;
  openModal(`<h3>${id?"编辑":"新增"}学习任务</h3>
    ${field("任务名称",`<div class="input"><input id="stTitle" value="${s?esc(s.title):""}" placeholder="如：英语学习"></div>`)}
    ${field("截止日期",dateFieldHtml("stDead",s?s.deadline:""))}
    <div class="field"><label>优先级</label><div class="prio-pick">
      ${[["high","高"],["mid","中"],["low","低"]].map(([k,l])=>`<div class="prio-opt ${s?(s.priority===k?"on":""):(k==="mid"?"on":"")}" data-p="${k}"><span class="dot ${k==="high"?"dot-h":k==="mid"?"dot-m":"dot-l"}"></span>${l}</div>`).join("")}
    </div></div>
    <div class="modal-actions"><div class="btn btn-text" data-action="close">取消</div><div class="btn btn-solid" id="stOk">保存</div></div>`);
  let prio=s?s.priority:"mid";
  modal.querySelectorAll("[data-p]").forEach(p=>p.onclick=function(){prio=this.dataset.p;modal.querySelectorAll("[data-p]").forEach(x=>x.classList.remove("on"));this.classList.add("on");});

    const title=$("#stTitle").value.trim();if(!title){toast("请填写任务名");return;}
    if(id){s.title=title;s.deadline=$("#stDead").value;s.priority=prio;}
    else store.studies.push({id:uid(),title,deadline:$("#stDead").value,priority:prio,timerId:null,duration:0,done:false,date:state.studyDate});

}
/* 笔记详情保存（二级页） */
function saveNoteDetail(){
  const titleEl=$("#ndTitle"),catEl=$("#ndCat"),ed=$("#ndEditor");
  if(!ed)return;
  const html=ed.innerHTML.trim();
  const text=ed.innerText.trim();
  const title=(titleEl.value.trim())||text.split("\n")[0].slice(0,20)||"未命名笔记";
  if(!text&&!html.includes("<img")){toast("笔记内容不能为空");return;}
  const cat=catEl.value.trim()||"未分类";
  const lh=ed.dataset.lh||"std";
  if(state.noteDetailId){
    const n=store.notes.find(x=>x.id===state.noteDetailId);
    if(n){n.title=title;n.category=cat;n.content=text;n.html=html;n.lh=lh;}
  }else{
    const n={id:uid(),title,category:cat,content:text,html,lh,taskId:null,date:todayStr(),ts:Date.now(),archived:false};
    store.notes.unshift(n);state.noteDetailId=n.id;
  }
  save();go("study");toast("笔记已保存");
}
function addTodo(id){
  const t=id?store.todos.find(x=>x.id===id):null;
  openModal(`<h3>${id?"编辑":"新增"}任务</h3>
    ${field("任务名称",`<div class="input"><input id="tdTitle" value="${t?esc(t.title):""}" placeholder="如：回复邮件"></div>`)}
    <div class="field"><label>优先级</label><div class="prio-pick">
      ${[["high","高"],["mid","中"],["low","低"]].map(([k,l])=>`<div class="prio-opt ${t?(t.priority===k?"on":""):(k==="mid"?"on":"")}" data-p="${k}"><span class="dot ${k==="high"?"dot-h":k==="mid"?"dot-m":"dot-l"}"></span>${l}</div>`).join("")}
    </div></div>
    <div class="field"><label>循环</label><div class="prio-pick">
      ${[["","不循环"],["daily","每日"],["weekly","每周"]].map(([k,l])=>`<div class="prio-opt ${t?(t.recurring===k?"on":""):(k===""?"on":"")}" data-r="${k}">${l}</div>`).join("")}
    </div></div>

  modal.querySelectorAll("[data-r]").forEach(p=>p.onclick=function(){rec=this.dataset.r;modal.querySelectorAll("[data-r]").forEach(x=>x.classList.remove("on"));this.classList.add("on");});

}
function memoSave(){
  const content=$("#memoInput").value.trim();if(!content){toast("内容为空");return;}
  store.memos.unshift({id:uid(),content,html:"",tag:$("#memoTag").value,star:false,archived:false,date:todayStr(),ts:Date.now(),images:[]});
  save();render();toast("已保存，点击条目可进入详情继续书写");
}
function openDataMenu(){
  openModal(`<h3>数据同步</h3>
    <div class="tiny" style="margin-bottom:14px;">当前为浏览器本地存储。导出文件可在另一台设备（同款浏览器导入）实现手动同步；真正的实时云端同步需后续接入后端。</div>
    <div class="modal-actions">
      <div class="btn btn-line" data-action="data-export">导出 JSON</div>
      <div class="btn btn-solid" data-action="data-import">导入 JSON</div>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="modal-actions" style="margin-top:10px;"><div class="btn btn-text" data-action="close">关闭</div></div>`);
}
function exportData(){
  const data={timers:store.timers,countdowns:store.countdowns,workouts:store.workouts,studies:store.studies,notes:store.notes,todos:store.todos,memos:store.memos};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="qingci-data.json";a.click();
  toast("已导出数据文件");
}

/* 计时器导入选择（模态内点击） */
document.addEventListener("click",e=>{
  const pick=e.target.closest("[data-pick]");
  if(pick&&state.importCb){const t=store.timers.find(x=>x.id===pick.dataset.pick);const cb=state.importCb;state.importCb=null;cb(t);}
});

/* ===================== 启动 ===================== */
go("timer");
</script>
</body>
</html>
