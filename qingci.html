<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --bg:#F7FAF9; --card:#FFFFFF; --accent:#6F8F88; --accent-soft:rgba(111,143,136,.1); --train:#0891B2; --train-soft:rgba(8,145,178,.12);
  --line:#E4EBE9; --text:#2A3331; --sub:#8FA39D; --radius:18px;
  --shadow:0 4px 18px rgba(42,51,49,.06);
  --tl-workout:#C0857A; --tl-study:#7E9CB8; --tl-todo:#BFA271; --tl-countdown:#9A8FC0; --tl-timer:#6F8F88;
}
:root.dark{
  --bg:#121C1A; --card:#1E2D2A; --accent:#8FB5AA; --accent-soft:rgba(143,181,170,.12); --train:#22D3EE; --train-soft:rgba(34,211,238,.15);
  --line:#2C3E3A; --text:#E6ECEA; --sub:#7D948E; --shadow:0 4px 18px rgba(0,0,0,.34);
  --tl-workout:#E0A093; --tl-study:#9BBBD9; --tl-todo:#DCC08E; --tl-countdown:#B5A8DE; --tl-timer:#8FB5AA;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;}
button{font-family:inherit;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;}
svg{display:block;}
img{-webkit-touch-callout:none;}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;height:100dvh;min-height:100dvh;}
.sidebar{width:224px;flex:none;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;}
.logo{font-size:21px;font-weight:700;margin-bottom:18px;padding:0 10px;letter-spacing:1px;}
.logo em{color:var(--accent);font-style:normal;}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  color:var(--sub);font-size:14px;cursor:pointer;transition:.15s;user-select:none;}
.side-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.side-item:hover{background:var(--accent-soft);color:var(--accent);}
.side-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.side-foot{margin-top:auto;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;padding:10px;}
.side-tool{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);}
.side-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;flex:none;}
.side-badge:empty{display:none;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;}
.header{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;}
.header h1{font-size:18px;font-weight:600;}
.spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);background:var(--card);border:1px solid var(--line);transition:.15s;}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* 日期选择控件（锻炼 / 学习 顶部） */
.date-bar{display:none;align-items:center;gap:8px;margin-left:6px;}
.date-bar.show{display:flex;}
.db-compact{display:flex;align-items:center;gap:4px;}
.db-arrow{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s;}
.db-arrow:hover{color:var(--accent);border-color:var(--accent);}
.db-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s;}
.db-chip:hover{border-color:var(--accent);color:var(--accent);}
.db-chip svg{width:14px;height:14px;stroke:var(--sub);fill:none;stroke-width:1.6;flex:none;}
.db-week{display:none;align-items:center;gap:4px;}
.db-day{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);cursor:pointer;border:1px solid transparent;transition:.15s;}
.db-day:hover{background:var(--accent-soft);color:var(--accent);}
.db-day.on{background:var(--accent);color:#fff;}
.db-day.t:not(.on){border-color:var(--accent);color:var(--accent);}
.db-calbtn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:.15s;}
.db-calbtn:hover{border-color:var(--accent);}
.db-calbtn svg{width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:1.6;}
.df-clear{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-left:auto;margin-right:-4px;}
.df-clear:hover{background:var(--accent-soft);}
.df-clear svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:1.8;}
@media(min-width:769px){.db-compact{display:none;}.db-week{display:flex;}}

/* 历史日期只读提示 */
.ro-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;margin-bottom:14px;}
.ro-banner svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.7;flex:none;}

/* 日历弹窗 */
.cal-pop{padding:4px;}
.cal-head{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;margin-bottom:12px;}
.cal-head b{font-weight:600;}
.cal-mnav{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:3px 6px;border:1px solid var(--line);}
.cal-mnav .db-arrow{width:22px;height:22px;font-size:14px;}
.cal-yarr{width:34px;height:34px;font-size:22px;color:var(--text);border-color:transparent;background:transparent;}
.cal-yarr:hover{color:var(--accent);background:var(--accent-soft);border-color:transparent;}
.cal-foot{margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:center;}
.cal-weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-weekbar span{text-align:center;font-size:11px;color:var(--sub);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--text);cursor:pointer;position:relative;transition:.15s;}
.cal-cell:hover:not(.empty){background:var(--accent-soft);color:var(--accent);}
.cal-cell.empty{cursor:default;}
.cal-cell.on{background:var(--accent);color:#fff;}
.cal-cell.t:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-cell i{font-style:normal;font-size:8.5px;opacity:.7;margin-top:2px;transform:scale(.92);white-space:nowrap;}
.cal-pop .chip{font-size:12.5px;}

/* ===== 锻炼计划折叠面板（仅锻炼页） ===== */
.wk-panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:14px;overflow:hidden;}
.wk-panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.15s;}
.wk-panel-head:hover{background:var(--accent-soft);}
.wp-ico{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.wp-title{font-size:14.5px;font-weight:600;}
.wp-sum{font-size:12px;color:var(--sub);margin-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wp-arrow{width:18px;height:18px;margin-left:auto;flex:none;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;}
.wp-arrow.open{transform:rotate(180deg);}
.wk-panel-body{padding:4px 16px 16px;}
.wk-cal-num{cursor:pointer;color:var(--accent);text-decoration:underline dotted var(--accent);text-underline-offset:3px;}
.wk-cal-num:active{opacity:.7;}
/* 训练日历高亮 */
.cal-cell.hl{background:var(--train-soft);color:var(--train);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--train);}
.cal-cell.hl.on{background:var(--train);color:#fff;box-shadow:none;}
.cal-cell.hl:not(.on){cursor:pointer;}
.cal-cell.hl:not(.on):hover{filter:brightness(.97);}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);margin-top:10px;}
.cal-dot{width:11px;height:11px;border-radius:4px;background:var(--train);display:inline-block;}
/* ---- 全局时间线 ---- */
.tl-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.tl-time{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:20px;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;}
.tl-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.tl-fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--bg);color:var(--sub);
  font-size:12.5px;border:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;transition:.15s;}
.tl-fchip i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35;flex:none;transition:.15s;}
.tl-fchip.on{color:var(--text);background:var(--card);border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:600;}
.tl-fchip.on i{background:var(--c);opacity:1;}
.tl-fchip:hover{border-color:var(--c);}
.tl-hint{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6;}
/* 数据源筛选：折叠胶囊按钮 + 下拉浮层 */
.tl-topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.tl-fwrap{position:relative;}
.tl-fbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.16s;box-shadow:var(--shadow);}
.tl-fbtn svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.tl-fbtn em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:1px 7px;}
.tl-fbtn .cr{font-size:10px;color:var(--sub);transition:transform .18s;line-height:1;}
.tl-fbtn:hover{border-color:var(--accent);}
.tl-fbtn.open{border-color:var(--accent);color:var(--accent);}
.tl-fbtn.open .cr{transform:rotate(180deg);color:var(--accent);}
.tl-fpop{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:264px;max-width:min(94vw,400px);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 10px 30px rgba(0,0,0,.11);
  animation:tlPop .16s ease;}
@keyframes tlPop{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
.tl-fpop-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:10px;}
.tl-fpop-h span[data-action]{color:var(--accent);cursor:pointer;font-weight:600;}
/* 内容卡片内部头部：视图 Tab（左） + 日期与翻页（右） */
.tl-vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.tl-vhead .seg span{padding:6px 15px;font-size:12.5px;}
.tl-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.tl-nlabel{font-size:13px;font-weight:600;color:var(--text);min-width:96px;text-align:center;letter-spacing:.2px;cursor:pointer;border-radius:10px;padding:4px 8px;transition:.15s;}
.tl-nlabel:hover{background:var(--accent-soft);color:var(--accent);}
.tl-today{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:4px 10px;cursor:pointer;font-weight:600;white-space:nowrap;}
.tl-today:hover{filter:brightness(.96);}
/* 锻炼 / 学习：卡片内联日期切换 */
.dnav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.dnav-lbl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 11px;cursor:pointer;transition:.15s;white-space:nowrap;}
.dnav-lbl svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:1.7;flex:none;}
.dnav-lbl:hover{border-color:var(--accent);color:var(--accent);}
.dnav-lbl:hover svg{stroke:var(--accent);}
/* 日视图 */
.tl-day{display:flex;flex-direction:column;gap:2px;}
.tl-allday{display:grid;grid-template-columns:52px 1fr;gap:10px;padding-bottom:10px;margin-bottom:6px;border-bottom:1px dashed var(--line);}
.tl-row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;}
.tl-hr{font-size:12px;font-weight:600;color:var(--sub);padding-top:9px;text-align:right;letter-spacing:.3px;
  border-right:1px solid var(--line);padding-right:8px;}
.tl-slot{display:flex;flex-direction:column;gap:8px;min-width:0;}
.tl-card{position:relative;background:var(--bg);border-radius:12px;padding:10px 12px 10px 13px;cursor:pointer;
  border-left:3px solid var(--c);transition:.15s;min-width:0;}
.tl-card:hover{background:var(--card);box-shadow:var(--shadow);transform:translateX(2px);}
.tl-ctop{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.tl-src{font-size:10.5px;font-weight:600;color:var(--c);background:var(--card);border-radius:5px;padding:1.5px 6px;}
.tl-ct{font-size:11px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums;}
.tl-ctitle{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-word;}
.tl-csub{font-size:11.5px;color:var(--sub);margin-top:2px;word-break:break-word;}
.tl-card.done .tl-ctitle{text-decoration:line-through;opacity:.5;}
/* 临近截止 / 逾期 视觉提醒徽标（两类任务统一使用学习计划青瓷标识色，仅以徽标区分状态） */
.tl-flag{display:inline-block;font-size:9px;font-weight:700;line-height:1;padding:2px 5px;border-radius:6px;margin-left:5px;vertical-align:middle;white-space:nowrap;}
.tl-flag.overdue{background:rgba(192,59,51,.16);color:#C0392B;}
.tl-flag.near{background:rgba(190,120,30,.18);color:#B5741A;}
.tl-pop-src .tl-flag{margin-left:6px;}
.tl-pop-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.tl-pop-actions .chip{cursor:pointer;user-select:none;}
.tl-pop-actions .chip.on-done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.tl-pop-actions .chip.act-complete{background:var(--accent);color:#fff;border-color:var(--accent);}
.tl-pop-actions .chip.act-complete.overdue{background:#C0392B;border-color:#C0392B;}
/* 总览事件浮窗 */
.tl-popover{position:fixed;z-index:70;width:280px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);
  padding:0 0 10px;}
.tl-popover-h{position:sticky;top:0;background:var(--card);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 8px;border-bottom:1px solid var(--line);margin:0 0 8px;}
.tl-popover-h b{font-size:13px;font-weight:600;color:var(--text);}
.tl-popover-h span{font-size:15px;color:var(--sub);cursor:pointer;padding:2px 4px;}
.tl-popover-h span:hover{color:var(--accent);}
.tl-popover-body{padding:0 10px;}
.tl-popover-body .empty{padding:18px 0 !important;}
.tl-popcard{position:relative;background:var(--bg);border-radius:12px;padding:10px 12px 10px 13px;margin-bottom:8px;border-left:3px solid var(--c);}
.tl-popcard:last-child{margin-bottom:0;}
.tl-pop-src{font-size:10.5px;font-weight:600;color:var(--c);background:var(--card);border-radius:5px;padding:1.5px 6px;display:inline-block;margin-bottom:3px;}
.tl-pop-title{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-word;}
.tl-pop-sub{font-size:11.5px;color:var(--sub);margin-top:3px;word-break:break-word;}
.tl-pop-actions{display:flex;gap:6px;margin-top:8px;}
.tl-pop-actions .chip{font-size:11px;padding:3px 9px;cursor:pointer;background:var(--accent-soft);color:var(--accent);border-radius:10px;font-weight:600;}
.tl-pop-actions .chip:hover{filter:brightness(.95);}
/* 周视图：横向滚动，每屏约 3 列 */
.tl-weekwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 6px;scrollbar-width:none;-ms-overflow-style:none;}
.tl-weekwrap::-webkit-scrollbar{display:none;}
.tl-weekgrid{display:flex;gap:10px;}
.tl-wcol{flex:0 0 calc((100% - 20px) / 3);min-width:calc((100% - 20px) / 3);background:var(--card);border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.tl-whead{text-align:center;padding:9px 4px 8px;border-bottom:1px solid var(--line);background:var(--bg);cursor:pointer;transition:.15s;}
.tl-whead:hover{background:var(--accent-soft);}
.tl-whead b{display:block;font-size:12.5px;font-weight:600;color:var(--text);}
.tl-whead i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:2px;}
.tl-wcol.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.tl-wcol.today .tl-whead b{color:var(--accent);}
.tl-wbody{flex:1;padding:7px 5px;display:flex;flex-direction:column;gap:7px;min-height:60px;}
.tl-emptyday{font-size:11px;color:var(--sub);text-align:center;padding:14px 0;opacity:.55;}
/* 板块分组折叠 */
.tl-wgroup{background:var(--bg);border-radius:9px;overflow:hidden;}
.tl-wgroup summary{list-style:none;cursor:pointer;}
.tl-wgroup summary::-webkit-details-marker{display:none;}
.tl-wgsum{display:flex;align-items:center;gap:6px;padding:6px 7px;font-size:11px;font-weight:600;color:var(--text);}
.tl-wgsum b{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;}
.tl-wgsum span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-wgsum i{font-style:normal;font-size:9.5px;color:var(--sub);background:var(--card);border-radius:8px;padding:1px 5px;}
.tl-wgbody{padding:0 5px 6px;display:flex;flex-direction:column;gap:4px;}
.tl-wbody .tl-card{padding:6px 8px 6px 9px;border-radius:8px;cursor:pointer;}
.tl-wbody .tl-card .tl-ctop{margin-bottom:1px;}
.tl-wbody .tl-card .tl-src{font-size:9px;padding:1px 4px;}
.tl-wbody .tl-card .tl-ctitle{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-wbody .tl-card .tl-csub{display:none;}
.tl-wmore{font-size:10px;color:var(--accent);cursor:pointer;text-align:center;padding:3px 0;font-weight:600;border-radius:6px;}
.tl-wmore:hover{background:var(--accent-soft);}
/* 当日浮窗：按板块分组折叠 */
.tl-popgroup{background:var(--bg);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.tl-popgroup:last-child{margin-bottom:0;}
.tl-popgroup summary{list-style:none;cursor:pointer;}
.tl-popgroup summary::-webkit-details-marker{display:none;}
.tl-popgsum{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line);}
.tl-popgsum b{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;}
.tl-popgsum span{flex:1;}
.tl-popgsum i{font-style:normal;font-size:10px;color:var(--sub);background:var(--card);border-radius:8px;padding:1px 6px;}
.tl-pogbody{padding:8px 10px 10px;}
/* 月视图：标准 7×N 日历网格 */
.tl-mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px;}
.tl-mhead span{text-align:center;font-size:11.5px;color:var(--sub);font-weight:600;}
.tl-mlist{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.tl-mcell{aspect-ratio:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
.tl-mcell:hover:not(.empty){background:var(--accent-soft);}
.tl-mcell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
.tl-mcell.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.tl-mcell.today .tl-mnum{color:var(--accent);font-weight:700;}
.tl-mnum{font-size:15px;font-weight:600;color:var(--text);line-height:1;}
.tl-mlun{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%;}
.tl-mdots{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:90%;min-height:5px;}
.tl-mdots i{width:5px;height:5px;border-radius:50%;display:block;}
@media(max-width:520px){
  .tl-row,.tl-allday{grid-template-columns:44px 1fr;gap:8px;}
  .tl-hr{font-size:11px;padding-right:6px;}
  .tl-mlist{gap:3px;}
  .tl-mcell{border-radius:8px;gap:2px;}
  .tl-mnum{font-size:13px;}
  .tl-mlun{font-size:8.5px;}
  .tl-mhead{gap:3px;}
  .tl-mhead span{font-size:10.5px;}
  .tl-vhead{gap:8px;}
  .tl-vhead .seg span{padding:6px 12px;font-size:12px;}
  .tl-nlabel{min-width:auto;font-size:12.5px;}
  .tl-fpop{min-width:0;width:min(92vw,340px);}
  .dnav{margin-left:auto;justify-content:flex-end;}
  .dnav-lbl{padding:4px 9px;font-size:12px;}
  .tl-weekwrap{margin:0 -2px;padding:0 2px 6px;}
  .tl-weekgrid{gap:8px;}
  .tl-wcol{flex:0 0 calc((100% - 16px) / 3);min-width:calc((100% - 16px) / 3);}
  .tl-whead{padding:7px 2px 6px;}
  .tl-whead b{font-size:11px;}
  .tl-whead i{font-size:9px;}
  .tl-wbody{padding:5px 3px;gap:5px;}
  .tl-wgsum{padding:5px 5px;font-size:10px;}
  .tl-wgsum i{padding:1px 4px;}
  .tl-wbody .tl-card{padding:5px 6px 5px 7px;}
  .tl-wbody .tl-card .tl-ctitle{font-size:9.5px;}
  .tl-wmore{font-size:9px;}
}
@media(max-width:430px){
  .card-title{flex-wrap:wrap;}
  .dnav{width:100%;margin-left:0;padding-top:4px;}
}

.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px;max-width:1080px;width:100%;margin:0 auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
.content::-webkit-scrollbar{width:8px;}
.content::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* 底部导航（手机） */
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;flex:1;user-select:none;}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--accent);}

@media(max-width:768px){
  .sidebar{display:none;}
  .tabbar{display:flex;}
  .content{padding:16px 14px 92px;}
  .header{padding:13px 16px;}
  .card{padding:14px;border-radius:14px;}
  .card-title{margin-bottom:12px;}
  .list-item{padding:12px 0;gap:8px;}
  .li-acts{gap:7px;}
  .li-acts .act{gap:1px;}
  .li-acts .act i{display:block;font-size:8.5px;white-space:nowrap;}
  .li-acts svg{width:17px;height:17px;}
  .row{gap:8px;}
  /* 防 iPhone 聚焦自动缩放：移动端表单字号≥16px */
  .input input,.input textarea,.input select,.mini-input{font-size:16px;}
  .btn{font-size:15px;}
}

/* ===== 组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:14px;}
.card-title svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.card-title .more{margin-left:auto;font-size:11px;font-weight:400;color:var(--sub);}

.btn{border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;text-align:center;user-select:none;-webkit-user-select:none;}
.btn-solid{background:var(--accent);color:#fff;}
.btn-solid:hover{filter:brightness(1.05);}
.btn-line{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn-text{background:transparent;color:var(--sub);font-weight:500;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn:active{transform:scale(.98);}

.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;}
.seg span{padding:8px 18px;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;transition:.15s;user-select:none;}
.seg span.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow);}

.input{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--sub);font-size:13px;}
.input svg{width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:1.7;stroke-linecap:round;flex:none;}
.input input,.input textarea,.input select{border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;resize:none;-webkit-appearance:none;appearance:none;border-radius:0;}
.input input::placeholder,.input textarea::placeholder{color:var(--sub);}

.chips-scroll{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips-scroll::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--bg);color:var(--sub);font-size:12.5px;border:1px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;transition:.15s;}
.chip.on,.chip.on-line{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
.chip.plus{color:var(--accent);}

.list-item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.li-main{flex:1;min-width:0;overflow:hidden;}
.li-title{font-size:14px;font-weight:500;word-break:break-word;overflow-wrap:anywhere;}
.li-sub{font-size:11.5px;color:var(--sub);margin-top:3px;}
.li-sub .tag{margin-right:4px;vertical-align:middle;}
.li-acts{display:flex;gap:13px;flex:none;align-items:flex-start;}
.li-acts .act{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.li-acts .act i{font-size:9px;color:var(--sub);font-style:normal;transition:.15s;}
.li-acts .act:hover i{color:var(--accent);}
.li-acts svg{width:16px;height:16px;stroke:#B9C6C2;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:.15s;}
.li-acts .act.ai svg,.li-acts .act:hover svg{stroke:var(--accent);}

.tag{font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--sub);border:1px solid var(--line);}
.tag.qc{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
.group-head{display:flex;align-items:center;gap:8px;padding:12px 2px 7px;position:sticky;top:0;background:var(--card);z-index:5;}
.group-head::before{content:"";width:4px;height:13px;background:var(--accent);border-radius:2px;opacity:.7;}
.group-head b{font-size:12.5px;font-weight:600;}
.group-head .cnt{font-size:10.5px;color:var(--sub);font-weight:400;}
.group-head .fold{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);cursor:pointer;user-select:none;}
.group-head .fold svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.load-hint{text-align:center;font-size:11.5px;color:var(--sub);padding:16px 0 6px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none;}
.load-hint .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.fab{position:fixed;right:18px;bottom:84px;width:46px;height:46px;border-radius:50%;background:var(--accent);
  box-shadow:0 8px 20px rgba(111,143,136,.45);display:none;align-items:center;justify-content:center;z-index:40;cursor:pointer;}
.fab.show{display:flex;}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
@media(min-width:769px){.fab{bottom:28px;right:28px;}}

/* 统计小卡 */
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{text-align:center;}
.stat b{font-size:20px;font-weight:700;color:var(--text);display:block;}
.stat i{font-size:11px;color:var(--sub);font-style:normal;margin-top:2px;display:block;}
@media(max-width:768px){.grid-2{grid-template-columns:1fr;}.grid-4{grid-template-columns:repeat(2,1fr);}}

.divider-v{width:1px;background:var(--line);align-self:stretch;}

/* 统计图表 */
.chart-title{font-size:12.5px;color:var(--sub);margin:14px 0 8px;}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 2px 0;position:relative;}
.chart-empty{display:flex;align-items:center;justify-content:center;height:110px;color:var(--sub);font-size:13px;background:var(--bg);border-radius:12px;}
.bar-track{flex:1;height:100%;background:var(--line);border-radius:6px;position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation;}
.bar-fill{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:6px 6px 0 0;opacity:.85;transition:opacity .15s;}
.bar-track:hover .bar-fill,.bar-track.active .bar-fill{opacity:1;}
.bar-labels{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--sub);}
.bar-labels span{flex:1;text-align:center;}
.y-axis{position:absolute;left:0;top:0;bottom:24px;width:28px;display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--sub);pointer-events:none;}
.y-axis span{text-align:right;padding-right:4px;}
.chart-tooltip{position:fixed;z-index:100;background:var(--text);color:var(--bg);font-size:12px;padding:7px 11px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:var(--shadow);}
.chart-tooltip.show{opacity:1;}
.chart-tooltip::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border-width:5px 5px 0;border-style:solid;border-color:var(--text) transparent transparent;}
.cat-ratio .row{align-items:center;margin-bottom:8px;}
.cat-ratio .bar-bg{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.cat-ratio .bar-fill-i{display:block;height:100%;background:var(--accent);}
.cat-ratio .name{width:60px;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-ratio .val{width:44px;text-align:right;font-size:11px;color:var(--sub);}
.import-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:12px;margin-top:8px;}
.import-item .info{flex:1;min-width:0;}
.import-item .name{font-size:13px;font-weight:500;}
.import-item .sub{font-size:11px;color:var(--sub);margin-top:2px;}
.unbind-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;transition:.15s;flex:none;}
.unbind-btn:hover{border-color:#d48a8a;color:#c75b5b;}
.unbind-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* 多选标签 */
.tags-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.tagpick{padding:9px 15px;border-radius:12px;background:var(--bg);color:var(--sub);font-size:13px;cursor:pointer;border:1px solid transparent;user-select:none;transition:.15s;}
.tagpick.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}

/* 倒数日 */
.pin-card{text-align:center;padding:28px 16px 24px;position:relative;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin-bottom:16px;}
.pin-card .pin-flag{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--accent);}
.pin-card .pin-flag svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;}
.pin-card .big{font-size:54px;font-weight:700;color:var(--accent);margin:10px 0 2px;}
.pin-card .big small{font-size:15px;font-weight:500;color:var(--sub);margin-left:4px;}
.near-hi{background:var(--accent-soft)!important;}
.cd-item{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;}
.cd-item.past{background:var(--accent-soft);}
.cd-item.past .li-title{color:var(--accent);}
.cd-item.dragging{box-shadow:0 6px 18px rgba(0,0,0,.14);background:var(--card);touch-action:none;}

/* 时间索引条（PC） */
.time-index{width:84px;flex:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 0;display:flex;flex-direction:column;align-items:center;}
.time-index .ti-title{font-size:10px;color:var(--sub);letter-spacing:1px;margin-bottom:12px;}
.ti-rail{width:3px;flex:1;background:var(--line);border-radius:2px;position:relative;min-height:360px;}
.ti-node{position:absolute;left:50%;transform:translate(-50%,-50%);}
.ti-node i{width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid #C7D2CE;display:block;}
.ti-node span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:9.5px;color:var(--sub);white-space:nowrap;}
.ti-node.on i{border-color:var(--accent);background:var(--accent);}
.ti-node.on span{color:var(--accent);font-weight:600;}
.ti-thumb{position:absolute;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent);}
.pc-flex{display:flex;gap:16px;align-items:flex-start;}
@media(min-width:769px){.pc-flex>.card{margin-bottom:0;}.pc-flex .time-index{flex:none;}}
@media(max-width:768px){.pc-flex{flex-direction:column;align-items:stretch;}.pc-flex>.card{width:100%;min-width:0;}.time-index{display:none;}}

/* 模态框 */
.overlay{position:fixed;inset:0;background:rgba(20,30,28,.42);display:none;align-items:flex-end;justify-content:center;z-index:60;}
.overlay.show{display:flex;}
.cal-overlay{position:fixed;inset:0;background:rgba(20,30,28,.42);display:none;align-items:flex-end;justify-content:center;z-index:70;}
.cal-overlay.show{display:flex;}
@media(min-width:769px){.overlay{align-items:center;}.cal-overlay{align-items:center;}}
.modal{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:90dvh;overflow-y:auto;}
@media(min-width:769px){.modal{border-radius:20px;}}
.modal h3{font-size:17px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
.field .input{width:100%;}
.field textarea{min-height:74px;line-height:1.6;}
.prio-pick{display:flex;gap:10px;}
.prio-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--sub);}
.prio-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
.dot{width:11px;height:11px;border-radius:50%;flex:none;}
.dot-h{background:var(--accent);}
.dot-m{border:2px solid var(--accent);background:transparent;}
.dot-l{background:transparent;border:2px solid #C7D2CE;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-actions .btn{flex:1;}

.empty{text-align:center;color:var(--sub);font-size:13px;padding:26px 0;}
.muted{color:var(--sub);}
.tiny{font-size:11px;color:var(--sub);}
.center{text-align:center;}
.row{display:flex;gap:10px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.pill{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:8px;}
.st-badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;vertical-align:middle;}
.st-badge.daily{color:#3E7C5A;background:rgba(62,124,90,.12);}
.st-badge.deadline{color:#7E6BB0;background:rgba(126,107,176,.14);}
img.att{width:46px;height:46px;border-radius:10px;object-fit:cover;margin-top:6px;}

/* 只读打卡标签（历史日期） */
.tagpick.ro{opacity:.5;cursor:default;}

/* 二级详情页：返回条 + 富文本画布 */
.detail-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:10px;user-select:none;transition:.15s;}
.back-btn:hover{background:var(--accent-soft);}
.back-btn svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.rich-editor{flex:1;min-height:320px;outline:none;font-size:14px;line-height:1.9;padding:6px 2px;word-break:break-word;}
.rich-editor ul,.rich-editor ol{padding-left:22px;margin:6px 0;}
.rt-bar{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 4px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch;}
.rt-bar::-webkit-scrollbar{display:none;}
.rt-btn{flex:none;display:flex;align-items:center;justify-content:center;gap:3px;min-width:32px;height:30px;padding:0 7px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--text);user-select:none;white-space:nowrap;}
.rt-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.rt-btn:hover{background:var(--card);}
.rt-btn.on{background:rgba(111,143,136,.14);color:var(--accent);font-weight:600;}
.rt-sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 3px;}
.rt-lab{flex:none;font-size:11px;color:var(--sub);padding:0 2px;white-space:nowrap;}
.rich-editor:empty:before{content:attr(data-ph);color:var(--sub);pointer-events:none;}
.rich-editor img{max-width:100%;border-radius:12px;margin:8px 0;display:block;box-shadow:var(--shadow);}
.rich-editor font[size="2"]{font-size:12px;}
.rich-editor font[size="3"]{font-size:14px;}
.rich-editor font[size="5"]{font-size:18px;}
.note-title-input{border:none;background:transparent;outline:none;font-size:19px;font-weight:700;color:var(--text);width:100%;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px;font-family:inherit;}
.memo-title{border:none;background:transparent;outline:none;font-size:20px;font-weight:700;color:var(--text);width:100%;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:8px;font-family:inherit;}
.memo-title::placeholder{color:var(--sub);opacity:.55;}
.note-title-input::placeholder{color:var(--sub);font-weight:500;}
.mini-input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;}
.menu-item{display:flex;align-items:center;gap:10px;padding:14px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;transition:.15s;}
.menu-item:hover{color:var(--accent);}
.menu-item:last-of-type{border-bottom:none;}
.menu-item svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.menu-item .mi-sub{font-size:11px;color:var(--sub);margin-top:2px;}
/* ===== 移动端汉堡抽屉导航（方案一） ===== */
.menu-btn{display:none;}
.side-mask{display:none;position:fixed;inset:0;background:rgba(42,51,49,.42);z-index:40;}
.side-mask.show{display:block;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100dvh;z-index:50;display:flex;transform:translateX(-100%);transition:transform .26s ease;box-shadow:0 10px 40px rgba(0,0,0,.18);}
  .sidebar.open{transform:none;}
  .menu-btn{display:flex;}
  .tabbar{display:none;}            /* 底部 Tab 完全移除，改用汉堡抽屉 */
  .header{padding:13px 16px;gap:10px;}
  .header h1{font-size:16px;}
}

/* ===== 每日记账模块 ===== */
.seg .on{background:var(--accent);color:#fff;}
.ac-type{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;}
.ac-type .ac-t{font-size:13px;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--sub);font-weight:600;transition:.15s;user-select:none;}
.ac-type .ac-t.on{background:var(--accent);color:#fff;}
.ac-type .ac-t.exp.on{background:#C97B6E;}     /* 支出用偏暖青瓷红 */
.ac-amount{font-size:30px;font-weight:700;color:var(--text);width:100%;border:none;background:transparent;outline:none;font-family:inherit;margin-bottom:12px;font-variant-numeric:tabular-nums;}
.ac-amount::placeholder{color:var(--sub);font-weight:500;}
.ac-cats{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-bottom:12px;}
.ac-cats::-webkit-scrollbar{display:none;}
.ac-cat{flex:none;padding:9px 15px;border-radius:12px;background:var(--bg);color:var(--sub);font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap;user-select:none;transition:.15s;}
.ac-cat.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
.ac-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.ac-row .input{flex:1;}
.bill-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.bill-item:last-child{border-bottom:none;}
.bill-amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:88px;text-align:right;}
.bill-amt.in{color:var(--accent);}
.bill-amt.out{color:#C97B6E;}
.bill-meta{flex:1;min-width:0;}
.bill-cat{font-size:14px;font-weight:600;color:var(--text);}
.bill-sub{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bill-sub .auto-tag{color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:4px;}
.bill-acts{display:flex;gap:10px;flex:none;}
.bill-acts .act{display:flex;align-items:center;gap:3px;color:var(--sub);cursor:pointer;font-size:11px;user-select:none;}
.bill-acts .act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.bill-acts .act.del:hover{color:#C97B6E;}
.bill-acts .act.edt:hover{color:var(--accent);}
.ac-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px;}
.ac-stat{text-align:center;background:var(--bg);border-radius:14px;padding:12px 6px;}
.ac-stat b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.ac-stat i{font-style:normal;font-size:11px;color:var(--sub);}
.ac-stat.bal b{color:var(--accent);}
/* 收支双柱趋势 */
.acct-trend{display:flex;align-items:flex-end;gap:5px;height:120px;padding:8px 2px 0;position:relative;}
.acct-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation;min-width:0;}
.acct-col .bc{width:42%;max-width:14px;border-radius:5px 5px 0 0;opacity:.85;transition:opacity .15s;position:relative;}
.acct-col .bc.in{background:var(--accent);}
.acct-col .bc.out{background:#C97B6E;}
.acct-col:hover .bc,.acct-col.active .bc{opacity:1;}
.acct-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:8px;}
.acct-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle;}
.ac-summary{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sub);margin:6px 0 14px;flex-wrap:wrap;}
.ac-summary b{color:var(--text);}
.acct-panel .acct-list-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
.acct-panel .acct-list-item:last-child{border-bottom:none;}
.acct-name{flex:1;font-size:14px;font-weight:600;color:var(--text);}
/* 环形饼图（支出分类 / 账户分布） */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0;}
.donut{display:block;max-width:60%;height:auto;}
.donut path{cursor:pointer;touch-action:manipulation;transition:opacity .15s;}
.donut path:hover{opacity:.82;}
.donut-legend{width:100%;display:flex;flex-direction:column;gap:7px;}
.donut-lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);}
.donut-lg i{width:11px;height:11px;border-radius:3px;flex:none;}
.donut-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.donut-val{font-variant-numeric:tabular-nums;font-weight:600;}
.acct-bal{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px;text-align:right;}
.acct-bal.neg{color:#C97B6E;}
.acct-tpl{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);}
.acct-tpl:last-child{border-bottom:none;}
.acct-tpl .tpl-main{flex:1;min-width:0;}
.acct-tpl .tpl-t{font-size:13.5px;font-weight:600;color:var(--text);}
.acct-tpl .tpl-s{font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acct-tpl .tpl-amt{font-weight:700;font-variant-numeric:tabular-nums;}
.acct-tpl .tpl-amt.in{color:var(--accent);}
.acct-tpl .tpl-amt.out{color:#C97B6E;}
/* 开关 */
.switch{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none;}
.switch.on{background:var(--accent);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on::after{left:21px;}
/* 回收站勾选控件 */
.chk{display:inline-flex;align-items:center;cursor:pointer;user-select:none;}
.chk input{position:absolute;opacity:0;width:0;height:0;}
.chk span{width:20px;height:20px;border-radius:7px;border:2px solid var(--bg);background:var(--card);display:inline-block;position:relative;transition:.15s;flex:none;}
.chk input:checked+span{background:var(--accent);border-color:var(--accent);}
.chk input:checked+span::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
/* 回收站分组与条目 */
.trash-group{margin-bottom:14px;}
.trash-group-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.trash-group-title .cnt{font-size:11px;font-weight:400;color:var(--sub);background:var(--bg);padding:1px 8px;border-radius:10px;}
.trash-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:14px;margin-bottom:8px;}
.trash-item .trash-info{flex:1;min-width:0;}
.trash-item .trash-name{font-size:13.5px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trash-item .trash-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
.trash-item .trash-acts{display:flex;gap:8px;flex:none;}
.trash-acts .btn{margin:0;padding:7px 12px;font-size:12.5px;}
.trash-bar{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bg);}
.trash-bar .btn{margin:0;}
/* 倒数日：置顶标签 / 批量 / 搜索 / 加载更多 */
.pin-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;flex:none;line-height:1;}
.pin-tag svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.pinned-item{box-shadow:0 0 0 2px var(--pc,var(--accent)) inset;}
.cd-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.cd-toolbar .search-i{flex:1;margin:0;}
.search-i{position:relative;display:flex;align-items:center;}
.search-i svg{width:16px;height:16px;fill:none;stroke:var(--sub);stroke-width:2;margin-left:12px;flex:none;}
.search-i input{border:none;outline:none;background:transparent;flex:1;padding:11px 12px 11px 8px;color:var(--text);font-size:14px;}
.list-item .li-title .pin-tag{margin-right:2px;}
.pin-tag:empty{width:11px;height:11px;padding:0;border-radius:50%;}
.batch-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;border:1px solid var(--bg);}
.batch-bar .tiny{color:var(--sub);font-size:12px;}
.more-btn{text-align:center;padding:13px;margin-top:10px;color:var(--accent);font-size:13px;cursor:pointer;border:1px dashed var(--bg);border-radius:12px;background:var(--card);}
.more-btn:active{background:var(--bg);}
.pin-colors{display:flex;gap:10px;flex-wrap:wrap;}
.cat-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2px;}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;background:var(--card);color:var(--text);}
.cat-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:13px;line-height:1;color:var(--sub);cursor:pointer;user-select:none;}
.cat-x:hover{background:var(--bg);color:#B0736F;}
.pc-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:.15s;}
.pc-dot.on{border-color:var(--text);transform:scale(1.08);}
.action-count{font-size:11px;color:var(--sub);}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">青 <em>瓷</em></div>
    <div class="side-item" data-nav="timeline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>总览</div>
    <div class="side-item" data-nav="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>计时器</div>
    <div class="side-item" data-nav="countdown"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>倒数日</div>
    <div class="side-item" data-nav="workout"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M2.5 9.5v5M21.5 9.5v5M6.5 12h11"/></svg>锻炼计划</div>
    <div class="side-item" data-nav="study"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>学习计划</div>

let timerInt=null;

/* ===================== 计时器 ===================== */
function timerTick(){
  const tm=state.timer;if(!tm.running)return;
  const now=Date.now();
  const delta=Math.floor((now-tm.last)/1000);
  if(delta<=0)return;
  if(tm.mode==="up")tm.elapsed+=delta;
  else{
    tm.elapsed-=delta;
    if(tm.elapsed<=0){tm.elapsed=0;timerStop(true);return;}
  }
  tm.last=now;
  const el=$("#timerBig");if(el)el.textContent=fmt(tm.elapsed);
  const st=$("#timerState");if(st)st.textContent=(tm.mode==="up"?"正计时":"倒计时")+(tm.running?"进行中":"已暂停");
}
function timerStart(){
  const tm=state.timer;
  if(tm.running)return;
  tm.running=true;tm.last=Date.now();
  if(!tm.id)tm.id=uid();
  timerInt=setInterval(timerTick,1000);
  render();
}
function timerPause(){
  const tm=state.timer;if(!tm.running)return;
  tm.running=false;clearInterval(timerInt);timerInt=null;render();
}
function timerStop(auto){
  const tm=state.timer;if(!tm.running&&tm.elapsed===0&&!auto)return;
  clearInterval(timerInt);timerInt=null;
  if(tm.elapsed>0){
    store.timers.unshift({id:tm.id||uid(),name:tm.name||(tm.mode==="up"?"正计时记录":"倒计时记录"),mode:tm.mode,duration:tm.elapsed,date:todayStr(),ts:Date.now(),archived:false,importedBy:[]});
    save();
  }
  state.timer={running:false,mode:tm.mode,name:"",elapsed:0,last:0,cdMin:tm.cdMin,id:null};
  render();
}
/* 切回页面/解锁屏幕时立即根据真实时间校准计时器，弥补移动端后台冻结/节流导致的丢失 */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.timer.running)timerTick();});
function timerDisplay(){
  const tm=state.timer;
  return `<div class="card" style="text-align:center;padding:34px 16px 28px;">
    <div style="font-size:11px;color:var(--sub);letter-spacing:2px;" id="timerState">${tm.mode==="up"?"正计时":"倒计时"}${tm.running?"进行中":"待开始"}</div>
    <div style="font-size:54px;font-weight:700;letter-spacing:2px;margin:14px 0 6px;font-variant-numeric:tabular-nums;" id="timerBig">${fmt(tm.elapsed)}</div>
    ${tm.mode==="down"?`<div class="tiny">倒计时目标：${tm.cdMin} 分钟</div>`:`<div class="tiny">点击开始即记录本次计时</div>`}
  </div>`;
}
function timerControls(){
  const tm=state.timer;
  if(tm.running){
    return `<div class="row" style="margin-bottom:6px;gap:10px;">
      <div class="btn btn-line" style="flex:1;" data-action="timer-pause">暂停</div>
      <div class="btn btn-solid" style="flex:1;" data-action="timer-stop">结束保存</div>
    </div>`;
  }
  return `<div class="row" style="margin-bottom:6px;gap:10px;">
    <div class="btn btn-solid" style="flex:1;" data-action="timer-start">开始</div>
    <div class="btn btn-line" style="flex:1;color:var(--sub);border-color:var(--line);" data-action="timer-pause">${tm.elapsed>0?"继续":"重置"}</div>
    <div class="btn btn-text" style="flex:1;" data-action="timer-stop">结束保存</div>
  </div>`;
}
function filteredTimers(){
  let list=store.timers.slice().sort((a,b)=>b.ts-a.ts);
  const f=state.histFilter;const q=(state.histQ||"").trim().toLowerCase();
  if(f==="archived")list=list.filter(t=>t.archived);else list=list.filter(t=>!t.archived);
  if(f==="today")list=list.filter(t=>dayDiff(t.date)===0);
  else if(f==="week")list=list.filter(t=>dayDiff(t.date)>=0&&dayDiff(t.date)<=6);
  else if(f==="earlier")list=list.filter(t=>dayDiff(t.date)>6);
  if(q)list=list.filter(t=>(t.name||"").toLowerCase().includes(q)||(t.date||"").includes(q));

}

      ${batchBar}

function afterTimer(){
  // 懒加载：滚动到底部自动加载
  const view=$("#view");
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting&&state.page==="timer"){const more=$('[data-action="hist-more"]');if(more)histMore();}});},{root:view,rootMargin:"600px"});
  const sentinel=$('[data-action="hist-more"]');if(sentinel)io.observe(sentinel);
}
function histMore(){state.histPage++;render();}
function timerListInner(){
  const total=filteredTimers().length;
  const shown=Math.min(total,(state.histPage+1)*20);
  const list=filteredTimers().slice(0,shown);
  const groups={};
  list.forEach(t=>{(groups[groupOf(t.date)]=groups[groupOf(t.date)]||[]).push(t);});
  const order=["今日","昨天","上周","更早"];
  let html="";
  order.forEach(g=>{if(groups[g]){
    const folded=state.histFold[g]===undefined?(g!=="今日"):state.histFold[g];
    html+=`<div class="group-head" data-g="${g}"><b>${g}</b><span class="cnt">${groups[g].length} 条</span><span class="fold" data-action="hist-fold" data-g="${g}">${folded?'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>'}</span></div>`;
    if(!folded)html+=groups[g].map(timerItem).join("");
  }});
  if(!total)html=`<div class="empty">暂无计时记录</div>`;
  const hint=shown<total?`<div class="load-hint" data-action="hist-more"><span class="spin"></span>加载中 · 已展示 ${shown} / ${total} 条，点击或滚动加载更多</div>`:`<div class="load-hint">已展示全部 ${total} 条</div>`;
  return html+hint;
}
function renderTimerListOnly(){const el=$("#histList");if(el)el.innerHTML=timerListInner();afterTimer();}
function timerSelAllChecked(){const total=filteredTimers().length;const shown=Math.min(total,(state.histPage+1)*20);const list=filteredTimers().slice(0,shown);return list.length>0&&list.every(t=>state.timerSel.includes(t.id));}
function timerIndexHtml(){
  const dates=[...new Set(store.timers.map(t=>t.date))].sort((a,b)=>b.localeCompare(a)).slice(0,7);

}

/* ===================== 倒数日 ===================== */

function secToEndOfDay(dateStr){const end=new Date(dateStr+"T23:59:59");return Math.max(0,Math.floor((end-new Date())/1000));}
function cdDaysLabel(c){
  const d=daysBetween(todayStr(),c.target);
  if(d<0){const past=Math.abs(d)+(c.pastMode?1:0);return {past:true,text:String(past),sub:"已经"};}
  if(d===0)return {past:false,today:true,text:fmt(secToEndOfDay(todayStr())),tick:true,sub:"今日 · 距结束"};
  return {past:false,today:false,text:String(d),sub:"距离还有",near:d>=0&&d<=3};
}
/* 复制到剪贴板（含降级方案） */
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok?"已复制到剪贴板":"复制失败");
  }catch(err){toast("复制失败");}
}
function copyToClipboard(text){
  if(!text){toast("没有可复制的内容");return;}
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function cdCopyText(c){
  const L=cdDaysLabel(c);

  return `${c.title}${c.yearly?"（每年）":""} · ${c.target}${c.note?" · "+c.note:""} · ${tail}`;
}

/* 拖拽排序（长按整张卡片） */
let cdDrag=null, cdJustDragged=false;
function cdCanDrag(t){if(!t||typeof t.closest!=="function")return null; if(t.closest(".li-acts")||t.closest(".chk")||t.closest("input")||t.closest("a")||t.closest("button"))return null; return t.closest(".cd-item");}
function cdStartDrag(item,x,y,pointerId){
  cdDrag={el:item,started:true,x:x,y:y,pointerId:pointerId};
  item.classList.add("dragging");item.style.opacity=".55";item.style.pointerEvents="none";
  try{item.setPointerCapture(pointerId);}catch(_){}
  toast("拖动排序（松手保存）");
}
function cdPointerDown(e){
  if(state.cdBatch)return;
  if(cdTouch&&cdTouch.item)return; // 移动端 touch 回退已接管
  const item=cdCanDrag(e.target); if(!item||!item.dataset.cdId)return;
  if(cdDrag){cdEnd();}
  cdDrag={el:item,started:false,longTimer:null,x:e.clientX,y:e.clientY,pointerId:e.pointerId};
  cdDrag.longTimer=setTimeout(()=>{
    if(cdDrag&&cdDrag.el===item&&!cdDrag.started)cdStartDrag(item,e.clientX,e.clientY,e.pointerId);
  },450);
}
function cdPointerMove(e){
  if(!cdDrag)return;
  if(!cdDrag.started){
    if(Math.abs(e.clientX-cdDrag.x)>8||Math.abs(e.clientY-cdDrag.y)>8){clearTimeout(cdDrag.longTimer);cdDrag=null;}
    return;
  }
  e.preventDefault();
  const el=cdDrag.el;
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tItem=under&&under.closest?under.closest(".list-item.cd-item"):null;
  if(tItem&&tItem!==el&&tItem.dataset.cdId){
    const r=tItem.getBoundingClientRect();
    const after=(e.clientY-(r.top+r.height/2))>0;
    el.parentNode.insertBefore(el, after?tItem.nextSibling:tItem);
  }
}
function cdEnd(){
  if(!cdDrag)return;
  clearTimeout(cdDrag.longTimer);
  if(cdDrag.started){
    const el=cdDrag.el; el.classList.remove("dragging"); el.style.opacity="";el.style.pointerEvents="";

function periodName(p){return {week:"本周",month:"本月",year:"本年"}[p]||"";}
function rangeBy(dateStr,period){
  if(period==="day")return [dateStr,dateStr];

  if(period==="month")return monthRange(dateStr);

function fmtHours(sec){sec=Math.max(0,sec);const h=sec/3600;return h>=1?h.toFixed(1)+"h":Math.round(sec/60)+"min";}

function trendData(dateStr,period,source){
  const [s,e]=rangeBy(dateStr,period);
  let labels=[],values=[],tips=[],xLabels=[];
  const label=(ds)=>mdLabel(ds), tipPre=source==="workout"?"训练时长":"专注学习时长";
  if(period==="week"){
    const days=weekOf(dateStr);
    labels=days.map(ds=>WD[new Date(ds+"T00:00:00").getDay()]);
    xLabels=days.map(label);
    values=days.map(ds=>source==="workout"
      ?store.workouts.filter(w=>w.date===ds&&w.tags&&w.tags.length>0).reduce((a,w)=>a+(w.duration||0),0)
      :store.timers.filter(t=>t.date===ds&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0));
    tips=days.map((ds,i)=>`${xLabels[i]} · ${tipPre} ${fmtHours(values[i])}`);
  }else if(period==="month"){
    const y=Number(dateStr.split("-")[0]),m=Number(dateStr.split("-")[1])-1;
    const dc=new Date(y,m+1,0).getDate();
    labels=Array.from({length:dc},(_,i)=>{const day=i+1;return (day===1||day%5===0||day===dc)?String(day):"";});
    xLabels=Array.from({length:dc},(_,i)=>`${m+1}月${i+1}日`);
    values=Array.from({length:dc},(_,i)=>{
      const ds=`${y}-${pad(m+1)}-${pad(i+1)}`;
      return source==="workout"
        ?store.workouts.filter(w=>w.date===ds&&w.tags&&w.tags.length>0).reduce((a,w)=>a+(w.duration||0),0)
        :store.timers.filter(t=>t.date===ds&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0);
    });
    tips=labels.map((d,i)=>`${xLabels[i]} · ${tipPre} ${fmtHours(values[i])}`);
  }else{
    const y=Number(dateStr.split("-")[0]);
    labels=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    xLabels=labels;
    values=labels.map((_,i)=>{
      const ms=`${y}-${pad(i+1)}-01`,me=`${y}-${pad(i+1)}-${pad(new Date(y,i+1,0).getDate())}`;
      return source==="workout"
        ?store.workouts.filter(w=>w.date>=ms&&w.date<=me&&w.tags&&w.tags.length>0).reduce((a,w)=>a+(w.duration||0),0)
        :store.timers.filter(t=>t.date>=ms&&t.date<=me&&t.importedBy.includes("study")).reduce((a,t)=>a+t.duration,0);
    });
    tips=labels.map((lb,i)=>`${lb} · ${tipPre}总时长 ${fmtHours(values[i])}`);
  }
  const title=source==="workout"
    ?(period==="week"?"本周时长趋势":period==="month"?"本月时长趋势":"本年时长趋势")
    :(period==="week"?"本周学习趋势":period==="month"?"本月学习趋势":"本年学习趋势");
  return {labels,values,tips,xLabels,title};
}

/* 环形饼图：entries=[{name,value}]（value 可为负，扇形面积取绝对值，图例显示真实正负） */
function donutChartHtml(entries,emptyText,valFmt){
  const f=valFmt||fmtMoney;

  if(!list.length)return `<div class="chart-empty">${emptyText}</div>`;
  const total=list.reduce((a,e)=>a+Math.abs(e.value),0)||1;
  const cx=80,cy=80,rO=72,rI=44;
  let ang=-Math.PI/2, paths="";
  list.forEach((e,i)=>{
    const frac=Math.abs(e.value)/total, a2=ang+frac*Math.PI*2;
    const large=(a2-ang)>Math.PI?1:0;
    const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
    const [x1,y1]=p(rO,ang),[x2,y2]=p(rO,a2),[x3,y3]=p(rI,a2),[x4,y4]=p(rI,ang);
    paths+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z" fill="${ACCT_PALETTE[i%ACCT_PALETTE.length]}" data-tip="${esc(e.name)} · ${f(e.value)}"></path>`;
    ang=a2;
  });
  const legend=list.map((e,i)=>`<div class="donut-lg"><i style="background:${ACCT_PALETTE[i%ACCT_PALETTE.length]}"></i><span class="donut-name">${esc(e.name)}</span><span class="donut-val" style="color:${e.value<0?'#C97B6E':'var(--accent)'}">${f(e.value)}</span></div>`).join("");

function filteredStudies(){
  const sv=state.studyView||"all";
  let list=store.studies.slice();
  if(sv==="todo")list=list.filter(s=>!s.archived&&!s.done);
  else if(sv==="archived")list=list.filter(s=>s.archived);
  else list=list.filter(s=>!s.archived);
  if(state.stQ){const q=state.stQ.toLowerCase();list=list.filter(s=>(s.title||"").toLowerCase().includes(q)||(s.deadline||"").includes(q));}
  const isDone=s=> s.type==="daily"?!!(s.checkins&&s.checkins[todayStr()]):!!s.done;
  return list.sort((a,b)=>{const o={high:0,mid:1,low:2};return (isDone(a)?1:0)-(isDone(b)?1:0)||o[a.priority]-o[b.priority];});
}
function studyListInner(){
  const batch=state.stBatch;
  const list=filteredStudies();
  const prioDot={high:'<span class="dot dot-h"></span>',mid:'<span class="dot dot-m"></span>',low:'<span class="dot dot-l"></span>'};
  const unbindAct=s=> s.timerId?`<span class="act" data-action="st-unbind" data-id="${s.id}" title="移除计时"><svg><path d="M18 6L6 18M6 6l12 12"/></svg><i>移除</i></span>`:"";
  const typeBadge=s=> s.type==="daily"
    ? `<span class="st-badge daily">🔁 长期打卡</span>`
    : `<span class="st-badge deadline">📌 限期作业</span>`;
  const subLine=s=>{
    if(s.type==="daily")return `生效 ${s.rangeStart||"即日起"}${s.rangeEnd?(" ~ "+s.rangeEnd):" ~ 长期有效"}${Object.keys(s.checkins||{}).length?(" · 已打卡 "+Object.keys(s.checkins).length+" 天"):""}`;
    return `建议 ${s.suggestStart||"即日起"}${s.deadline?(" → 截止 "+s.deadline):" → 无截止"}`;
  };
  const primaryAct=s=>{
    if(s.type==="daily"){
      const ck=!!(s.checkins&&s.checkins[todayStr()]);
      return `<span class="act" data-action="st-checkin" data-id="${s.id}" data-date="${todayStr()}" title="${ck?"取消今日打卡":"今日打卡"}"><svg><path d="M20 6L9 17l-5-5"/></svg><i>${ck?"已打卡":"打卡"}</i></span>`;
    }
    return `<span class="act" data-action="st-done" data-id="${s.id}" title="${s.done?"取消完成":"完成"}"><svg><path d="M20 6L9 17l-5-5"/></svg><i>${s.done?"取消":"完成"}</i></span>`;
  };
  const taskActs=s=>{
    const arc=`<span class="act" data-action="st-arc" data-id="${s.id}" title="${s.archived?"恢复待办":"归档"}"><svg><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M1 4h22v4H1z"/><path d="M10 12h4"/></svg><i>${s.archived?"恢复":"归档"}</i></span>`;
    const editDel=`<span class="act" data-action="st-edit" data-id="${s.id}" title="编辑"><svg><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><i>编辑</i></span>
      <span class="act" data-action="st-del" data-id="${s.id}" title="删除"><svg><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><i>删除</i></span>`;
    const imp=!s.timerId?`<span class="act ai" data-action="st-import" data-id="${s.id}" title="导入计时"><svg><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><i>导入</i></span>`:"";
    return `<div class="li-acts">${primaryAct(s)}${unbindAct(s)}${imp}${editDel}${arc}</div>`;
  };
  const item=s=>{
    const chk=batch?`<label class="chk" style="margin-right:10px;flex:none;"><input type="checkbox" data-action="st-check" data-id="${s.id}" ${state.stSel.includes(s.id)?"checked":""}><span></span></label>`:"";
    const isDone=s.type==="daily"?!!(s.checkins&&s.checkins[todayStr()]):!!s.done;
    return `<div class="list-item" style="${isDone?"opacity:.55;":""}">
      ${chk}<div class="li-main"><div class="li-title">${prioDot[s.priority]} ${esc(s.title)} ${typeBadge(s)} ${isDone?'<span class="pill">'+(s.type==="daily"?"今日已打卡":"已完成")+'</span>':""}</div>
        <div class="li-sub">${subLine(s)}${s.duration?(" · 已学 "+fmt(s.duration)):""}${s.timerId?" · 已关联计时":""}</div></div>
      ${taskActs(s)}
    </div>`;
  };
  const batchBar=batch?`<div class="batch-bar" style="margin-bottom:10px;">
    <label class="chk"><input type="checkbox" data-action="st-all" ${list.length&&list.every(s=>state.stSel.includes(s.id))?"checked":""}><span></span></label>

  </div>`:"";
  if(!list.length)return batchBar+`<div class="empty">${state.stQ?"无匹配任务":"暂无学习任务"}</div>`;
  return batchBar+list.map(item).join("");
}

/* ===================== 学习笔记目录 + 详情二级页 ===================== */
const NOTE_BASE_CATS=["英语","阅读"];
function noteCats(){return [...new Set([...NOTE_BASE_CATS,...store.notes.map(n=>n.category)])];}
function filteredNotes(){
  let list=store.notes.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(state.noteArchived)list=list.filter(n=>n.archived);
  else list=list.filter(n=>!n.archived);
  if(state.noteCat!=="all")list=list.filter(n=>n.category===state.noteCat);
  if(state.noteQ){const q=state.noteQ;list=list.filter(n=>(n.title||"").includes(q)||(n.content||"").includes(q));}
  return list;
}
function noteListInner(){
  const batch=state.noteBatch;
  const list=filteredNotes();
  const shown=Math.min(list.length,(state.notePage+1)*20);
  const view=list.slice(0,shown);
  const groups={};view.forEach(n=>{(groups[n.date]=groups[n.date]||[]).push(n);});
  const gkeys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const item=n=>{
    const chk=batch?`<label class="chk" style="margin-right:10px;flex:none;"><input type="checkbox" data-action="note-check" data-id="${n.id}" ${state.noteSel.includes(n.id)?"checked":""}><span></span></label>`:"";
    const acts=!batch?`<div class="li-acts">
      <span class="act" data-action="nt-arc" data-id="${n.id}" title="${n.archived?"取消归档":"归档"}"><svg><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M1 4h22v4H1z"/><path d="M10 12h4"/></svg><i>${n.archived?"还原":"归档"}</i></span>
      <svg style="width:15px;height:15px;stroke:var(--sub);fill:none;stroke-width:1.8;align-self:center;" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>`:"";
    return `<div class="list-item" ${batch?'':`style="cursor:pointer;" data-action="nt-open" data-id="${n.id}"`}>
      ${chk}<div class="li-main"><div class="li-title">${esc(n.title||"未命名笔记")} <span class="tag qc">${esc(n.category)}</span></div>
        <div class="li-sub">${n.date} · ${esc((n.content||"").replace(/\n/g," ").slice(0,42))}${(n.content||"").length>42?"…":""}</div></div>
      ${acts}
    </div>`;
  };
  const batchBar=batch?`<div class="batch-bar" style="margin-bottom:10px;">
    <label class="chk"><input type="checkbox" data-action="note-all" ${view.length&&view.every(n=>state.noteSel.includes(n.id))?"checked":""}><span></span></label>
    <span class="tiny">已选 ${state.noteSel.length}</span>
    <div style="flex:1;"></div>
    <div class="btn btn-line btn-sm" data-action="note-arc-sel">归档</div>
    <div class="btn btn-line btn-sm" data-action="note-del-sel" style="color:#B0736F;border-color:#B0736F;">删除</div>
  </div>`:"";
  let html="";
  gkeys.forEach(d=>{html+=`<div class="group-head"><b>${d}</b><span class="cnt">${groups[d].length} 篇</span></div>`+groups[d].map(item).join("");});
  if(!view.length)html=`<div class="empty">${state.noteArchived?"暂无归档笔记":"还没有笔记，点右上角「新建笔记」开始书写"}</div>`;
  html+=shown<list.length?`<div class="load-hint" data-action="note-more"><span class="spin"></span>已展示 ${shown} / ${list.length} 篇，点击加载更多</div>`:(list.length?`<div class="load-hint">已展示全部 ${list.length} 篇</div>`:"");
  return batchBar+html;
}
function renderNoteListOnly(){const el=$("#noteList");if(el)el.innerHTML=noteListInner();}
function noteDirHtml(){
  const catChips=["all",...noteCats()].map(c=>`<span class="chip ${!state.noteArchived&&state.noteCat===c?"on":""}" data-nc="${c}">${c==="all"?"全部":esc(c)}</span>`).join("")
    +`<span class="chip ${state.noteArchived?"on":""}" data-nc="__arc">已归档</span>`;

    <div class="input" style="margin-bottom:10px;"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg><input id="noteSearch" placeholder="全文搜索笔记标题与内容" value="${esc(state.noteQ)}"></div>

function curEditor(){return $("#ndEditor")||$("#mdEditor");}
function rtExec(btn){
  const rt=btn.dataset.rt, ed=curEditor();if(!ed)return;
  ed.focus();
  if(rt==="bold"||rt==="italic"||rt==="underline"){
    document.execCommand(rt);
    btn.classList.toggle("on",document.queryCommandState(rt));
  }else if(rt.startsWith("fs-")){
    document.execCommand("fontSize",false,rt.slice(3));
    [...btn.parentElement.querySelectorAll('[data-rt^="fs-"]')].forEach(b=>b.classList.toggle("on",b===btn));
  }else if(rt.startsWith("lh-")){
    const k=rt.slice(3);
    ed.style.lineHeight=LH_MAP[k];ed.dataset.lh=k;
    [...btn.parentElement.querySelectorAll('[data-rt^="lh-"]')].forEach(b=>b.classList.toggle("on",b===btn));
  }else if(rt==="ol")document.execCommand("insertOrderedList");
  else if(rt==="ul")document.execCommand("insertUnorderedList");
}

function renderTodo(){
  const v=state.todoView||"all";
  const f=state.todoFilter||"all";
  let list=store.todos.slice();
  if(v==="todo")list=list.filter(t=>!t.archived&&!t.done);
  else if(v==="archived")list=list.filter(t=>t.archived);
  else list=list.filter(t=>!t.archived);
  if(f!=="all")list=list.filter(t=>t.priority===f);
  const o={high:0,mid:1,low:2};
  list.sort((a,b)=>(a.done?1:0)-(b.done?1:0)||o[a.priority]-o[b.priority]);
  const dot={high:'<span class="dot dot-h"></span>',mid:'<span class="dot dot-m"></span>',low:'<span class="dot dot-l"></span>'};
  const total=store.todos.length, doneN=store.todos.filter(t=>t.done).length;
  const items=list.map(t=>`<div class="list-item" style="${t.done?"opacity:.5;":""}">
    <div class="li-acts" style="flex:none;gap:0;"><svg data-action="td-done" data-id="${t.id}" title="完成" style="${t.done?'stroke:var(--accent);':''}"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div class="li-main"><div class="li-title" style="display:flex;align-items:center;gap:8px;">${dot[t.priority]} <span style="${t.done?"text-decoration:line-through;color:var(--sub);":""}">${esc(t.title)}</span> ${t.recurring?`<span class="tag">${t.recurring==="daily"?"每日":"每周"}</span>`:""} ${t.duration?`<span class="tag qc">${fmt(t.duration)}</span>`:""}</div>
      <div class="li-sub">${t.date}</div></div>
    <div class="li-acts">
      <span class="act ai" data-action="td-import" data-id="${t.id}" title="导入计时"><svg><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><i>导入</i></span>
      <span class="act" data-action="td-edit" data-id="${t.id}" title="编辑"><svg><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><i>编辑</i></span>
      <span class="act" data-action="td-arc" data-id="${t.id}" title="${t.archived?"恢复待办":"归档"}"><svg><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M1 4h22v4H1z"/><path d="M10 12h4"/></svg><i>${t.archived?"恢复":"归档"}</i></span>
      <span class="act" data-action="td-del" data-id="${t.id}" title="删除"><svg><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><i>删除</i></span>
    </div>
  </div>`).join("");
  const vchip=(k,l)=>`<span class="chip ${v===k?"on":""}" data-action="td-view" data-v="${k}">${l}</span>`;
  const fchip=(k,l)=>`<span class="chip ${f===k?"on":""}" data-tf="${k}">${l}</span>`;
  return `
  <div class="chips-scroll" style="margin-bottom:8px;">
    ${vchip("all","全部")}${vchip("todo","待完成")}${vchip("archived","已归档")}
  </div>
  <div class="chips-scroll" id="todoFilter" style="margin-bottom:14px;">
    ${fchip("all","全部")}${fchip("high","高")}${fchip("mid","中")}${fchip("low","低")}
  </div>

/* ===================== 综合记录（备忘录） ===================== */
const MEMO_TAGS=["灵感","备忘","随笔","摘抄"];
function filteredMemos(){
  let list=store.memos.slice().sort((a,b)=>b.ts-a.ts);
  if(state.memoArchived)list=list.filter(m=>m.archived);
  else list=list.filter(m=>!m.archived);
  if(state.memoStar)list=list.filter(m=>m.star);
  if(state.memoTag!=="all")list=list.filter(m=>m.tag===state.memoTag);
  if(state.memoTime==="today")list=list.filter(m=>dayDiff(m.date)===0);
  if(state.memoTime==="3d")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=2);
  if(state.memoTime==="week")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=6);
  if(state.memoTime==="month")list=list.filter(m=>dayDiff(m.date)>=0&&dayDiff(m.date)<=30);
  if(state.memoQ)list=list.filter(m=>m.content.includes(state.memoQ));
  return list;
}

function saveMemoDetail(){

/* ===================== 渲染调度 ===================== */

/* 点日历遮罩空白处只关日历本身，绝不影响底层的新增/编辑弹窗（避免“弹窗闪退”） */
calOverlay.addEventListener("click",e=>{if(e.target===calOverlay){closeCalModal();}});
/* 移动端：日历弹窗左右滑动切换月份（横向滑动距离 > 纵向，且超过阈值） */
let calSwipeStart=null;
calModal.addEventListener("touchstart",e=>{calSwipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
calModal.addEventListener("touchend",e=>{
  if(!calSwipeStart)return;
  const endX=e.changedTouches[0].clientX,endY=e.changedTouches[0].clientY;
  const dx=endX-calSwipeStart.x,dy=endY-calSwipeStart.y;
  calSwipeStart=null;
  if(Math.abs(dx)<50||Math.abs(dx)<=Math.abs(dy))return;
  if(!calOverlay.classList.contains("show"))return;
  if(dx<0){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++;}}
  else{calMonth.m--;if(calMonth.m<0){calMonth.m=11;calMonth.y--;}}
  refreshCalendar();
},{passive:true});

document.addEventListener("mousedown",e=>{const t=e.target;if(t&&typeof t.closest==="function"&&t.closest(".rt-bar"))e.preventDefault();});

  if(a==="trash-check"){state.trashSel=state.trashSel||[];const ci=state.trashSel.indexOf(id);const chk=el.querySelector("input");if(chk&&chk.checked){if(ci<0)state.trashSel.push(id);}else{if(ci>=0)state.trashSel.splice(ci,1);}return;}
  if(a==="trash-all"){const chk=el.querySelector("input");state.trashSel=chk&&chk.checked?store.trash.map(t=>t.id):[];return;}
  if(a==="trash-restore"){restoreFromTrash(id);render();return;}
  if(a==="trash-purge"){if(confirm("永久删除该数据？此操作不可恢复。")){purgeTrash(id);render();}return;}
  if(a==="trash-restore-sel"){const sel=state.trashSel||[];if(!sel.length){toast("请先勾选要恢复的项");return;}sel.forEach(tid=>restoreFromTrash(tid));state.trashSel=[];render();return;}
  if(a==="trash-purge-sel"){const sel=state.trashSel||[];if(!sel.length){toast("请先勾选要删除的项");return;}if(confirm("永久删除选中的 "+sel.length+" 条数据？此操作不可恢复。")){sel.forEach(tid=>purgeTrash(tid));state.trashSel=[];render();}return;}
  if(a==="trash-clear"){if(!store.trash.length){toast("回收站为空");return;}if(confirm("清空回收站？所有数据将永久删除且不可恢复。")){clearTrash();state.trashSel=[];render();}return;}
  if(a==="trash-panel"){const pid=el.dataset.id;state.trashPanels[pid]=!state.trashPanels[pid];const panel=el.closest(".wk-panel");if(panel){const body=panel.querySelector(".wk-panel-body");const arrow=panel.querySelector(".wp-arrow");if(state.trashPanels[pid]){body.style.display="";arrow.classList.add("open");}else{body.style.display="none";arrow.classList.remove("open");}}return;}

  /* ---- 计时器 ---- */
  if(a==="timer-start"){state.timer.name=$("#timerName")?$("#timerName").value:state.timer.name;timerStart();return;}
  if(a==="timer-pause"){if(state.timer.running)timerPause();else if(state.timer.elapsed>0)timerStart();else{};return;}
  if(a==="timer-stop"){timerStop(false);return;}
  if(a==="hist-more"){histMore();return;}
  if(a==="timer-import"){pickTimer(t=>{markImported(id,"timer");toast("已准备好导入，请在对应页面保存");closeModal();});return;}
  if(a==="timer-edit"){editTimer(id);return;}
  if(a==="timer-archive"){const t=store.timers.find(x=>x.id===id);if(t){t.archived=!t.archived;save();render();}return;}
  if(a==="timer-del"){const t=store.timers.find(x=>x.id===id);if(confirm("删除该计时记录？将移入回收站保留 "+TRASH_DAYS+" 天。")){moveToTrash("timer",t);render();}return;}

  /* ---- 计时器历史：折叠 / 批量 ---- */
  if(a==="hist-fold"){const g=el.dataset.g;state.histFold[g]=(state.histFold[g]!==false)?false:true;renderTimerListOnly();return;}

  if(a==="timer-all"){const total=filteredTimers().length;const shown=Math.min(total,(state.histPage+1)*20);const list=filteredTimers().slice(0,shown);const all=list.length>0&&list.every(t=>state.timerSel.includes(t.id));list.forEach(t=>{const i=state.timerSel.indexOf(t.id);if(all){if(i>=0)state.timerSel.splice(i,1);}else{if(i<0)state.timerSel.push(t.id);}});renderTimerListOnly();return;}
  if(a==="timer-arc-sel"){if(!state.timerSel.length){toast("请先选择计时");return;}state.timerSel.forEach(sid=>{const t=store.timers.find(x=>x.id===sid);if(t)t.archived=true;});const n=state.timerSel.length;state.timerSel=[];save();render();toast("已归档 "+n+" 条计时");return;}
