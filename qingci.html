  /* ---- 倒数日 ---- */
  if(a==="cd-add"){addCountdown();return;}
  if(a==="cd-copy"){const c=store.countdowns.find(x=>x.id===id);if(c)copyToClipboard(cdCopyText(c));return;}
  if(a==="cd-edit"){addCountdown(id);return;}
  if(a==="cd-del"){const c=store.countdowns.find(x=>x.id===id);if(confirm("删除该倒数事件？将移入回收站保留 "+TRASH_DAYS+" 天。")){moveToTrash("countdown",c);render();}return;}
  if(a==="cd-ye"){const c=store.countdowns.find(x=>x.id===id);if(c){c.yearly=!c.yearly;save();render();}return;}
  if(a==="cd-batch"){state.cdBatch=!state.cdBatch;if(!state.cdBatch)state.cdSel=[];render();return;}

  if(a==="cd-del-sel"){if(!state.cdSel.length){toast("请先选择条目");return;}if(confirm("删除选中的 "+state.cdSel.length+" 个事件？将移入回收站保留 "+TRASH_DAYS+" 天。")){state.cdSel.forEach(id2=>{const c=store.countdowns.find(x=>x.id===id2);if(c)moveToTrash("countdown",c);});state.cdSel=[];state.cdBatch=false;render();}return;}
  if(a==="cd-more"){state.cdPage=(state.cdPage||0)+1;render();return;}

  if(a==="cal-next"){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++;}refreshCalendar();return;}

/* 图片附件读取 */
document.addEventListener("change",e=>{
  if(e.target.id==="ndImgFile"||e.target.id==="mdImgFile"){
    const editorId=e.target.id==="ndImgFile"?"ndEditor":"mdEditor";
    const files=[...e.target.files];const reads=files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);}));
    Promise.all(reads).then(imgs=>{const ed=$("#"+editorId);if(!ed)return;imgs.forEach(src=>{const img=document.createElement("img");img.src=src;ed.appendChild(img);});toast("已插入 "+imgs.length+" 张图片");});
    e.target.value="";
  }
  if(e.target.id==="importFile"){
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);Object.assign(store,d);save();toast("数据已导入");go(state.page);}catch(err){alert("导入失败：文件格式不正确");}};
    rd.readAsText(f);
  }
});

function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;";document.body.appendChild(t);}

/* 通用青瓷日期选择字段（替代原生 input[type=date]，避免系统绿色日历弹窗） */
function dateFieldHtml(id,value,placeholder){
  const ph=placeholder||"选择日期（留空为长期有效）";
  const hasValue=!!value;
  const clear=hasValue?`<span class="df-clear" data-action="date-clear" title="清除日期"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>`:"";
  return `<div class="input" style="cursor:pointer;" data-action="date-field" data-dfinput="${id}" data-dfdisp="${id}Display" data-dfdate="${value||""}" data-dfplaceholder="${ph}">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
    <span id="${id}Display" style="color:${hasValue?'var(--text)':'var(--sub)'};flex:1;">${hasValue?value:ph}</span>
    ${clear}
    <input type="hidden" id="${id}" value="${value||""}">
  </div>`;
}

function editTimer(id){
  const t=store.timers.find(x=>x.id===id);if(!t)return;
  openModal(`<h3>编辑计时记录</h3>
    ${field("名称",`<div class="input"><input id="etName" value="${esc(t.name)}"></div>`)}

/* ===================== 全局回收站 ===================== */
const TRASH_DAYS=30;
const TRASH_FROM_NAME={timer:"计时器",countdown:"倒数日",workout:"锻炼计划",study:"学习计划",note:"学习笔记",todo:"每日清单",memo:"日常记录",bill:"账单",account:"账户",autotpl:"自动记账模板"};
const TRASH_KEY={timer:"timers",countdown:"countdowns",workout:"workouts",study:"studies",note:"notes",todo:"todos",memo:"memos",bill:"bills",account:"accounts",autotpl:"autotpls"};
function trashRemainDays(t){return Math.max(0,Math.ceil((t.deletedAt+TRASH_DAYS*86400e3-Date.now())/86400e3));}
function moveToTrash(from,obj){
  if(!obj)return;
  store.trash.push({id:uid(),from,deletedAt:Date.now(),data:JSON.parse(JSON.stringify(obj))});
  const arr=store[TRASH_KEY[from]];
  if(arr)store[TRASH_KEY[from]]=arr.filter(x=>x.id!==obj.id);
  if(from==="account"){store.bills.forEach(b=>{if(b.account===obj.id)b.account=null;});}
  save();toast("已移入回收站（保留 "+TRASH_DAYS+" 天）");
}
function restoreFromTrash(tid){
  const i=store.trash.findIndex(x=>x.id===tid);if(i<0)return;
  const item=store.trash[i];const key=TRASH_KEY[item.from];if(!key){store.trash.splice(i,1);save();return;}
  let data=item.data;
  if(store[key].some(x=>x.id===data.id))data={...data,id:uid()};
  store[key].push(data);
  if(data.timerId){const t=store.timers.find(x=>x.id===data.timerId);if(t){const tag=item.from==="study"?"study":item.from==="todo"?"todo":item.from==="workout"?"workout":null;if(tag&&!t.importedBy.includes(tag))t.importedBy.push(tag);}}
  store.trash.splice(i,1);save();toast("已恢复至原模块");
}
function purgeTrash(tid){store.trash=store.trash.filter(x=>x.id!==tid);save();toast("已永久删除");}
function clearTrash(){store.trash=[];save();toast("回收站已清空");}
function autoPurgeTrash(){const before=store.trash.length;store.trash=store.trash.filter(x=>x.deletedAt+TRASH_DAYS*86400e3>Date.now());if(store.trash.length!==before){save();toast("已自动清理过期的回收站数据");}}
function trashSummary(item){
  const d=item.data;let label="";
  if(item.from==="timer")label=d.name||"计时记录";
  else if(item.from==="countdown")label=d.title||"倒数日";
  else if(item.from==="workout")label=(d.tags&&d.tags.join("、"))||"锻炼记录";
  else if(item.from==="study")label=d.title||"学习任务";
  else if(item.from==="note")label=d.title||(d.content||"").slice(0,20)||"笔记";
  else if(item.from==="todo")label=d.title||"任务";
  else if(item.from==="memo")label=(d.content||"").slice(0,20)||"备忘";
  else if(item.from==="bill")label=(d.cat||"")+" "+fmtMoney(d.amount||0);
  else if(item.from==="account")label=d.name||"账户";
  else if(item.from==="autotpl")label=(d.type==="in"?"收入":"支出")+" "+(d.cat||"")+" "+fmtMoney(d.amount||0);
  return esc(String(label));
}

}

/* ===================== 全局时间线 =====================
   仅聚合读取已有模块数据，不新增录入表单；所有编辑动作跳回原业务模块。 */
function fmtTime(ts){const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());}
function hourOf(ts){const d=new Date(ts);return d.getHours()+d.getMinutes()/60;}
const TL_SRC=[
  {k:"workout",  name:"锻炼计划",   short:"锻炼"},
  {k:"study",    name:"学习计划",   short:"学习"},
  {k:"todo",     name:"每日清单",   short:"清单"},
  {k:"countdown",name:"倒数日",     short:"倒数"},
  {k:"timer",    name:"计时器记录", short:"计时", tip:"历史耗时数据，复盘时开启"}
];
function tlSourceName(s){const o=TL_SRC.find(x=>x.k===s);return o?o.name:s;}
function tlColor(s){return `var(--tl-${s})`;}
const TL_PRIO={high:"高优先级",mid:"中优先级",low:"低优先级"};
function tlOrder(t){return {countdown:0,workout:1,todo:2,study:3,timer:4}[t]!==undefined?{countdown:0,workout:1,todo:2,study:3,timer:4}[t]:9;}
/* 单日学习计划事件：根据任务类型与日期判定当日是否展示，并返回事件描述
   - daily（长期每日打卡）：在生效区间内每日展示，done=当日是否已打卡
   - deadline（限期作业）：建议开始日之前不展示；完成后永不展示；逾期后持续展示并标记 overdue */
function studyEventOnDay(x,ds){
  if(x.archived)return null;
  if(x.type==="daily"){
    const rs=x.rangeStart||"", re=x.rangeEnd||"";
    if(rs&&ds<rs)return null;
    if(re&&ds>re)return null;
    const done=!!(x.checkins&&x.checkins[ds]);
    const bits=[done?"今日已打卡":"待打卡"];
    if(x.priority&&TL_PRIO[x.priority])bits.push(TL_PRIO[x.priority]);
    return {type:"study",id:x.id,date:ds,ts:null,dur:0,stKind:"daily",done,checkin:!done,
      title:x.title||"打卡任务",sub:bits.join(" · ")};
  }
  // deadline（含未迁移旧数据兜底为 deadline）
  const ss=x.suggestStart||"", dl=x.deadline||"";
  if(ss&&ds<ss)return null;          // ① 未到建议开始日不显示
  if(x.done)return null;             // 一旦完成，后续全部日期不再显示
  const overdue=!!(dl&&ds>dl);       // ③ 超过截止日期仍未完成
  const near=!overdue&&!!dl&&daysBetween(ds,dl)>=0&&daysBetween(ds,dl)<=2; // 临近截止
  const bits=[];
  if(overdue)bits.push("已逾期");
  else if(dl)bits.push("截止 "+dl);
  if(x.priority&&TL_PRIO[x.priority])bits.push(TL_PRIO[x.priority]);
  return {type:"study",id:x.id,date:ds,ts:null,dur:0,stKind:"deadline",done:false,overdue,near,canComplete:true,
    title:x.title||"限期作业",sub:bits.join(" · ")||"待完成"};
}
/* 按日期区间聚合事件；ts 为 null 表示「全天 / 未定时」条目 */
function tlEvents(s,e){
  const on=state.tlSrc,arr=[];
  if(on.workout)store.workouts.forEach(w=>{
    if(!w.date||w.date<s||w.date>e)return;
    if(!(w.tags&&w.tags.length))return;                       // 仅统计真实打卡
    const tm=w.timerId?store.timers.find(t=>t.id===w.timerId):null;
    const bits=[];if(w.duration)bits.push(fmt(w.duration));if(w.note)bits.push(w.note);
    arr.push({type:"workout",id:w.id,date:w.date,ts:tm&&tm.ts?tm.ts:null,dur:w.duration||0,done:true,
      title:w.tags.join("、"),sub:bits.join(" · ")||"已完成打卡"});
  });
  if(on.study){
    let cur=s;
    while(cur<=e){
      const ds=cur;
      store.studies.forEach(x=>{const ev=studyEventOnDay(x,ds);if(ev)arr.push(ev);});
      cur=addDays(cur,1);
    }
  }
  if(on.todo)store.todos.forEach(x=>{
    if(x.archived||!x.date||x.date<s||x.date>e)return;
    const bits=[x.done?"已完成":"待完成"];
    if(x.priority&&TL_PRIO[x.priority])bits.push(TL_PRIO[x.priority]);
    if(x.recurring)bits.push(x.recurring==="daily"?"每日重复":x.recurring==="weekly"?"每周重复":"重复");
    arr.push({type:"todo",id:x.id,date:x.date,ts:null,dur:0,done:!!x.done,title:x.title||"待办任务",sub:bits.join(" · ")});
  });
  if(on.countdown)store.countdowns.forEach(c=>{
    if(!c.target)return;
    const hit=[];
    if(c.yearly){
      const md=c.target.slice(5);
      for(let y=+s.slice(0,4);y<=+e.slice(0,4);y++){const ds=y+"-"+md;if(ds>=s&&ds<=e)hit.push(ds);}
    }else if(c.target>=s&&c.target<=e)hit.push(c.target);
    hit.forEach(ds=>{
      const diff=daysBetween(todayStr(),ds);
      const pastDays=diff<0?(Math.abs(diff)+(c.pastMode?1:0)):0;
      const bits=[diff>0?`还有 ${diff} 天`:diff<0?`已经${pastDays}天`:"就是今天"];
      if(c.yearly)bits.push("每年循环");
      if(c.note)bits.push(c.note);
      arr.push({type:"countdown",id:c.id,date:ds,ts:null,dur:0,done:false,title:c.title||"倒数日",sub:bits.join(" · ")});
    });
  });
  if(on.timer)store.timers.forEach(t=>{
    if(t.archived||!t.date||t.date<s||t.date>e)return;
    arr.push({type:"timer",id:t.id,date:t.date,ts:t.ts||null,dur:t.duration||0,done:false,
      title:t.name||"计时记录",sub:fmt(t.duration||0)+(t.mode==="down"?" · 倒计时":" · 正计时")});
  });

    if(a.date!==b.date)return a.date<b.date?-1:1;
    const at=a.ts==null?-1:a.ts, bt=b.ts==null?-1:b.ts;

function tlMonthBody(ds){
  const [ms,me]=monthRange(ds),today=todayStr();

  const by={};items.forEach(x=>{(by[x.date]=by[x.date]||[]).push(x);});
  const y=+ds.split("-")[0],m=+ds.split("-")[1];
  const firstDay=new Date(y+"-"+pad(m)+"-01T00:00:00").getDay(); // 0=周日
  const total=new Date(y+"-"+pad(m+1)+"-01T00:00:00");total.setDate(0);const totalDays=total.getDate();
  const cells=[];
  // 补齐上月空位（从周一开始则 firstDay===1 时前补 1 格；从周日开始则 firstDay 格）
  const startPad=(firstDay+6)%7;
  for(let i=0;i<startPad;i++)cells.push(`<div class="tl-mcell empty"></div>`);
  for(let dnum=1;dnum<=totalDays;dnum++){
    const d=ms.slice(0,8)+pad(dnum);
    const list=by[d]||[];
    const types=[...new Set(list.map(x=>x.type))].slice(0,5);
    const dots=types.length?`<span class="tl-mdots">${types.map(t=>`<i style="background:${tlColor(t)};"></i>`).join("")}</span>`:"";
    const lun=lunarInfo(d);

      <span class="tl-mnum">${dnum}</span>
      <span class="tl-mlun">${esc(lun.text)}</span>
      ${dots}
    </div>`);
  }
  // 补齐尾部使整周 7 列
  while(cells.length%7!==0)cells.push(`<div class="tl-mcell empty"></div>`);

function acctTrendChart(dateStr,period){
  const [s,e]=rangeBy(dateStr,period);
  let labels=[],income=[],expense=[],xLabels=[];
  if(period==="week"){
    const days=weekOf(dateStr);
    labels=days.map(ds=>WD[new Date(ds+"T00:00:00").getDay()]);
    xLabels=days.map(ds=>mdLabel(ds));
    days.forEach(ds=>{const bs=store.bills.filter(b=>b.date===ds);income.push(bs.filter(b=>b.type==="in").reduce((a,b)=>a+b.amount,0));expense.push(bs.filter(b=>b.type==="out").reduce((a,b)=>a+b.amount,0));});
  }else if(period==="month"){
    const y=+dateStr.split("-")[0],m=+dateStr.split("-")[1]-1,dc=new Date(y,m+1,0).getDate();
    labels=Array.from({length:dc},(_,i)=>{const d=i+1;return (d===1||d%5===0||d===dc)?String(d):"";});
    xLabels=Array.from({length:dc},(_,i)=>`${m+1}月${i+1}日`);
    for(let i=0;i<dc;i++){const ds=`${y}-${pad(m+1)}-${pad(i+1)}`;const bs=store.bills.filter(b=>b.date===ds);income.push(bs.filter(b=>b.type==="in").reduce((a,b)=>a+b.amount,0));expense.push(bs.filter(b=>b.type==="out").reduce((a,b)=>a+b.amount,0));}
  }else{
    const y=+dateStr.split("-")[0];
    labels=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    xLabels=labels;
    for(let i=0;i<12;i++){const ms=`${y}-${pad(i+1)}-01`,me=`${y}-${pad(i+1)}-${pad(new Date(y,i+1,0).getDate())}`;const bs=store.bills.filter(b=>b.date>=ms&&b.date<=me);income.push(bs.filter(b=>b.type==="in").reduce((a,b)=>a+b.amount,0));expense.push(bs.filter(b=>b.type==="out").reduce((a,b)=>a+b.amount,0));}
  }
  const hasData=income.some(v=>v>0)||expense.some(v=>v>0);
  const title=period==="week"?"本周收支趋势":period==="month"?"本月收支趋势":"本年收支趋势";
  if(!hasData)return `<div class="chart-title">${title}</div><div class="chart-empty">暂无收支数据</div>`;
  const maxV=Math.max(...income,...expense,1);
  const step=maxV>1000?1000:maxV>100?100:10;
  const yMax=Math.ceil(maxV/step)*step;
  const cols=labels.map((l,i)=>`<div class="acct-col" data-tip="${esc(xLabels[i])} · 收入 ${fmtMoney(income[i])} / 支出 ${fmtMoney(expense[i])}"><div class="bc in" style="height:${Math.min(100,Math.round(income[i]/maxV*100))}%;"></div><div class="bc out" style="height:${Math.min(100,Math.round(expense[i]/maxV*100))}%;"></div></div>`).join("");

/* 自动记账：页面每次加载校验当日模板，去重生成 */
function runAutoTemplates(){
  const today=todayStr();
  const t0=new Date(today+"T00:00:00");
  const wd=t0.getDay(), dom=t0.getDate(), lastDay=new Date(t0.getFullYear(),t0.getMonth()+1,0).getDate();
  let changed=false;
  store.autotpls.forEach(t=>{
    if(!t.enabled)return;
    if(t.start&&today<t.start)return;
    if(t.end&&today>t.end)return;
    let match=false;
    if(t.cycle==="daily")match=true;
    else if(t.cycle==="weekly")match=(t.weekday===wd);
    else if(t.cycle==="monthly")match=(t.monthday===dom)||(t.monthday>lastDay&&dom===lastDay);
    if(!match)return;
    if(store.bills.some(b=>b.tplId===t.id&&b.date===today))return;
    store.bills.push({id:uid(),date:today,type:t.type,amount:t.amount,cat:t.cat,account:t.account,note:(t.note||"")+"【自动记账】",auto:true,tplId:t.id,ts:Date.now()});
    changed=true;
  });
  if(changed)save();
}

  modal.querySelectorAll("#tmCycle .prio-opt").forEach(el=>el.onclick=()=>{cycle=el.dataset.c;modal.querySelectorAll("#tmCycle .prio-opt").forEach(x=>x.classList.remove("on"));el.classList.add("on");renderTmWhen();});
  function renderTmWhen(){
    const f=$("#tmWhenField");if(!f)return;
    if(cycle==="daily"){f.style.display="none";f.innerHTML="";return;}
    f.style.display="";
    if(cycle==="weekly"){f.innerHTML=`<label>每周星期</label><div class="prio-pick" id="tmWk">${WD.map((w,i)=>`<div class="prio-opt ${i===weekday?"on":""}" data-w="${i}">${w}</div>`).join("")}</div>`;const wp=$("#tmWk");if(wp)wp.querySelectorAll(".prio-opt").forEach(el=>el.onclick=()=>{weekday=+el.dataset.w;wp.querySelectorAll(".prio-opt").forEach(x=>x.classList.remove("on"));el.classList.add("on");});}
    else{f.innerHTML=`<label>每月日期</label><div class="input"><input id="tmMd" type="number" min="1" max="31" value="${monthday}" placeholder="1-31"></div>`;}
  }
  $("#tmOk").onclick=()=>{
    const amount=parseFloat($("#tmAmount").value);if(!(amount>0)){toast("请输入有效金额");return;}
    if(!cat){toast("请选择分类");return;}
    let wd2=weekday,md2=monthday;
    if(cycle==="weekly"){const wp=$("#tmWk");if(wp){const on=wp.querySelector(".prio-opt.on");wd2=on?+on.dataset.w:weekday;}}
    if(cycle==="monthly"){const md=$("#tmMd");md2=md?Math.min(31,Math.max(1,parseInt(md.value)||1)):1;}
    const obj={type,amount,cat,account:$("#tmAccount").value||null,note:$("#tmNote").value.trim(),cycle,weekday:wd2,monthday:md2,start:$("#tmStart").value,end:$("#tmEnd").value,enabled:true};
    if(id){const x=store.autotpls.find(y=>y.id===id);if(x)Object.assign(x,obj);}
    else store.autotpls.push(Object.assign({id:uid()},obj));
    save();closeModal();render();toast(id?"模板已更新":"模板已添加");
  };
}

/* ===================== 启动 ===================== */
runAutoTemplates();
go("timeline");
// 移动端返回键守卫：先压入一个空 guard，让返回键触发 popstate 而不是直接退出
history.replaceState({page:"timeline"},"");
history.pushState({guard:true},"");
window.addEventListener("popstate",e=>{
  if(overlay.classList.contains("show")){closeModal();history.pushState({page:state.page},"");return;}
  if(calOverlay.classList.contains("show")){closeCalModal();history.pushState({page:state.page},"");return;}
  const sb=document.querySelector(".sidebar");if(sb&&sb.classList.contains("open")){closeNav();history.pushState({page:state.page},"");return;}
  if(e.state&&e.state.page&&e.state.page!==state.page){
    state.__popping=true;go(e.state.page);state.__popping=false;return;
  }
  // guard 被弹出：若不在首页则回到首页，否则让浏览器默认退出
  if(state.page!=="timeline"){state.__popping=true;go("timeline");state.__popping=false;}
});
</script>
